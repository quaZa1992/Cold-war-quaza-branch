vention","label":"Call a Federal Convention","pp":90,"days":120,"summary":"Arab and Kurdish parties negotiate constitutional authority and revenue. No automatic approval.","unlock":"COLDWAR_IRQ_puk_constitution","group":"puk"},{"id":"COLDWAR_IRQ_decision_dawa_leadership","label":"Select a Political Executive","pp":90,"days":90,"summary":"Documented organizational figures include Abd al-Sahib Dukhayl and Muhammad Hadi al-Subayti. Distinguish their party organization role from al-Sadrs spiritual/intellectual authority; national office is an alternate political outcome. No compulsory execution event.","unlock":"COLDWAR_IRQ_dawa_sadr_thought","group":"dawa"},{"id":"COLDWAR_IRQ_decision_dawa_iran_offer","label":"Offer a Non-Interference Accord","pp":60,"days":90,"summary":"Iran must accept; agreement protects recipient control and does not transfer state authority.","unlock":"COLDWAR_IRQ_dawa_neighbour_talks","group":"dawa"},{"id":"COLDWAR_IRQ_decision_sciri_border_offer","label":"Offer a Border and Non-Interference Treaty","pp":70,"days":90,"summary":"Iran may refuse; no automatic border transfer or end to an active war.","unlock":"COLDWAR_IRQ_sciri_border_agreement","group":"sciri"},{"id":"COLDWAR_IRQ_decision_sciri_aid_offer","label":"Request a Published Reconstruction Package","pp":60,"days":90,"summary":"Actual treasury/debt effects and force permissions require accepted terms.","unlock":"COLDWAR_IRQ_sciri_aid_terms","group":"sciri"},{"id":"COLDWAR_IRQ_decision_iip_congress","label":"Reconstitute the IIP Leadership","pp":90,"days":90,"summary":"Numan al-Samarrai is the documented founding president; Ayad al-Samarrai is a1970 underground youth organizer, not presumed secretary-general. Muhsin Abd al-Hamid is not imported as a post2003 chairman at start. Elect a vetted living period executive.","unlock":"COLDWAR_IRQ_iip_return","group":"sunni"},{"id":"COLDWAR_IRQ_decision_iip_arab_offer","label":"Offer an Arab Civilian Partnership","pp":60,"days":90,"summary":"Partner accepts/refuses. No automatic sectarian bloc or foreign military access.","unlock":"COLDWAR_IRQ_iip_arab_offer","group":"sunni"},{"id":"COLDWAR_IRQ_decision_oil_concession_offer","label":"Submit Revised Concession Terms","pp":75,"days":90,"summary":"Foreign counterpart may accept/refuse; no concession benefit before accepted terms.","unlock":"COLDWAR_IRQ_oil_renegotiate","group":"oil"},{"id":"COLDWAR_IRQ_decision_oil_market_review","label":"Review the Oil Market Position","pp":40,"days":60,"summary":"Read current world-price/sanctions state. No unilateral increase of the world oil price.","unlock":"COLDWAR_IRQ_oil_revenue_ledger","group":"oil"},{"id":"COLDWAR_IRQ_decision_oil_contract_review","label":"Renegotiate an Export Contract","pp":60,"days":90,"summary":"Replaces the selected contract; never stacks every past contract or grants free sanctions immunity.","unlock":"COLDWAR_IRQ_oil_contract_review","group":"oil"},{"id":"COLDWAR_IRQ_decision_industry_pipeline","label":"Review Funded Industrial Projects","pp":25,"days":30,"summary":"Pending projects retain a frozen invoice. Capacity/control failure delivers no benefit and charges no treasury.","unlock":"COLDWAR_IRQ_industry_survey","group":"industry"},{"id":"COLDWAR_IRQ_decision_industry_credit","label":"Request an Industrial Credit Agreement","pp":60,"days":90,"summary":"Accepted lender debit and matching Iraqi treasury/debt; ordinary domestic investment remains possible if refused.","unlock":"COLDWAR_IRQ_industry_credit_finance","group":"industry"},{"id":"COLDWAR_IRQ_decision_industry_repay","label":"Repay an Industrial Credit Tranche","pp":25,"days":30,"summary":"Repay min(real debt, available treasury, selected tranche); no free cancellation of foreign claims.","unlock":"COLDWAR_IRQ_industry_debt_accounts","group":"industry"},{"id":"COLDWAR_IRQ_decision_industry_reallocate","label":"Reallocate the Next Investment Round","pp":80,"days":90,"summary":"Select one current future-investment policy. Existing factories remain; no second grant from repeating review.","unlock":"COLDWAR_IRQ_industry_delivery_review","group":"industry"},{"id":"COLDWAR_IRQ_decision_agri_water_offer","label":"Offer a River Management Conference","pp":70,"days":120,"summary":"Turkey and Syria respond separately. No free water resource, new dam or automatic treaty.","unlock":"COLDWAR_IRQ_agri_river_talks","group":"agriculture"},{"id":"COLDWAR_IRQ_decision_society_audit","label":"Review Education and Service Coverage","pp":30,"days":60,"summary":"Reads existing native education/law data. Does not reset literacy each time government changes.","unlock":"COLDWAR_IRQ_society_baseline","group":"society"},{"id":"COLDWAR_IRQ_decision_society_revision","label":"Review Social Coverage and Funding","pp":90,"days":120,"summary":"Replace the selected coverage policy; permanent literacy and built infrastructure remain.","unlock":"COLDWAR_IRQ_society_service_compact","group":"society"},{"id":"COLDWAR_IRQ_decision_defence_soviet_advisers","label":"Request Soviet Advisers","pp":60,"days":90,"summary":"Counterpart accepts/refuses; advice has cost and duration. No automatic division, licence or research tech.","unlock":"COLDWAR_IRQ_defence_soviet_offer","group":"defence"},{"id":"COLDWAR_IRQ_decision_defence_readiness_cycle","label":"Fund a Readiness Cycle","pp":50,"days":90,"summary":"Cost2% frozen currentGDP; temporary +3%divisionorganisation and +4%army personnel cost for90days,180daycooldown. Expiry never restores an old cycle.","budget_gdp_share":0.02,"modifiers":{"army_org_factor":0.03,"army_personnel_cost_multiplier_modifier":0.04},"cooldown":180,"unlock":"COLDWAR_IRQ_defence_readiness","group":"defence"},{"id":"COLDWAR_IRQ_decision_war_mediation","label":"Request Crisis Mediation","pp":60,"days":90,"summary":"Actual counterpart and mediators choose. No imposed peace or forced outcome.","unlock":"COLDWAR_IRQ_war_crisis_channel","group":"war"},{"id":"COLDWAR_IRQ_decision_war_authorization","label":"Authorize a Specific War Proposal","pp":150,"days":30,"summary":"Explicit target, claim/legal basis, current crisis and player confirmation through an event. No automatic1980 or1990 invasion; native declaration rules remain.","unlock":"COLDWAR_IRQ_war_deliberate_authority","group":"war"},{"id":"COLDWAR_IRQ_decision_war_debt_conference","label":"Request a Postwar Debt Conference","pp":70,"days":120,"summary":"Creditors can refuse. No automatic Gulf write-off, claim onKuwait or new war.","unlock":"COLDWAR_IRQ_war_credit_burden","group":"war"},{"id":"COLDWAR_IRQ_decision_war_sanctions_diplomacy","label":"Request a Sanctions Review","pp":80,"days":90,"summary":"Only while actually sanctioned. Sanctioning states/UN mechanism decide; no free embargo immunity.","unlock":"COLDWAR_IRQ_war_sanctions_response","group":"war"},{"id":"COLDWAR_IRQ_decision_war_emergency_review","label":"Review Remaining Emergency Measures","pp":80,"days":90,"summary":"End active war-policy costs and bonuses after peace; veteran support remains a real budget choice.","unlock":"COLDWAR_IRQ_war_peace_dividend","group":"war"},{"id":"COLDWAR_IRQ_decision_iran_frontier_review","label":"Review the Eastern Balance","pp":25,"days":30,"summary":"Expose actual Iranian stability, war status, owned Khuzestan and the Iraqi northern burden. Never manufacture an Iranian revolution or a loyal Arab uprising.","unlock":"COLDWAR_IRQ_iran_frontier","group":"iran_war"},{"id":"COLDWAR_IRQ_decision_iran_revoke_settlement","label":"Repudiate the Border Settlement","pp":75,"days":0,"summary":"Available only for an actual live Iran border settlement. Clear that agreement and its reciprocal benefits, restore the unresolved-river burden and notify Iran. This is a unilateral hostile act; Iran cannot veto its repudiation. It does not create a second claim or force war.","proposed_provider":"COLDWAR_IRQ_revoke_actual_iran_settlement","unlock":"COLDWAR_IRQ_iran_shatt_demand","group":"iran_war"},{"id":"COLDWAR_IRQ_decision_iran_disarray","label":"Exploit Iranian Disarray","pp":50,"days":0,"summary":"Once only; Iran must actually have civil war or stability below 40%. Cost 1% frozenGDP. Planning speed +10% for 120 days. This optional opportunity is not needed to obtain the war goal.","budget_gdp_share":0.01,"repeatable":false,"eligibility":"country_exists = PER; PER = { OR = { has_civil_war = yes has_stability < 0.40 } }; NOT = { has_country_flag = COLDWAR_IRQ_iran_disarray_used }","effect_code":"# After the common once-only paid transaction:\nadd_timed_idea = { idea = COLDWAR_IRQ_iran_disarray_assessment days = 120 }\nset_country_flag = COLDWAR_IRQ_iran_disarray_used","unlock":"COLDWAR_IRQ_iran_tehran_assessment","group":"iran_war"},{"id":"COLDWAR_IRQ_decision_iran_gulf_credit","label":"Request Gulf War Credit","pp":60,"days":90,"summary":"Select a real Gulf creditor. Terms, amount, Iraqi debt, repayment and creditor treasury debit require recipient acceptance. Refusal cannot block the ultimatum. No free oil, loans or divisions.","proposed_provider":"COLDWAR_IRQ_offer_actual_gulf_war_credit","unlock":"COLDWAR_IRQ_iran_gulf_credit","group":"iran_war"},{"id":"COLDWAR_IRQ_decision_iran_supplier","label":"Negotiate a Wartime Supply Contract","pp":60,"days":60,"summary":"Choose a current eligible arms supplier and actual equipment. Acceptance, treasury, availability and delivery use native trade/arms systems. No free equipment or Soviet commitment is assumed.","proposed_provider":"COLDWAR_IRQ_offer_actual_wartime_supply_contract","unlock":"COLDWAR_IRQ_iran_supplier_access","group":"iran_war"},{"id":"COLDWAR_IRQ_decision_iran_opening","label":"Launch the Khuzestan Offensive","pp":75,"days":0,"summary":"Once per campaign history, after the offensive focus and within the first 30 days of the first Iraqi-Iranian war. Pay a frozen 2% GDP invoice. Short-war plan: +8% attack against PER, +15% planning speed, +8% supply use and +10% army fuel use for 90 days. Sustained plan: +5% attack against PER, +10% planning speed, +5% supply use and +6% army fuel use for 120 days. Both create a 180 day +8% army personnel bill that survives early peace. Attack is PER-targeted; planning and logistical effects are country-wide. No automatic declaration.","budget_gdp_share":0.02,"repeatable":false,"eligibility":"has_war_with = PER; earned iran_launch_campaign; first-war window open; no COLDWAR_IRQ_iran_opening_used flag; invoice affordable","effect_code":"# NEW transaction/window integration: apply only after all eligibility and frozen-invoice checks pass.\n# Native payload; the shared consumed flag is permanent and never cleared on peace or a party change.\nif = {\n limit = { has_country_flag = COLDWAR_IRQ_iran_short_war_implemented }\n add_timed_idea = { idea = COLDWAR_IRQ_iran_opening_offensive days = 90 }\n}\nelse = { add_timed_idea = { idea = COLDWAR_IRQ_iran_sustained_offensive days = 120 } }\nadd_timed_idea = { idea = COLDWAR_IRQ_iran_mobilization_bill days = 180 }\nset_country_flag = COLDWAR_IRQ_iran_opening_used\nclr_country_flag = COLDWAR_IRQ_iran_campaign_window_open","unlock":"COLDWAR_IRQ_iran_launch_campaign","group":"iran_war"},{"id":"COLDWAR_IRQ_decision_iran_followup","label":"Fund a Renewed Offensive","pp":100,"days":0,"summary":"After the opening has ended and at least 90 days of actual war. Pay a frozen 3% GDP invoice; +5% attack against PER for 60 days, with +12% supply and +12% army fuel use. A separate +12% army personnel bill lasts 90 days even after peace.180 day cooldown; no overlapping opening/follow-up bonus or previous follow-up bill. Earlier mobilization bills may still be payable.","budget_gdp_share":0.03,"repeatable":true,"cooldown":180,"eligibility":"has_war_with = PER;90continuous war days; NOT any opening/followup idea or followup bill; frozen invoice affordable","effect_code":"# After the common eligible, non-overlapping paid transaction:\nadd_timed_idea = { idea = COLDWAR_IRQ_iran_followup_offensive days = 60 }\nadd_timed_idea = { idea = COLDWAR_IRQ_iran_followup_bill days = 90 }","unlock":"COLDWAR_IRQ_iran_another_offensive","group":"iran_war"},{"id":"COLDWAR_IRQ_decision_iran_war_aims","label":"Revise the War Aims","pp":80,"days":30,"summary":"Choose continued prosecution, a new offensive or a limited negotiated offer. Iran may refuse settlement; no forced peace, claim removal or free debt relief. Ending the war suspends emergency bonuses and attrition, while fixed-duration bills still expire on their original dates.","unlock":"COLDWAR_IRQ_iran_no_easy_exit","group":"iran_war"},{"id":"COLDWAR_IRQ_decision_retry_pending","label":"Deliver a Pending Programme","pp":0,"days":0,"summary":"Available from start when any completed focus has a pending delivery. Select one pending item; recheck its exact government, live contract, ownership/control, native capacity and frozen invoice. Execute its same once-only delivery guard. Failed retry charges nothing. No new quote or duplicated reward.","unlock":"START","group":"state","repeatable":true,"cooldown":0,"proposed_provider":"COLDWAR_IRQ_retry_selected_pending_programme","eligibility":"IRQ; at least one COLDWAR_IRQ_<focus>_pending flag; chosen focus not yet implemented"},{"id":"COLDWAR_IRQ_decision_organize_western","label":"Organize the Western Outlook","pp":55,"days":90,"summary":"Available from start without a focus or governing-party requirement. Select an actually registered party of this outlook; a completed campaign supplies native +3-point party-support and +3-point outlook inputs, followed by MD normalization. Final gains follow the native array calculation. Costs55PP;180day cooldown. Does not install a government. Western/Non-Aligned historical parties require approved roster registration.","unlock":"START","group":"state","repeatable":true,"cooldown":180,"outlook":"western","known_party_slot":null,"effect_code":"set_temp_variable = { party_index = COLDWAR_IRQ_selected_registered_party }\nset_temp_variable = { party_popularity_increase = 0.03 }\nset_temp_variable = { temp_outlook_increase = 0.03 }\nchange_relative_party_popularity = yes\nset_temp_variable = { temp_outlook_increase = 0 }","proposed_provider":"COLDWAR_IRQ_selected_registered_party"},{"id":"COLDWAR_IRQ_decision_organize_emerging","label":"Organize the Emerging Outlook","pp":55,"days":90,"summary":"Available from start without a focus or governing-party requirement. Select an actually registered party of this outlook; a completed campaign supplies native +3-point party-support and +3-point outlook inputs, followed by MD normalization. Final gains follow the native array calculation. Costs55PP;180day cooldown. Does not install a government. Western/Non-Aligned historical parties require approved roster registration.","unlock":"START","group":"state","repeatable":true,"cooldown":180,"outlook":"emerging","known_party_slot":4,"effect_code":"set_temp_variable = { party_index = COLDWAR_IRQ_selected_registered_party }\nset_temp_variable = { party_popularity_increase = 0.03 }\nset_temp_variable = { temp_outlook_increase = 0.03 }\nchange_relative_party_popularity = yes\nset_temp_variable = { temp_outlook_increase = 0 }","proposed_provider":"COLDWAR_IRQ_selected_registered_party"},{"id":"COLDWAR_IRQ_decision_organize_nonaligned","label":"Organize the Non-Aligned Outlook","pp":55,"days":90,"summary":"Available from start without a focus or governing-party requirement. Select an actually registered party of this outlook; a completed campaign supplies native +3-point party-support and +3-point outlook inputs, followed by MD normalization. Final gains follow the native array calculation. Costs55PP;180day cooldown. Does not install a government. Western/Non-Aligned historical parties require approved roster registration.","unlock":"START","group":"state","repeatable":true,"cooldown":180,"outlook":"nonaligned","known_party_slot":null,"effect_code":"set_temp_variable = { party_index = COLDWAR_IRQ_selected_registered_party }\nset_temp_variable = { party_popularity_increase = 0.03 }\nset_temp_variable = { temp_outlook_increase = 0.03 }\nchange_relative_party_popularity = yes\nset_temp_variable = { temp_outlook_increase = 0 }","proposed_provider":"COLDWAR_IRQ_selected_registered_party"},{"id":"COLDWAR_IRQ_decision_organize_nationalist","label":"Organize the Nationalist Outlook","pp":55,"days":90,"summary":"Available from start without a focus or governing-party requirement. Select an actually registered party of this outlook; a completed campaign supplies native +3-point party-support and +3-point outlook inputs, followed by MD normalization. Final gains follow the native array calculation. Costs55PP;180day cooldown. Does not install a government. Western/Non-Aligned historical parties require approved roster registration.","unlock":"START","group":"state","repeatable":true,"cooldown":180,"outlook":"nationalist","known_party_slot":21,"effect_code":"set_temp_variable = { party_index = COLDWAR_IRQ_selected_registered_party }\nset_temp_variable = { party_popularity_increase = 0.03 }\nset_temp_variable = { temp_outlook_increase = 0.03 }\nchange_relative_party_popularity = yes\nset_temp_variable = { temp_outlook_increase = 0 }","proposed_provider":"COLDWAR_IRQ_selected_registered_party"}],"starting_spirits":[{"id":"COLDWAR_IRQ_spirit_july_state","label":"The July State","owner":"Baath government","description":"The 1968 regime rests on the Revolutionary Command Council, party organization and coercive institutions. State consolidation conceals factional insecurity.","modifiers":{"political_power_factor":0.08,"drift_defence_factor":0.15,"stability_factor":-0.08,"bureaucracy_cost_multiplier_modifier":0.08},"treatment":"Baath institutional choices replace this spirit; suspend it when Baath leaves government. Never turn the later Saddam personality cult into a January 1970 fact."},{"id":"COLDWAR_IRQ_spirit_unsettled_north","label":"An Unsettled Northern Question","owner":"National situation","description":"The Kurdish war and unresolved demands for autonomy strain Baghdad. The March 1970 accord is still a negotiation, not a starting achievement.","modifiers":{"stability_factor":-0.12,"army_personnel_cost_multiplier_modifier":0.1,"supply_consumption_factor":0.04},"treatment":"A fulfilled autonomy contract reduces the national burden; negotiated federal settlement replaces it. Local insecurity is not simulated with resistance on Iraqi cores."},{"id":"COLDWAR_IRQ_spirit_ipc","label":"Oil Beneath Foreign Concessions","owner":"National situation","description":"The Iraq Petroleum Company concession system and disputes over production constrain control over oil revenue despite the 1961 expropriation of undeveloped concession areas.","modifiers":{"oil_export_multiplier_modifier":-0.18},"treatment":"Nationalization or a renegotiated concession replaces this modifier. Oil remains finite map resources; no second fictional oil income system."},{"id":"COLDWAR_IRQ_spirit_rural","label":"The Unfinished Agrarian Reform","owner":"National situation","description":"Unequal landholding, weak delivery of reform, rural credit shortages and limited irrigation hinder agriculture and encourage migration.","modifiers":{"agricolture_productivity_modifier":-0.12,"consumer_goods_factor":0.03},"treatment":"Agricultural credit, tenure and irrigation milestones remove separate penalties. Agriculture input values follow MD calculations, not literal historical output percentages."},{"id":"COLDWAR_IRQ_spirit_literacy","label":"A Narrow Base of Skills","owner":"National situation","description":"Low literacy and uneven access to education restrict the capacity to absorb complex civilian and military technology.","modifiers":{},"native_system":"Native MD literacy/education dynamic modifier; proposed literacy_rate = 0.35, calibration pending historical evidence. No extra research penalty.","native_consequences":{"Research speed":"-30%","Education expenditure multiplier":"+60%","Productivity growth input":"-1.20 MD points","Office productivity":"-30%","Agriculture productivity modifier":"+30% (native education workforce mapping)"},"treatment":"Initialize the missing1970 literacy input once, then use update_literacy_rate. Native education already calculates research, skills and costs. Proposed35% is a balance placeholder, not a verified historical statistic."},{"id":"COLDWAR_IRQ_spirit_patronage","label":"Patronage and Parallel Chains of Command","owner":"National situation","description":"Personal networks and competing civilian, security and military authorities obstruct administration. This is not a claim that every Iraqi institution was equally dysfunctional.","modifiers":{"bureaucracy_cost_multiplier_modifier":0.1,"tax_gain_multiplier_modifier":-0.06,"army_org_factor":-0.05},"treatment":"Civil service audit and command reforms address distinct components; no duplicated native corruption-tier penalty or free blanket corruption removal."},{"id":"COLDWAR_IRQ_spirit_frontier","label":"The Shatt al-Arab Dispute","owner":"Conditional frontier situation","description":"The border and navigation dispute with Iran worsened in 1969. It is a diplomatic problem with potential military costs, not an unavoidable future war.","modifiers":{"army_personnel_cost_multiplier_modifier":0.05,"foreign_influence_modifier":-0.05},"treatment":"Accepted and fulfilled navigation/border settlement replaces this. Neither the 1975 settlement nor the 1980 invasion is applied at game start."}],"modifier_labels":{"stability_factor":["Stability","%"],"political_power_factor":["Political power gain","%"],"drift_defence_factor":["Ideology drift defence","%"],"production_speed_buildings_factor":["Construction speed","%"],"industrial_capacity_factory":["Military factory output","%"],"production_factory_max_efficiency_factor":["Production efficiency cap","%"],"production_factory_efficiency_gain_factor":["Production efficiency growth","%"],"consumer_goods_factor":["Consumer goods factor","%"],"tax_gain_multiplier_modifier":["Tax revenue multiplier","%"] <style>
#coldwar-iraq-concept{--irq-bg:#222e34;--irq-panel:#354146;--irq-deep:#19272d;--irq-text:#e6e5d6;--irq-muted:#b9c5c7;--irq-gold:#d6c38c;--irq-line:#97aaac;--irq-red:#d9a287;color:var(--irq-text);font-family:Georgia,serif}
#coldwar-iraq-concept *{box-sizing:border-box}
#coldwar-iraq-concept .irq-window{background:var(--irq-bg);border:1px solid #647175;overflow:hidden}
#coldwar-iraq-concept .irq-header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border-bottom:2px solid #91835a;background:linear-gradient(#485358,#303c42)}
#coldwar-iraq-concept h2{margin:2px 0 0;font-weight:500;color:var(--irq-text)}
#coldwar-iraq-concept .irq-header span{font-family:Arial,sans-serif;color:var(--irq-gold)}
#coldwar-iraq-concept .irq-status{max-width:180px;text-align:right}
#coldwar-iraq-concept .irq-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:12px;background:var(--irq-deep);font-family:Arial,sans-serif}
#coldwar-iraq-concept .irq-tools label{flex:1 1 245px;min-width:0;color:var(--irq-muted)}
#coldwar-iraq-concept select{display:block;width:100%;max-width:100%;margin-top:5px;padding:8px;color:var(--irq-text);background:#35454b;border:1px solid #7f8b85;font:inherit}
#coldwar-iraq-concept button{font:inherit;color:var(--irq-text)}
#coldwar-iraq-concept .irq-camera,#coldwar-iraq-concept .irq-navigation{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:Arial,sans-serif}
#coldwar-iraq-concept .irq-camera{flex-basis:100%}
#coldwar-iraq-concept .irq-camera button,#coldwar-iraq-concept .irq-navigation button{padding:8px 10px;border:1px solid #838d7b;background:linear-gradient(#4d5754,#35433d);border-radius:2px}
#coldwar-iraq-concept .irq-camera button:hover,#coldwar-iraq-concept .irq-navigation button:hover{border-color:var(--irq-gold)}
#coldwar-iraq-concept .irq-meta{padding:10px 14px;min-height:42px;font-family:Arial,sans-serif;color:var(--irq-muted)}
#coldwar-iraq-concept .irq-map{height:590px;position:relative;overflow:hidden;touch-action:none;user-select:none;background:radial-gradient(ellipse at center,#364b53,#19292f);cursor:grab;isolation:isolate}
#coldwar-iraq-concept .irq-map.dragging{cursor:grabbing}
#coldwar-iraq-concept .irq-world{position:absolute;left:0;top:0;transform-origin:0 0}
#coldwar-iraq-concept .irq-links{position:absolute;inset:0;pointer-events:none;overflow:visible}
#coldwar-iraq-concept .irq-links .prerequisite{fill:none;stroke:var(--irq-line);stroke-width:2}
#coldwar-iraq-concept .irq-links .exclusive{fill:none;stroke:var(--irq-red);stroke-width:2;stroke-dasharray:5 4}
#coldwar-iraq-concept .irq-links .choice-cross{fill:var(--irq-red);font-size:18px;text-anchor:middle}
#coldwar-iraq-concept .irq-node{position:absolute;display:block;padding:0;width:165px;height:128px;background:none;border:0;color:var(--irq-text);font-family:Georgia,serif;cursor:inherit}
#coldwar-iraq-concept .irq-icon{position:absolute;left:87.5px;top:20px;transform:translate(-50%,-50%);pointer-events:none}
#coldwar-iraq-concept .irq-titlebar{position:absolute;left:5px;top:40px;width:164px;height:50px;pointer-events:none}
#coldwar-iraq-concept .irq-title{position:absolute;left:15px;top:58px;width:147px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden;pointer-events:none;font-size:14px;color:var(--irq-text)}
#coldwar-iraq-concept .irq-title canvas{display:block;width:147px;height:20px}
#coldwar-iraq-concept .irq-node[aria-pressed="true"] .irq-icon{filter:drop-shadow(0 0 5px #e4d696)}
#coldwar-iraq-concept .irq-node[aria-pressed="true"] .irq-title{color:#fff0b0}
#coldwar-iraq-concept .irq-node.is-locked .irq-icon{filter:grayscale(.65) brightness(.65)}
#coldwar-iraq-concept .irq-group-label{position:absolute;font-weight:500;text-align:center;width:600px;color:var(--irq-gold);pointer-events:none}
#coldwar-iraq-concept .irq-world.overview .irq-title{visibility:hidden}
#coldwar-iraq-concept .irq-map-key{position:absolute;bottom:10px;left:10px;right:10px;width:fit-content;max-width:calc(100% - 20px);background:#19272deb;padding:6px 9px;font-family:Arial,sans-serif;color:var(--irq-muted);pointer-events:none}
#coldwar-iraq-concept .irq-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--irq-deep);font-family:Arial,sans-serif;color:var(--irq-muted)}
#coldwar-iraq-concept .irq-navigation{padding:10px 14px;background:var(--irq-deep);border-top:1px solid #58676b}
#coldwar-iraq-concept .irq-inspector{padding:18px;background:var(--irq-panel);overflow-wrap:anywhere;font-family:Arial,sans-serif}
#coldwar-iraq-concept .irq-inspector h3{font-family:Georgia,serif;font-weight:500;color:var(--irq-gold);margin:0 0 8px}
#coldwar-iraq-concept .irq-inspector h4{font-weight:500;margin-bottom:6px}
#coldwar-iraq-concept .irq-inspector p{margin:8px 0}
#coldwar-iraq-concept .irq-inspector li{margin:5px 0}
#coldwar-iraq-concept .irq-inspector details{margin-top:12px}
#coldwar-iraq-concept pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--irq-deep);padding:12px;color:var(--irq-text)}
#coldwar-iraq-concept .irq-spirit{padding:12px 0;border-bottom:1px solid #6a7779}
#coldwar-iraq-concept .irq-branch-index{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#coldwar-iraq-concept .irq-branch-index button{border:1px solid #7d8981;background:var(--irq-deep);padding:6px 8px;font-family:Arial,sans-serif}
@media(max-width:500px){#coldwar-iraq-concept .irq-header{padding:12px;gap:10px}#coldwar-iraq-concept .irq-status{max-width:130px}#coldwar-iraq-concept .irq-map{height:510px}#coldwar-iraq-concept select{font-size:16px}#coldwar-iraq-concept .irq-camera button,#coldwar-iraq-concept .irq-navigation button{min-height:44px}#coldwar-iraq-concept .irq-inspector{padding:12px}}
</style>
<script>
(()=>{
 const root=document.getElementById('coldwar-iraq-concept');
 const data=JSON.parse(document.getElementById('irq-data').textContent);
 const map=root.querySelector('#irq-map'),world=root.querySelector('#irq-world'),svg=root.querySelector('.irq-links');
 const select=root.querySelector('#irq-branch'),government=root.querySelector('#irq-government'),detail=root.querySelector('#irq-detail'),meta=root.querySelector('#irq-meta');
 const nodes=new Map(data.nodes.map(n=>[n.id,n])),groups=new Map(data.groups.map(g=>[g.id,g]));
 for(const n of data.nodes){n.ownership=groups.get(n.group).ownership;n.active_condition??=n.available;}
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pos=n=>({x:n.xy[0]*96,y:n.xy[1]*130});
 let current='iran_war',picked='COLDWAR_IRQ_iran_arabistan_claim',mode='tree',camera={x:0,y:0,z:1},drag=null,cameraMode='native',suppressClickUntil=0,wheelSave;
 const sections=[['shared','National development'],['nationalist','Nationalist programmes'],['emerging','Emerging programmes'],['nonaligned','Non-Aligned programmes'],['western','Western programmes']];
 for(const [id,title] of sections){const optgroup=document.createElement('optgroup');optgroup.label=title;for(const g of data.groups.filter(g=>g.outlook===id)){const o=document.createElement('option');o.value=g.id;o.textContent=g.label;optgroup.append(o);}select.append(optgroup);}
 function svgEl(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);return el;}
 const width=Math.max(...data.nodes.map(n=>pos(n).x))+350,height=Math.max(...data.nodes.map(n=>pos(n).y))+220;
 world.style.width=width+'px';world.style.height=height+'px';svg.setAttribute('width',width);svg.setAttribute('height',height);
 for(const n of data.nodes){const p=pos(n);for(const row of n.prerequisites)for(const id of row){const q=pos(nodes.get(id)),x1=q.x+80,y1=q.y+90,x2=p.x+80,y2=p.y-26,mid=(y1+y2)/2;const line=svgEl('path',{class:'prerequisite',d:`M${x1},${y1} V${mid} H${x2} V${y2}`});line.dataset.from=id;line.dataset.to=n.id;svg.append(line);}
  for(const id of n.mutually_exclusive){if(id<n.id)continue;const q=pos(nodes.get(id)),x1=Math.min(p.x,q.x)+139,x2=Math.max(p.x,q.x)+27,y=p.y+20;svg.append(svgEl('path',{class:'exclusive',d:`M${x1},${y} H${x2}`}));const t=svgEl('text',{class:'choice-cross',x:(x1+x2)/2,y:y-5});t.textContent='×';svg.append(t);}
  const b=document.createElement('button');b.type='button';b.className='irq-node cursor-interaction';b.dataset.node=n.id;b.setAttribute('aria-label',n.title);b.setAttribute('data-tooltip',n.title);b.setAttribute('aria-pressed','false');b.style.left=p.x+'px';b.style.top=p.y+'px';b.innerHTML=`<img class="irq-icon" src="${data.assets.icons[n.icon]}" alt=""><img class="irq-titlebar" src="${data.assets.unavailable}" alt=""><span class="irq-title">${esc(n.title)}</span>`;world.append(b);
 }
 for(const g of data.groups){const list=data.nodes.filter(n=>n.group===g.id),xs=list.map(n=>pos(n).x),ys=list.map(n=>pos(n).y);const label=document.createElement('div');label.className='irq-group-label';label.textContent=g.label;label.style.left=((Math.min(...xs)+Math.max(...xs))/2+82-300)+'px';label.style.top=(Math.min(...ys)-90)+'px';world.append(label);}
 const atlas=new Image();atlas.onload=()=>{for(const b of world.querySelectorAll('.irq-node')){const n=nodes.get(b.dataset.node),canvas=document.createElement('canvas');canvas.width=147;canvas.height=20;canvas.setAttribute('aria-hidden','true');const ctx=canvas.getContext('2d'),chars=[...n.title],glyphs=data.assets.font_glyphs,kern=data.assets.font_kernings;const total=chars.reduce((s,c,i)=>s+(glyphs[c.codePointAt(0)]||glyphs[63])[6]+(i?(kern[chars[i-1].codePointAt(0)+','+c.codePointAt(0)]||0):0),0);let x=Math.floor((147-total)/2),previous=null;for(const c of chars){const cp=c.codePointAt(0),g=glyphs[cp]||glyphs[63];x+=kern[previous+','+cp]||0;ctx.drawImage(atlas,g[0],g[1],g[2],g[3],x+g[4],2+g[5],g[2],g[3]);x+=g[6];previous=cp;}b.querySelector('.irq-title').replaceChildren(canvas);}};atlas.src=data.assets.font_atlas;
 const activeGroups={bakr:['state','baath','bakr'],saddam:['state','baath','saddam'],aziz:['state','communists','aziz'],civic:['state','civic'],kurds:['state','kurds']};
 for(const g of data.groups.filter(g=>g.outlook!=='shared'&&!['baath','communists'].includes(g.id))){if(![...government.options].some(o=>o.value===g.id)){const o=document.createElement('option');o.value=g.id;o.textContent=g.label+' · ALT government';government.append(o);}if(!activeGroups[g.id])activeGroups[g.id]=['state',g.id];}
 function available(n){return government.value==='all'||groups.get(n.group).outlook==='shared'||(activeGroups[government.value]||[]).includes(n.group);}
 function paintGovernment(){for(const b of world.querySelectorAll('.irq-node')){const n=nodes.get(b.dataset.node),ok=available(n);b.classList.toggle('is-locked',!ok);b.querySelector('.irq-titlebar').src=ok?data.assets.available:data.assets.unavailable;}root.querySelector('#irq-total').textContent=`${data.nodes.length} focuses · ${data.decisions.length} decisions · 7 starting spirits`;}
 function transform(){world.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;world.classList.toggle('overview',camera.z<.65);root.querySelector('#irq-zoom').textContent=Math.round(camera.z*100)+'%';}
 function bounds(all=false){const list=all?data.nodes:data.nodes.filter(n=>n.group===current),ps=list.map(pos);return{left:Math.min(...ps.map(p=>p.x))-25,top:Math.min(...ps.map(p=>p.y))-100,right:Math.max(...ps.map(p=>p.x))+195,bottom:Math.max(...ps.map(p=>p.y))+140};}
 function fit(all=false,native=false){cameraMode=all?'overview':native?'native':'fit';const b=bounds(all),w=map.clientWidth,h=map.clientHeight-root.querySelector('.irq-map-key').offsetHeight-18;camera.z=native?1:Math.min(1,(w-30)/(b.right-b.left),(h-30)/(b.bottom-b.top));camera.x=(w-(b.right-b.left)*camera.z)/2-b.left*camera.z;camera.y=native?45-b.top:(h-(b.bottom-b.top)*camera.z)/2-b.top*camera.z;transform();}
 function zoom(f,cx=map.clientWidth/2,cy=map.clientHeight/2){cameraMode='manual';const z=Math.max(.04,Math.min(1.6,camera.z*f));camera.x=cx-(cx-camera.x)*z/camera.z;camera.y=cy-(cy-camera.y)*z/camera.z;camera.z=z;transform();}
 function state(){return{modelContent:{country:'Iraq1970',selectedProgramme:groups.get(current)?.label,selectedFocus:nodes.get(picked)?.title,government:government.value,view:mode},privateContent:{version:5,current,picked,government:government.value,mode,camera:{...camera},cameraMode}};}
 function remember(){window.openai?.setWidgetState?.(state()).catch(()=>{});}
 function pick(n){picked=n.id;for(const b of world.querySelectorAll('.irq-node'))b.setAttribute('aria-pressed',String(b.dataset.node===picked));
  const pre=n.prerequisites.map(row=>row.map(id=>nodes.get(id).title).join(' OR ')).join(' AND ')||'Entry focus — no redundant party unlock';
  detail.innerHTML=`<h3>${esc(n.title)}</h3><p>${n.days} days · x=${n.xy[0]}, y=${n.xy[1]} · ${esc(n.historical_status)}</p><p>${esc(n.description)}</p><p>Prerequisite: ${esc(pre)}</p>${n.mutually_exclusive.length?`<p>Exclusive with: ${esc(n.mutually_exclusive.map(id=>nodes.get(id).title).join(' / '))}</p>`:''}<h4>Proposed effects and costs</h4><ul>${n.reward_summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${n.modifiers.stability_factor>0?'<p>Positive stability is a package contribution: min(total positive policy contributions, +15%) + all negative policy contributions. Starting situation penalties remain separate.</p>':''}<p>Ownership: ${esc(n.ownership)}</p><details><summary>Party, leader and delivery conditions</summary><pre>${esc(n.available)}</pre>${n.requirement_contracts.map(r=>`<p>${esc(r.meaning)}</p><pre>${esc(r.proposed_code)}</pre>`).join('')}<p>Active modifier condition:</p><pre>${esc(n.active_condition)}</pre></details><details><summary>Native effect body and proposed integration</summary><pre>${esc(n.effect_body)}</pre><p>Runs once, after current eligibility, the frozen GDP invoice and native building-capacity checks pass. Unfunded completion becomes pending. New COLDWAR_IRQ helpers and condition providers are proposed integration, not existing MD APIs.</p>${Object.keys(n.modifiers).length?`<pre>${esc(Object.entries(n.modifiers).map(([k,v])=>`${k} = ${v}`).join('\n'))}</pre>`:''}</details>`;
 }
 function branch(native=true){mode='tree';select.value=current;const g=groups.get(current),list=data.nodes.filter(n=>n.group===current);meta.textContent=`${g.label} · ${list.length} focuses · ${g.outlook==='shared'?'National programme':'Governing-party / office programme'}${available(list[0])?'':' · Unavailable in this government view'}`;pick(nodes.get(picked)?.group===current?nodes.get(picked):list[0]);fit(false,native);}
 function overview(){mode='overview';meta.textContent=`Entire tree · Two horizontal tiers · ${data.groups.length} programme areas · Native grid 96 × 130`;fit(true);detail.innerHTML='<h3>The Complete Iraqi Programme</h3><div class="irq-branch-index">'+data.groups.map(g=>`<button type="button" data-group="${g.id}">${esc(g.label)}</button>`).join('')+'</div>';}
 function showSpirits(){mode='spirits';detail.innerHTML='<h3>Starting Situation · January 1970</h3>'+data.starting_spirits.map(s=>`<article class="irq-spirit"><h4>${esc(s.label)}</h4><p>${esc(s.description)}</p><ul>${Object.entries(s.modifiers).map(([k,v])=>`<li>${esc(data.modifier_labels[k][0])}: ${v>0?'+':''}${(v*100).toFixed(0)}%</li>`).join('')}${Object.entries(s.native_consequences||{}).map(([k,v])=>`<li>${esc(k)}: ${esc(v)}</li>`).join('')}</ul>${s.native_system?`<p>${esc(s.native_system)}</p>`:''}<p>${esc(s.treatment)}</p></article>`).join('');}
 function showDecisions(){mode='decisions';const list=data.decisions.filter(d=>d.group===current);detail.innerHTML=`<h3>${esc(groups.get(current).label)} · Decisions</h3>`+list.map(d=>`<details open><summary>${esc(d.label)} · ${d.pp} PP · ${d.days} days</summary><p>${esc(d.summary)}</p><p>Unlock: ${esc(nodes.get(d.unlock)?.title||'Available from start')}</p>${d.effect_code?`<pre>${esc(d.effect_code)}</pre>`:''}</details>`).join('');}
 function rules(){mode='rules';detail.innerHTML='<h3>Government and Programme Rules</h3><ul>'+Object.values(data.programme_rules).filter(v=>typeof v==='string').map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul><p>Native source-verified: modifier keys, money/literacy effects, construction and political refresh patterns. Proposed: historical roster extensions, leadership bridges, project/contract decisions and all numeric balance. Native focus typography uses the inherited UbuntuBold16 bitmap atlas. Browser approximations remain connector routing, glows and availability. The programme selector changes the camera, never focus coordinates.</p>';}
 root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.node){const n=nodes.get(b.dataset.node);current=n.group;select.value=current;mode='tree';pick(n);}else if(b.dataset.group){current=b.dataset.group;picked='';branch();}else if(b.id==='irq-overview')overview();else if(b.id==='irq-native'){branch(true);}else if(b.id==='irq-fit'){branch(false);}else if(b.id==='irq-minus')zoom(1/1.2);else if(b.id==='irq-plus')zoom(1.2);else if(b.id==='irq-spirits')showSpirits();else if(b.id==='irq-decisions')showDecisions();else if(b.id==='irq-rules')rules();remember();});
 select.addEventListener('change',()=>{current=select.value;picked='';branch();remember();});government.addEventListener('change',()=>{paintGovernment();if(mode==='tree')branch();remember();});
 map.addEventListener('wheel',ev=>{ev.preventDefault();ev.stopPropagation();const r=map.getBoundingClientRect();if(ev.ctrlKey||ev.metaKey){if(ev.deltaY)zoom(Math.exp(-ev.deltaY*.002),ev.clientX-r.left,ev.clientY-r.top);}else{const unit=ev.deltaMode===1?16:ev.deltaMode===2?map.clientHeight:1;cameraMode='manual';camera.x-=(ev.shiftKey?ev.deltaX+ev.deltaY:ev.deltaX)*unit;camera.y-=ev.shiftKey?0:ev.deltaY*unit;transform();}clearTimeout(wheelSave);wheelSave=setTimeout(remember,180);},{passive:false});
 map.addEventListener('pointerdown',ev=>{if(!ev.isPrimary||![0,1,2].includes(ev.button))return;suppressClickUntil=0;drag={x:ev.clientX,y:ev.clientY,cx:camera.x,cy:camera.y,id:ev.pointerId,moved:false};if(ev.button!==0)ev.preventDefault();});
 map.addEventListener('pointermove',ev=>{if(!drag||ev.pointerId!==drag.id)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;if(!drag.moved){drag.moved=true;map.setPointerCapture(ev.pointerId);map.classList.add('dragging');}ev.preventDefault();cameraMode='manual';camera.x=drag.cx+dx;camera.y=drag.cy+dy;transform();});
 function stop(ev){if(!drag||ev.pointerId!==drag.id)return;const done=drag;drag=null;if(map.hasPointerCapture(done.id))map.releasePointerCapture(done.id);map.classList.remove('dragging');if(done.moved){suppressClickUntil=performance.now()+400;remember();}}
 map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);map.addEventListener('lostpointercapture',ev=>{if(drag?.id===ev.pointerId)stop(ev);});
 map.addEventListener('click',ev=>{if(ev.detail&&performance.now()<suppressClickUntil){ev.preventDefault();ev.stopImmediatePropagation();}},true);
 map.addEventListener('contextmenu',ev=>ev.preventDefault());map.addEventListener('dragstart',ev=>ev.preventDefault());
 root.addEventListener('keydown',ev=>{if(['SELECT','INPUT','TEXTAREA'].includes(ev.target.tagName))return;const d={ArrowLeft:[80,0],ArrowRight:[-80,0],ArrowUp:[0,80],ArrowDown:[0,-80]}[ev.key];if(d){ev.preventDefault();cameraMode='manual';camera.x+=d[0];camera.y+=d[1];transform();remember();}});
 world.addEventListener('focusin',ev=>{if(drag)return;const n=nodes.get(ev.target.dataset.node);if(!n)return;const p=pos(n),x=p.x*camera.z+camera.x,y=p.y*camera.z+camera.y;if(x<0||x+165*camera.z>map.clientWidth||y<0||y+128*camera.z>map.clientHeight){cameraMode='manual';camera.x=map.clientWidth/2-(p.x+82)*camera.z;camera.y=map.clientHeight/2-(p.y+50)*camera.z;transform();}});
 function restore(value){if(drag)return;const s=value?.privateContent;if([4,5].includes(s?.version)&&groups.has(s.current)){current=s.current;picked=nodes.has(s.picked)?s.picked:'';government.value=s.government||'saddam';paintGovernment();branch();if(s.mode==='overview')overview();else if(s.mode==='spirits')showSpirits();else if(s.mode==='decisions')showDecisions();else if(s.mode==='rules')rules();if(s.camera&&[s.camera.x,s.camera.y,s.camera.z].every(Number.isFinite)){camera={...s.camera};cameraMode=s.cameraMode||'manual';transform();}}else{government.value='saddam';paintGovernment();branch();}}
 window.addEventListener('openai:set_globals',ev=>restore(ev.detail?.globals?.widgetState));let measured=map.clientWidth;new ResizeObserver(()=>{const next=map.clientWidth;if(Math.abs(next-measured)>3){const change=next-measured;measured=next;if(cameraMode==='overview')fit(true);else if(cameraMode==='fit')fit(false);else{camera.x+=change/2;transform();}}}).observe(map);restore(window.openai?.widgetState);
})();
</script>
</main></html>
