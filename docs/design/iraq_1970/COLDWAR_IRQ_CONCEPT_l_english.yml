 COLDWAR_IRQ_industry_maintenance:0 "Industrial Maintenance"
 COLDWAR_IRQ_industry_maintenance_desc:0 "Existing assets require spare parts, staff and a funded maintenance system."
 COLDWAR_IRQ_industry_power:0 "Thermal Power Project"
 COLDWAR_IRQ_industry_power_desc:0 "Fund one power plant in controlled Basrah; fuel and emissions remain native system consequences."
 COLDWAR_IRQ_industry_machine_tools:0 "Machine-Tool Skills"
 COLDWAR_IRQ_industry_machine_tools_desc:0 "Improve existing production through skills."
 COLDWAR_IRQ_industry_commercial_services:0 "Commercial Services"
 COLDWAR_IRQ_industry_commercial_services_desc:0 "Fund offices in the capital."
 COLDWAR_IRQ_industry_grid_management:0 "Power Dispatch"
 COLDWAR_IRQ_industry_grid_management_desc:0 "A reliable system requires a continuing administrative budget."
 COLDWAR_IRQ_industry_quality:0 "Quality Inspection"
 COLDWAR_IRQ_industry_quality_desc:0 "Quality improves production while inspection absorbs resources."
 COLDWAR_IRQ_industry_tax_service:0 "Tax Records"
 COLDWAR_IRQ_industry_tax_service_desc:0 "Raise collection capacity rather than inflate nominal GDP."
 COLDWAR_IRQ_industry_delivery_review:0 "Industrial Review"
 COLDWAR_IRQ_industry_delivery_review_desc:0 "Offer bounded reallocation of future projects without replaying construction rewards."
 COLDWAR_IRQ_agri_land_survey:0 "Survey the Land Reform"
 COLDWAR_IRQ_agri_land_survey_desc:0 "Identify rural credit, tenure and irrigation constraints."
 COLDWAR_IRQ_agri_cooperatives:0 "Farm Cooperatives"
 COLDWAR_IRQ_agri_cooperatives_desc:0 "Collective services gain scale while increasing administrative demands."
 COLDWAR_IRQ_agri_smallholders:0 "Support Smallholders"
 COLDWAR_IRQ_agri_smallholders_desc:0 "Private credit and extension reduce short-term revenue capture."
 COLDWAR_IRQ_agri_cooperative_credit:0 "Cooperative Equipment"
 COLDWAR_IRQ_agri_cooperative_credit_desc:0 "Pay for machinery and extension delivery."
 COLDWAR_IRQ_agri_smallholder_credit:0 "Rural Credit Guarantee"
 COLDWAR_IRQ_agri_smallholder_credit_desc:0 "Make a costed guarantee for small producers."
 COLDWAR_IRQ_agri_water_accounts:0 "Two Rivers Accounts"
 COLDWAR_IRQ_agri_water_accounts_desc:0 "Coordinate Iraqi water administration before diplomatic promises."
 COLDWAR_IRQ_agri_large_irrigation:0 "Large Irrigation Works"
 COLDWAR_IRQ_agri_large_irrigation_desc:0 "Invest heavily in centralized irrigation."
 COLDWAR_IRQ_agri_local_irrigation:0 "Local Irrigation"
 COLDWAR_IRQ_agri_local_irrigation_desc:0 "A distributed programme requires more field administration."
 COLDWAR_IRQ_agri_wasit:0 "Fund Works in Wasit"
 COLDWAR_IRQ_agri_wasit_desc:0 "Pay for one native agricultural district in controlled Wasit."
 COLDWAR_IRQ_agri_dhiqar:0 "Fund Works in Dhi Qar"
 COLDWAR_IRQ_agri_dhiqar_desc:0 "Pay for one native agricultural district in controlled Dhi Qar."
 COLDWAR_IRQ_agri_extension:0 "Rural Extension Service"
 COLDWAR_IRQ_agri_extension_desc:0 "Fund advisors and delivery before removing the remaining reform bottleneck."
 COLDWAR_IRQ_agri_grain_storage:0 "Grain and Rural Roads"
 COLDWAR_IRQ_agri_grain_storage_desc:0 "Fund transport in Qadisiyah."
 COLDWAR_IRQ_agri_river_talks:0 "Upstream Water Rules"
 COLDWAR_IRQ_agri_river_talks_desc:0 "A cross-border water arrangement needs upstream consent."
 COLDWAR_IRQ_agri_marsh_livelihoods:0 "Marsh Livelihoods"
 COLDWAR_IRQ_agri_marsh_livelihoods_desc:0 "Fund local services rather than reward environmental destruction with manpower."
 COLDWAR_IRQ_agri_distribution:0 "Rural Distribution"
 COLDWAR_IRQ_agri_distribution_desc:0 "A delivered distribution system reduces the household burden."
 COLDWAR_IRQ_agri_water_inspection:0 "Water Inspectorate"
 COLDWAR_IRQ_agri_water_inspection_desc:0 "Pay for inspections even if foreign talks fail."
 COLDWAR_IRQ_agri_clinics:0 "Mobile Rural Clinics"
 COLDWAR_IRQ_agri_clinics_desc:0 "Rural healthcare has a continuing social cost."
 COLDWAR_IRQ_agri_reform_delivery:0 "The Rural Reform"
 COLDWAR_IRQ_agri_reform_delivery_desc:0 "Review actual credit and field-service delivery before removing the final structural penalty."
 COLDWAR_IRQ_society_baseline:0 "Schools and Skills"
 COLDWAR_IRQ_society_baseline_desc:0 "Initialize a documented education baseline once; the numeric1970 literacy calibration is an explicit open balance item."
 COLDWAR_IRQ_society_mass_literacy:0 "Mass Literacy"
 COLDWAR_IRQ_society_mass_literacy_desc:0 "Pay for broad adult literacy rather than award modern research technology."
 COLDWAR_IRQ_society_teacher_first:0 "Train Teachers First"
 COLDWAR_IRQ_society_teacher_first_desc:0 "A slower specialist pipeline invests before mass delivery."
 COLDWAR_IRQ_society_evening_classes:0 "Adult Evening Classes"
 COLDWAR_IRQ_society_evening_classes_desc:0 "Pay for a second bounded literacy cohort."
 COLDWAR_IRQ_society_teacher_deployment:0 "Deploy the Teachers"
 COLDWAR_IRQ_society_teacher_deployment_desc:0 "Actual deployment changes native literacy."
 COLDWAR_IRQ_society_literacy_accounts:0 "Measure Literacy Gains"
 COLDWAR_IRQ_society_literacy_accounts_desc:0 "The native education spirit changes with literacy; no duplicate research penalty is removed."
 COLDWAR_IRQ_society_universal_services:0 "Universal Services"
 COLDWAR_IRQ_society_universal_services_desc:0 "Broader entitlement creates a lasting state expenditure obligation."
 COLDWAR_IRQ_society_targeted_services:0 "Targeted Services"
 COLDWAR_IRQ_society_targeted_services_desc:0 "Targeted service administration trades coverage for a lower universal commitment."
 COLDWAR_IRQ_society_primary_care:0 "Provincial Primary Care"
 COLDWAR_IRQ_society_primary_care_desc:0 "Fund clinics and access to care."
 COLDWAR_IRQ_society_priority_districts:0 "Neglected Districts"
 COLDWAR_IRQ_society_priority_districts_desc:0 "Fund targeted programmes with professional eligibility review."
 COLDWAR_IRQ_society_budget_review:0 "A Funded Social Budget"
 COLDWAR_IRQ_society_budget_review_desc:0 "Review actual social and education laws instead of inventing parallel spending sliders."
 COLDWAR_IRQ_society_women_education:0 "Women and Skills"
 COLDWAR_IRQ_society_women_education_desc:0 "Fund access, teachers and professional training."
 COLDWAR_IRQ_society_housing:0 "Housing and Services"
 COLDWAR_IRQ_society_housing_desc:0 "Rapid urban growth requires municipal infrastructure."
 COLDWAR_IRQ_society_technical_colleges:0 "Technical Colleges"
 COLDWAR_IRQ_society_technical_colleges_desc:0 "Specialist education consumes money and service capacity."
 COLDWAR_IRQ_society_rural_schooling:0 "Rural School Access"
 COLDWAR_IRQ_society_rural_schooling_desc:0 "A bounded literacy gain follows funded rural teaching."
 COLDWAR_IRQ_society_municipal_finance:0 "Municipal Revenue"
 COLDWAR_IRQ_society_municipal_finance_desc:0 "Fund collection and local administration."
 COLDWAR_IRQ_society_science_maintenance:0 "Maintain Laboratories"
 COLDWAR_IRQ_society_science_maintenance_desc:0 "Maintain civilian research facilities without unlocking nuclear weapons or future technologies."
 COLDWAR_IRQ_society_service_compact:0 "A Service Compact"
 COLDWAR_IRQ_society_service_compact_desc:0 "A delivered social programme may be reviewed without resetting national education gains."
 COLDWAR_IRQ_defence_accounts:0 "Audit the Armed Forces"
 COLDWAR_IRQ_defence_accounts_desc:0 "The initial army/equipment task remains deferred; this branch develops institutions and existing forces."
 COLDWAR_IRQ_defence_professional:0 "A Professional Core"
 COLDWAR_IRQ_defence_professional_desc:0 "Professional training improves cohesion while increasing payroll obligations."
 COLDWAR_IRQ_defence_mass:0 "A Mass Reserve Army"
 COLDWAR_IRQ_defence_mass_desc:0 "A larger manpower base needs training and weakens average cohesion."
 COLDWAR_IRQ_defence_staff_training:0 "Fund Staff Training"
 COLDWAR_IRQ_defence_staff_training_desc:0 "Command expertise takes time and money."
 COLDWAR_IRQ_defence_reserve_training:0 "Train the Reserves"
 COLDWAR_IRQ_defence_reserve_training_desc:0 "A workable reserve needs a paid training pipeline."
 COLDWAR_IRQ_defence_procurement_board:0 "Procurement Board"
 COLDWAR_IRQ_defence_procurement_board_desc:0 "Coordinate suppliers and maintenance contracts."
 COLDWAR_IRQ_defence_soviet_standard:0 "Soviet Supply Standards"
 COLDWAR_IRQ_defence_soviet_standard_desc:0 "A coherent supplier system trades efficiency for external dependence."
 COLDWAR_IRQ_defence_mixed_supply:0 "Diverse Suppliers"
 COLDWAR_IRQ_defence_mixed_supply_desc:0 "Supplier diversity reduces concentration but increases logistical complexity."
 COLDWAR_IRQ_defence_soviet_offer:0 "Advisory Mission"
 COLDWAR_IRQ_defence_soviet_offer_desc:0 "Foreign advisers arrive only after both sides agree."
 COLDWAR_IRQ_defence_maintenance_manuals:0 "Maintenance System"
 COLDWAR_IRQ_defence_maintenance_manuals_desc:0 "Pay to reconcile a mixed equipment inventory."
 COLDWAR_IRQ_defence_logistics:0 "Unified Logistics"
 COLDWAR_IRQ_defence_logistics_desc:0 "A funded directorate improves supply coordination."
 COLDWAR_IRQ_defence_land_schools:0 "Army Training Schools"
 COLDWAR_IRQ_defence_land_schools_desc:0 "Fund practical training for the existing army."
 COLDWAR_IRQ_defence_air_maintenance:0 "Air Maintenance"
 COLDWAR_IRQ_defence_air_maintenance_desc:0 "Develop institutions without adding imaginary aircraft."
 COLDWAR_IRQ_defence_coastal:0 "Coastal Defence"
 COLDWAR_IRQ_defence_coastal_desc:0 "Fund a small Basrah dockyard project instead of granting a blue-water navy."
 COLDWAR_IRQ_defence_armaments:0 "Local Armaments"
 COLDWAR_IRQ_defence_armaments_desc:0 "Pay for one military factory in Salahuddin."
 COLDWAR_IRQ_defence_fuel_discipline:0 "Fuel Discipline"
 COLDWAR_IRQ_defence_fuel_discipline_desc:0 "Training in efficient operations takes resources."
 COLDWAR_IRQ_defence_ship_maintenance:0 "The Coastal Fleet"
 COLDWAR_IRQ_defence_ship_maintenance_desc:0 "Dockyard skills need a funded institutional base."
 COLDWAR_IRQ_defence_readiness:0 "Sustainable Readiness"
 COLDWAR_IRQ_defence_readiness_desc:0 "Open paid, temporary readiness decisions with explicit expiry."
 COLDWAR_IRQ_war_contingency:0 "Contingency Planning"
 COLDWAR_IRQ_war_contingency_desc:0 "A preparedness dossier is available in peace; actual war consequences require observed events."
 COLDWAR_IRQ_war_restraint:0 "Armed Restraint"
 COLDWAR_IRQ_war_restraint_desc:0 "Maintain a costly deterrent while seeking negotiated disputes."
 COLDWAR_IRQ_war_offensive_option:0 "An Offensive Option"
 COLDWAR_IRQ_war_offensive_option_desc:0 "Planning for war strains civilian legitimacy before a separate deliberate launch decision."
 COLDWAR_IRQ_war_crisis_channel:0 "Crisis Channel"
 COLDWAR_IRQ_war_crisis_channel_desc:0 "Fund diplomatic crisis management."
 COLDWAR_IRQ_war_deliberate_authority:0 "Authorize War"
 COLDWAR_IRQ_war_deliberate_authority_desc:0 "An offensive plan grants no automatic war declaration."
 COLDWAR_IRQ_war_civil_continuity:0 "Civil Crisis Authority"
 COLDWAR_IRQ_war_civil_continuity_desc:0 "Pay for administration without assuming a war has begun."
 COLDWAR_IRQ_war_economy:0 "War Economy"
 COLDWAR_IRQ_war_economy_desc:0 "Only an actual war enables this emergency mobilization."
 COLDWAR_IRQ_war_civilian_floor:0 "A Civilian Budget Floor"
 COLDWAR_IRQ_war_civilian_floor_desc:0 "A civilian budget takes resources from military production."
 COLDWAR_IRQ_war_procurement_cycle:0 "Wartime Procurement"
 COLDWAR_IRQ_war_procurement_cycle_desc:0 "A temporary mobilization must expire when the war ends."
 COLDWAR_IRQ_war_services_continuity:0 "Civilian Services"
 COLDWAR_IRQ_war_services_continuity_desc:0 "Pay for health and education despite a crisis."
 COLDWAR_IRQ_war_accounts:0 "Emergency Accounts"
 COLDWAR_IRQ_war_accounts_desc:0 "Track debt, expenses and delivery without a new war-money ledger."
 COLDWAR_IRQ_war_veterans:0 "Veterans and Victims"
 COLDWAR_IRQ_war_veterans_desc:0 "An actual war creates a social obligation rather than a free manpower reward."
 COLDWAR_IRQ_war_reconstruction:0 "Civilian Reconstruction"
 COLDWAR_IRQ_war_reconstruction_desc:0 "Only observed damaged or lost capacity qualifies."
 COLDWAR_IRQ_war_credit_burden:0 "Confront Postwar Debt"
 COLDWAR_IRQ_war_credit_burden_desc:0 "Repayment and creditor consent use actual debt and treasury."
 COLDWAR_IRQ_war_reintegration:0 "Reintegration"
 COLDWAR_IRQ_war_reintegration_desc:0 "End the selected emergency policy without respawning or deleting units."
 COLDWAR_IRQ_war_recovery_contracts:0 "Recovery Contracts"
 COLDWAR_IRQ_war_recovery_contracts_desc:0 "Existing assets and replacement flags prevent rebuilding the same loss twice."
 COLDWAR_IRQ_war_sanctions_response:0 "Sanctions Response"
 COLDWAR_IRQ_war_sanctions_response_desc:0 "Use the existing Imperia sanctions situation rather than a predetermined1990 malus."
 COLDWAR_IRQ_war_peace_dividend:0 "Peace Settlement"
 COLDWAR_IRQ_war_peace_dividend_desc:0 "A peaceful Iraq can complete the programme by restraint and civilian continuity without fighting a required war."
 COLDWAR_IRQ_iran_frontier:0 "The Iranian Frontier"
 COLDWAR_IRQ_iran_frontier_desc:0 "The 1969 river dispute is a live 1970 crisis. Prepare a coercive policy toward Iran while Iraqi state capacity is still limited."
 COLDWAR_IRQ_iran_shatt_demand:0 "Enforce the Shatt Claim"
 COLDWAR_IRQ_iran_shatt_demand_desc:0 "Assert Baghdad's demand for river control. If a border agreement was actually signed, later repudiation must end its reciprocal benefits."
 COLDWAR_IRQ_iran_arabistan_claim:0 "The Arabistan Claim"
 COLDWAR_IRQ_iran_arabistan_claim_desc:0 "Publicly demand Khuzestan, described as Arabistan by Iraqi nationalists. The population is not automatically Iraqi, loyal or consenting."
 COLDWAR_IRQ_iran_southern_command:0 "Southern Command"
 COLDWAR_IRQ_iran_southern_command_desc:0 "Professional command and river-crossing exercises create a force capable of attempting a southern offensive."
 COLDWAR_IRQ_iran_tehran_assessment:0 "Assess Tehran's Army"
 COLDWAR_IRQ_iran_tehran_assessment_desc:0 "Reconnaissance separates Iranian capabilities from Iraqi expectations. Revolutionary weakness is an opportunity only when it actually exists."
 COLDWAR_IRQ_iran_operational_plan:0 "The Southern War Plan"
 COLDWAR_IRQ_iran_operational_plan_desc:0 "Combine command preparation and intelligence into a costed campaign plan. Iranian fragmentation is a possibility, not a victory condition."
 COLDWAR_IRQ_iran_short_war:0 "A Short Sharp War"
 COLDWAR_IRQ_iran_short_war_desc:0 "Concentrate the prepared force for a rapid attempt to break into Khuzestan. If the opening fails, the initial advantage will be gone."
 COLDWAR_IRQ_iran_sustained_war:0 "Prepare a Long War"
 COLDWAR_IRQ_iran_sustained_war_desc:0 "Sacrifice civilian priorities for a deeper reserve and a longer, less concentrated opening operation."
 COLDWAR_IRQ_iran_fuel_spares:0 "Fuel and Spares"
 COLDWAR_IRQ_iran_fuel_spares_desc:0 "A funded reserve and maintenance programme improves army fuel discipline. Imports and storage require administrators."
 COLDWAR_IRQ_iran_mobilisation_base:0 "Build the War Reserve"
 COLDWAR_IRQ_iran_mobilisation_base_desc:0 "Fund one military factory in Salahuddin as the physical base of a sustained campaign."
 COLDWAR_IRQ_iran_gulf_credit:0 "Seek Gulf Backing"
 COLDWAR_IRQ_iran_gulf_credit_desc:0 "Seek external finance against the perceived Iranian threat. The attack route remains open if the Gulf refuses."
 COLDWAR_IRQ_iran_forward_depots:0 "Forward Supply Depots"
 COLDWAR_IRQ_iran_forward_depots_desc:0 "Pay for transport coordination and supply organization before committing the army."
 COLDWAR_IRQ_iran_war_contracts:0 "Mobilise War Contracts"
 COLDWAR_IRQ_iran_war_contracts_desc:0 "Prepared production contracts accelerate replacement at the cost of civilian taxation and priorities."
 COLDWAR_IRQ_iran_supplier_access:0 "Secure Foreign Spares"
 COLDWAR_IRQ_iran_supplier_access_desc:0 "Seek maintenance and purchase arrangements with actual suppliers, keeping the route independent of their answer."
 COLDWAR_IRQ_iran_final_ultimatum:0 "The Final Ultimatum"
 COLDWAR_IRQ_iran_final_ultimatum_desc:0 "Demand the claimed province and prepare to enforce the demand. The focus grants a concrete conquest war goal; the Iraqi player chooses the declaration."
 COLDWAR_IRQ_iran_launch_campaign:0 "Execute the War Plan"
 COLDWAR_IRQ_iran_launch_campaign_desc:0 "Complete this preparation before declaring war, then activate the one-use offensive within its real campaign window."
 COLDWAR_IRQ_iran_home_front:0 "Mobilise the Nation"
 COLDWAR_IRQ_iran_home_front_desc:0 "Pay to sustain recruitment, services and public mobilization. Domestic coercion does not erase Iraqi political divisions."
 COLDWAR_IRQ_iran_campaign_accounts:0 "The Campaign Ledger"
 COLDWAR_IRQ_iran_campaign_accounts_desc:0 "A campaign can be won, prolonged or lost. After 180 continuous days against Iran, an automatic attrition burden raises supply use by 8%, army personnel costs by 12% and reduces stability by 4 points until peace."
 COLDWAR_IRQ_iran_secure_khuzestan:0 "Secure Khuzestan"
 COLDWAR_IRQ_iran_secure_khuzestan_desc:0 "A controlled province needs roads, a functioning administration and forces. Capture is not legal ownership and does not make the population a core."
 COLDWAR_IRQ_iran_long_war:0 "Fight Through Attrition"
 COLDWAR_IRQ_iran_long_war_desc:0 "If Iran does not collapse, commit to another campaign rather than receiving an automatic ceasefire."
 COLDWAR_IRQ_iran_oil_rehabilitation:0 "Khuzestan Oilworks"
 COLDWAR_IRQ_iran_oil_rehabilitation_desc:0 "After Iraq legally owns and controls the province, fund one infrastructure level. National export administration improves only after the province also reaches infrastructure 3."
 COLDWAR_IRQ_iran_civil_administration:0 "Administer Arabistan"
 COLDWAR_IRQ_iran_civil_administration_desc:0 "Recruit and fund a civilian administration rather than promising an effortless annexation. The core status of Khuzestan does not change."
 COLDWAR_IRQ_iran_war_of_reserves:0 "An Army of Reserves"
 COLDWAR_IRQ_iran_war_of_reserves_desc:0 "Mobilize a deeper pool and maintain trained units at the expense of specialists and the civilian budget."
 COLDWAR_IRQ_iran_another_offensive:0 "Prepare Another Blow"
 COLDWAR_IRQ_iran_another_offensive_desc:0 "Further offensives must be supplied, paid and scheduled. They do not reset the opening campaign."
 COLDWAR_IRQ_iran_regional_power:0 "Arabistan Secured"
 COLDWAR_IRQ_iran_regional_power_desc:0 "A successful war and actual peace settlement can deliver territory, ports, existing oil and a stronger regional position. Iran is not automatically puppeted or disarmed."
 COLDWAR_IRQ_iran_no_easy_exit:0 "Victory at Any Cost"
 COLDWAR_IRQ_iran_no_easy_exit_desc:0 "Escalate the industrial commitment if the war lasts. The state gains replacement output by displacing civilian consumption and exhausting legitimacy."
 COLDWAR_IRQ_iran_provincial_settlement:0 "A Provincial Settlement"
 COLDWAR_IRQ_iran_provincial_settlement_desc:0 "Begin the political and administrative integration of conquered Khuzestan. A durable Iraqi province needs functioning institutions and a sustained hold beyond the military campaign."
 COLDWAR_IRQ_iran_equal_citizenship:0 "Equal Citizenship"
 COLDWAR_IRQ_iran_equal_citizenship_desc:0 "Fund equal citizenship, local access to public services and protected Arabic and Persian use in provincial administration. Wider inclusion has a continuing administrative and social-service bill."
 COLDWAR_IRQ_iran_central_administration:0 "Central State Rule"
 COLDWAR_IRQ_iran_central_administration_desc:0 "Standardize provincial appointments and administration under Baghdad. A cheaper centralized settlement narrows local participation and creates political friction."
 COLDWAR_IRQ_iran_core_khuzestan:0 "An Iraqi Province"
 COLDWAR_IRQ_iran_core_khuzestan_desc:0 "Complete the institutional integration of Khuzestan after a sustained hold, sufficient compliance, low resistance and funded infrastructure. This is an explicit alternate-history gameplay outcome."
 COLDWAR_IRQ_decision_political_opening:0 "Negotiate a Political Opening"
 COLDWAR_IRQ_decision_political_opening_desc:0 "Open a paid, reversible legal-status negotiation; no automatic transfer of power."
 COLDWAR_IRQ_decision_prison_review:0 "Individual Prisoner Review"
 COLDWAR_IRQ_decision_prison_review_desc:0 "Review opposition detention case by case; release is not an automatic party accession."
 COLDWAR_IRQ_decision_march_offer:0 "Offer an Autonomy Accord"
 COLDWAR_IRQ_decision_march_offer_desc:0 "Domestic KDP response and territorial definition required; no automatic March1970 success."
 COLDWAR_IRQ_decision_constitutional_revision:0 "Constitutional Revision Conference"
 COLDWAR_IRQ_decision_constitutional_revision_desc:0 "Reopen a selected institutional policy at real political and administrative cost; never replay national investments."
 COLDWAR_IRQ_decision_front_offer:0 "Negotiate a National Progressive Front"
 COLDWAR_IRQ_decision_front_offer_desc:0 "ICP may accept, refuse or seek guarantees; coalition participation does not make it governing subparty."
 COLDWAR_IRQ_decision_baath_succession:0 "Regional Leadership Contest"
 COLDWAR_IRQ_decision_baath_succession_desc:0 "Nominate eligible Bakr/Saddam/continuity candidates through the existing leadership system; no focus automatically replaces the incumbent."
 COLDWAR_IRQ_decision_baath_continuity_cabinet:0 "Appoint a Continuity Cabinet"
 COLDWAR_IRQ_decision_baath_continuity_cabinet_desc:0 "Preserve existing eligible successors including Tariq Aziz. A Tariq Aziz government retains shared Baath, economy, defence and foreign programmes; no forced Bakr/Saddam-only dead end."
 COLDWAR_IRQ_decision_bakr_power_settlement:0 "Negotiate the Division of Offices"
 COLDWAR_IRQ_decision_bakr_power_settlement_desc:0 "Risk a contested leadership settlement; existing leader system resolves the outcome."
 COLDWAR_IRQ_decision_bakr_soviet_offer:0 "Offer a Friendship Treaty"
 COLDWAR_IRQ_decision_bakr_soviet_offer_desc:0 "Soviet acceptance required; arms, loan or advisory terms selected separately. No free faction membership."
 COLDWAR_IRQ_decision_bakr_syria_offer:0 "Offer a Syrian Union Conference"
 COLDWAR_IRQ_decision_bakr_syria_offer_desc:0 "Both governments must consent. Shared institutions and leadership terms are negotiated, with no automatic annexation."
 COLDWAR_IRQ_decision_bakr_retire:0 "Implement the Agreed Succession"
 COLDWAR_IRQ_decision_bakr_retire_desc:0 "Install only an eligible agreed successor. Bakr programme suspends; irreversible national gains remain."
 COLDWAR_IRQ_decision_iran_policy_review:0 "Review Policy toward Iran"
 COLDWAR_IRQ_decision_iran_policy_review_desc:0 "Available only after an observed Iranian regime change or explicit RP dossier; choose negotiation, deterrence or a separate war decision."
 COLDWAR_IRQ_decision_gulf_credit:0 "Request a Gulf Credit Line"
 COLDWAR_IRQ_decision_gulf_credit_desc:0 "Lender chooses amount and terms; matching lender debit, Iraqi treasury credit and Iraqi debt increase only on acceptance."
 COLDWAR_IRQ_decision_saddam_repay:0 "Repay a Negotiated Credit Tranche"
 COLDWAR_IRQ_decision_saddam_repay_desc:0 "Repayment equals min(selected tranche, actual debt, available treasury); no money or debt creation."
 COLDWAR_IRQ_decision_officer_amnesty_offer:0 "Offer a Conditional Amnesty"
 COLDWAR_IRQ_decision_officer_amnesty_offer_desc:0 "Opposition chooses whether to accept. No automatic coup immunity or power transfer."
 COLDWAR_IRQ_decision_officer_transition:0 "Submit the Transition Charter"
 COLDWAR_IRQ_decision_officer_transition_desc:0 "A constitutional vote may fail; success permits civilian accession through MD politics, not arbitrary party support replacement."
 COLDWAR_IRQ_decision_arab_leadership:0 "Convene an Arab Socialist Leadership Council"
 COLDWAR_IRQ_decision_arab_leadership_desc:0 "Choose a living eligible leadership: al-Rikabi requires political release/rehabilitation and survival; Haseeb is a technocratic alternate, not a claimed historical president. No revival after a recorded death."
 COLDWAR_IRQ_decision_arab_development_offer:0 "Offer an Arab Development Compact"
 COLDWAR_IRQ_decision_arab_development_offer_desc:0 "Egypt or Syria may refuse; one initiator, defined payer and recipient, no duplicated factory reward."
 COLDWAR_IRQ_decision_arab_support_offer:0 "Offer an Approved Support Package"
 COLDWAR_IRQ_decision_arab_support_offer_desc:0 "Existing eligible recipient and native support ledger required; no invented militia or automatic foreign war."
 COLDWAR_IRQ_decision_arab_union_offer:0 "Convene a Union Negotiation"
 COLDWAR_IRQ_decision_arab_union_offer_desc:0 "Every participating player consents to institutions, finance and military authority. No automatic territorial merger."
 COLDWAR_IRQ_decision_icp_leadership_vote:0 "Elect the Party Secretariat"
 COLDWAR_IRQ_decision_icp_leadership_vote_desc:0 "Aziz Muhammad is the historical secretary. Amir Abdullah, Zaki Khairi and other cadres shape the front/independence debate; they are not given fictitious standalone national-government trees. A real office change must use the leadership registry."
 COLDWAR_IRQ_decision_icp_front_terms:0 "Submit Front Conditions"
 COLDWAR_IRQ_decision_icp_front_terms_desc:0 "Negotiate legal rights and ministries; front membership does not by itself activate governing-party programmes."
 COLDWAR_IRQ_decision_icp_federal_talks:0 "Open Federal Negotiations"
 COLDWAR_IRQ_decision_icp_federal_talks_desc:0 "KDP/PUK and provincial representatives respond; no free cores, territorial transfer or Kurdish loyalty variable invented."
 COLDWAR_IRQ_decision_icp_soviet_exchange:0 "Request a Party and Technical Exchange"
 COLDWAR_IRQ_decision_icp_soviet_exchange_desc:0 "Soviet response required; scholarship and adviser costs are explicit."
 COLDWAR_IRQ_decision_aziz_exit_front:0 "Review Continued Front Participation"
 COLDWAR_IRQ_decision_aziz_exit_front_desc:0 "May leave a failed agreement without automatically seizing government or starting civil war."
 COLDWAR_IRQ_decision_aziz_charter:0 "Offer a Minimum Democratic Charter"
 COLDWAR_IRQ_decision_aziz_charter_desc:0 "Other domestic parties accept or reject separately; no automatic all-party alliance."
 COLDWAR_IRQ_decision_aziz_renewal:0 "Hold a Leadership Renewal Vote"
 COLDWAR_IRQ_decision_aziz_renewal_desc:0 "Use the leadership registry. A departing secretary loses this active programme, while earned progress survives."
 COLDWAR_IRQ_decision_civic_election:0 "Hold a Contested Parliamentary Election"
 COLDWAR_IRQ_decision_civic_election_desc:0 "Use existing MD politics and registered1970 party families. Record the actual winner; no automatic majority for the focus owner."
 COLDWAR_IRQ_decision_civic_credit_offer:0 "Request Parliamentary Credit Approval"
 COLDWAR_IRQ_decision_civic_credit_offer_desc:0 "Accepted external loans use matching treasury/debt changes; refusal leaves domestic policy playable."
 COLDWAR_IRQ_decision_civic_policy_review:0 "Review the Cabinet Programme"
 COLDWAR_IRQ_decision_civic_policy_review_desc:0 "A later coalition can revise selected funded policy slots without replaying old rewards."
 COLDWAR_IRQ_decision_royal_jordan_offer:0 "Offer a Hashemite Cooperation Treaty"
 COLDWAR_IRQ_decision_royal_jordan_offer_desc:0 "Jordan can refuse. No automatic federation, common monarch or annexation."
 COLDWAR_IRQ_decision_royal_trade_offer:0 "Offer a Commercial Partnership"
 COLDWAR_IRQ_decision_royal_trade_offer_desc:0 "Negotiated payer, recipient and construction capacity; foreign refusal has no domestic veto."
 COLDWAR_IRQ_decision_foreign_partner_offer:0 "Offer a Costed Cooperation Treaty"
 COLDWAR_IRQ_decision_foreign_partner_offer_desc:0 "USSR, a Western state or regional partner may accept/refuse. No automatic bloc membership, foreign base or loan."
 COLDWAR_IRQ_decision_foreign_shatt_offer:0 "Offer a Navigation and Border Conference"
 COLDWAR_IRQ_decision_foreign_shatt_offer_desc:0 "Iran accepts/refuses/revises. Existing border remains until explicit agreed implementation; no automatic treaty or peace."
 COLDWAR_IRQ_decision_foreign_incident_review:0 "Offer a Border Incident Review"
 COLDWAR_IRQ_decision_foreign_incident_review_desc:0 "Both states receive a response opportunity; no automatic escalation or forced stand-down."
 COLDWAR_IRQ_decision_foreign_syria_offer:0 "Offer a Syrian Cooperation Conference"
 COLDWAR_IRQ_decision_foreign_syria_offer_desc:0 "Syria controls its response; union, transit and defence terms remain separate decisions."
 COLDWAR_IRQ_decision_foreign_kuwait_offer:0 "Offer a Kuwait Finance and Navigation Conference"
 COLDWAR_IRQ_decision_foreign_kuwait_offer_desc:0 "No automatic claim, core or annexation. Kuwait decides finance and border terms."
 COLDWAR_IRQ_decision_foreign_arab_conference:0 "Convene a Regional Reconciliation Conference"
 COLDWAR_IRQ_decision_foreign_arab_conference_desc:0 "Each invitee may refuse. Accepted terms do not automatically bind uninvolved players."
 COLDWAR_IRQ_decision_foreign_credit_review:0 "Request a Regional Debt Review"
 COLDWAR_IRQ_decision_foreign_credit_review_desc:0 "Creditor approval required. Debt changes only by actual agreed payment or explicit creditor write-off."
 COLDWAR_IRQ_decision_foreign_policy_review:0 "Review Active Treaty Obligations"
 COLDWAR_IRQ_decision_foreign_policy_review_desc:0 "A revision needs counterpart response where required. No reward replay or automatic diplomatic immunity."
 COLDWAR_IRQ_decision_kdp_succession_vote:0 "Convene the KDP Leadership Council"
 COLDWAR_IRQ_decision_kdp_succession_vote_desc:0 "Use living, period-eligible Mustafa/Idris/Masoud candidates; Idris cannot remain available after recorded death."
 COLDWAR_IRQ_decision_kdp_kirkuk_talks:0 "Convene Kirkuk Status Talks"
 COLDWAR_IRQ_decision_kdp_kirkuk_talks_desc:0 "No automatic ethnic transfer, core, annexation or resource ownership. All status changes need a constitutional agreement."
 COLDWAR_IRQ_decision_puk_kdp_offer:0 "Offer a Regional Cooperation Pact"
 COLDWAR_IRQ_decision_puk_kdp_offer_desc:0 "KDP may refuse. No forced merger of movements or automatic national government."
 COLDWAR_IRQ_decision_puk_federal_convention:0 "Call a Federal Convention"
 COLDWAR_IRQ_decision_puk_federal_convention_desc:0 "Arab and Kurdish parties negotiate constitutional authority and revenue. No automatic approval."
 COLDWAR_IRQ_decision_dawa_leadership:0 "Select a Political Executive"
 COLDWAR_IRQ_decision_dawa_leadership_desc:0 "Documented organizational figures include Abd al-Sahib Dukhayl and Muhammad Hadi al-Subayti. Distinguish their party organization role from al-Sadrs spiritual/intellectual authority; national office is an alternate political outcome. No compulsory execution event."
 COLDWAR_IRQ_decision_dawa_iran_offer:0 "Offer a Non-Interference Accord"
 COLDWAR_IRQ_decision_dawa_iran_offer_desc:0 "Iran must accept; agreement protects recipient control and does not transfer state authority."
 COLDWAR_IRQ_decision_sciri_border_offer:0 "Offer a Border and Non-Interference Treaty"
 COLDWAR_IRQ_decision_sciri_border_offer_desc:0 "Iran may refuse; no automatic border transfer or end to an active war."
 COLDWAR_IRQ_decision_sciri_aid_offer:0 "Request a Published Reconstruction Package"
 COLDWAR_IRQ_decision_sciri_aid_offer_desc:0 "Actual treasury/debt effects and force permissions require accepted terms."
 COLDWAR_IRQ_decision_iip_congress:0 "Reconstitute the IIP Leadership"
 COLDWAR_IRQ_decision_iip_congress_desc:0 "Numan al-Samarrai is the documented founding president; Ayad al-Samarrai is a1970 underground youth organizer, not presumed secretary-general. Muhsin Abd al-Hamid is not imported as a post2003 chairman at start. Elect a vetted living period executive."
 COLDWAR_IRQ_decision_iip_arab_offer:0 "Offer an Arab Civilian Partnership"
 COLDWAR_IRQ_decision_iip_arab_offer_desc:0 "Partner accepts/refuses. No automatic sectarian bloc or foreign military access."
 COLDWAR_IRQ_decision_oil_concession_offer:0 "Submit Revised Concession Terms"
 COLDWAR_IRQ_decision_oil_concession_offer_desc:0 "Foreign counterpart may accept/refuse; no concession benefit before accepted terms."
 COLDWAR_IRQ_decision_oil_market_review:0 "Review the Oil Market Position"
 COLDWAR_IRQ_decision_oil_market_review_desc:0 "Read current world-price/sanctions state. No unilateral increase of the world oil price."
 COLDWAR_IRQ_decision_oil_contract_review:0 "Renegotiate an Export Contract"
 COLDWAR_IRQ_decision_oil_contract_review_desc:0 "Replaces the selected contract; never stacks every past contract or grants free sanctions immunity."
 COLDWAR_IRQ_decision_industry_pipeline:0 "Review Funded Industrial Projects"
 COLDWAR_IRQ_decision_industry_pipeline_desc:0 "Pending projects retain a frozen invoice. Capacity/control failure delivers no benefit and charges no treasury."
 COLDWAR_IRQ_decision_industry_credit:0 "Request an Industrial Credit Agreement"
 COLDWAR_IRQ_decision_industry_credit_desc:0 "Accepted lender debit and matching Iraqi treasury/debt; ordinary domestic investment remains possible if refused."
 COLDWAR_IRQ_decision_industry_repay:0 "Repay an Industrial Credit Tranche"
 COLDWAR_IRQ_decision_industry_repay_desc:0 "Repay min(real debt, available treasury, selected tranche); no free cancellation of foreign claims."
 COLDWAR_IRQ_decision_industry_reallocate:0 "Reallocate the Next Investment Round"
 COLDWAR_IRQ_decision_industry_reallocate_desc:0 "Select one current future-investment policy. Existing factories remain; no second grant from repeating review."
 COLDWAR_IRQ_decision_agri_water_offer:0 "Offer a River Management Conference"
 COLDWAR_IRQ_decision_agri_water_offer_desc:0 "Turkey and Syria respond separately. No free water resource, new dam or automatic treaty."
 COLDWAR_IRQ_decision_society_audit:0 "Review Education and Service Coverage"
 COLDWAR_IRQ_decision_society_audit_desc:0 "Reads existing native education/law data. Does not reset literacy each time government changes."
 COLDWAR_IRQ_decision_society_revision:0 "Review Social Coverage and Funding"
 COLDWAR_IRQ_decision_society_revision_desc:0 "Replace the selected coverage policy; permanent literacy and built infrastructure remain."
 COLDWAR_IRQ_decision_defence_soviet_advisers:0 "Request Soviet Advisers"
 COLDWAR_IRQ_decision_defence_soviet_advisers_desc:0 "Counterpart accepts/refuses; advice has cost and duration. No automatic division, licence or research tech."
 COLDWAR_IRQ_decision_defence_readiness_cycle:0 "Fund a Readiness Cycle"
 COLDWAR_IRQ_decision_defence_readiness_cycle_desc:0 "Cost2% frozen currentGDP; temporary +3%divisionorganisation and +4%army personnel cost for90days,180daycooldown. Expiry never restores an old cycle."
 COLDWAR_IRQ_decision_war_mediation:0 "Request Crisis Mediation"
 COLDWAR_IRQ_decision_war_mediation_desc:0 "Actual counterpart and mediators choose. No imposed peace or forced outcome."
 COLDWAR_IRQ_decision_war_authorization:0 "Authorize a Specific War Proposal"
 COLDWAR_IRQ_decision_war_authorization_desc:0 "Explicit target, claim/legal basis, current crisis and player confirmation through an event. No automatic1980 or1990 invasion; native declaration rules remain."
 COLDWAR_IRQ_decision_war_debt_conference:0 "Request a Postwar Debt Conference"
 COLDWAR_IRQ_decision_war_debt_conference_desc:0 "Creditors can refuse. No automatic Gulf write-off, claim onKuwait or new war."
 COLDWAR_IRQ_decision_war_sanctions_diplomacy:0 "Request a Sanctions Review"
 COLDWAR_IRQ_decision_war_sanctions_diplomacy_desc:0 "Only while actually sanctioned. Sanctioning states/UN mechanism decide; no free embargo immunity."
 COLDWAR_IRQ_decision_war_emergency_review:0 "Review Remaining Emergency Measures"
 COLDWAR_IRQ_decision_war_emergency_review_desc:0 "End active war-policy costs and bonuses after peace; veteran support remains a real budget choice."
 COLDWAR_IRQ_decision_iran_frontier_review:0 "Review the Eastern Balance"
 COLDWAR_IRQ_decision_iran_frontier_review_desc:0 "Expose actual Iranian stability, war status, owned Khuzestan and the Iraqi northern burden. Never manufacture an Iranian revolution or a loyal Arab uprising."
 COLDWAR_IRQ_decision_iran_revoke_settlement:0 "Repudiate the Border Settlement"
 COLDWAR_IRQ_decision_iran_revoke_settlement_desc:0 "Available only for an actual live Iran border settlement. Clear that agreement and its reciprocal benefits, restore the unresolved-river burden and notify Iran. This is a unilateral hostile act; Iran cannot veto its repudiation. It does not create a second claim or force war."
 COLDWAR_IRQ_decision_iran_disarray:0 "Exploit Iranian Disarray"
 COLDWAR_IRQ_decision_iran_disarray_desc:0 "Once only; Iran must actually have civil war or stability below 40%. Cost 1% frozenGDP. Planning speed +10% for 120 days. This optional opportunity is not needed to obtain the war goal."
 COLDWAR_IRQ_decision_iran_gulf_credit:0 "Request Gulf War Credit"
 COLDWAR_IRQ_decision_iran_gulf_credit_desc:0 "Select a real Gulf creditor. Terms, amount, Iraqi debt, repayment and creditor treasury debit require recipient acceptance. Refusal cannot block the ultimatum. No free oil, loans or divisions."
 COLDWAR_IRQ_decision_iran_supplier:0 "Negotiate a Wartime Supply Contract"
 COLDWAR_IRQ_decision_iran_supplier_desc:0 "Choose a current eligible arms supplier and actual equipment. Acceptance, treasury, availability and delivery use native trade/arms systems. No free equipment or Soviet commitment is assumed."
 COLDWAR_IRQ_decision_iran_opening:0 "Launch the Khuzestan Offensive"
 COLDWAR_IRQ_decision_iran_opening_desc:0 "Once per campaign history, after the offensive focus and within the first 30 days of the first Iraqi-Iranian war. Pay a frozen 2% GDP invoice. Short-war plan: +8% attack against PER, +15% planning speed, +8% supply use and +10% army fuel use for 90 days. Sustained plan: +5% attack against PER, +10% planning speed, +5% supply use and +6% army fuel use for 120 days. Both create a 180 day +8% army personnel bill that survives early peace. Attack is PER-targeted; planning and logistical effects are country-wide. No automatic declaration."
 COLDWAR_IRQ_decision_iran_followup:0 "Fund a Renewed Offensive"
 COLDWAR_IRQ_decision_iran_followup_desc:0 "After the opening has ended and at least 90 days of actual war. Pay a frozen 3% GDP invoice; +5% attack against PER for 60 days, with +12% supply and +12% army fuel use. A separate +12% army personnel bill lasts 90 days even after peace.180 day cooldown; no overlapping opening/follow-up bonus or previous follow-up bill. Earlier mobilization bills may still be payable."
 COLDWAR_IRQ_decision_iran_war_aims:0 "Revise the War Aims"
 COLDWAR_IRQ_decision_iran_war_aims_desc:0 "Choose continued prosecution, a new offensive or a limited negotiated offer. Iran may refuse settlement; no forced peace, claim removal or free debt relief. Ending the war suspends emergency bonuses and attrition, while fixed-duration bills still expire on their original dates."
 COLDWAR_IRQ_decision_retry_pending:0 "Deliver a Pending Programme"
 COLDWAR_IRQ_decision_retry_pending_desc:0 "Available from start when any completed focus has a pending delivery. Select one pending item; recheck its exact government, live contract, ownership/control, native capacity and frozen invoice. Execute its same once-only delivery guard. Failed retry charges nothing. No new quote or duplicated reward."
 COLDWAR_IRQ_decision_organize_western:0 "Organize the Western Outlook"
 COLDWAR_IRQ_decision_organize_western_desc:0 "Available from start without a focus or governing-party requirement. Select an actually registered party of this outlook; a completed campaign supplies native +3-point party-support and +3-point outlook inputs, followed by MD normalization. Final gains follow the native array calculation. Costs55PP;180day cooldown. Does not install a government. Western/Non-Aligned historical parties require approved roster registration."
 COLDWAR_IRQ_decision_organize_emerging:0 "Organize the Emerging Outlook"
 COLDWAR_IRQ_decision_organize_emerging_desc:0 "Available from start without a focus or governing-party requirement. Select an actually registered party of this outlook; a completed campaign supplies native +3-point party-support and +3-point outlook inputs, followed by MD normalization. Final gains follow the native array calculation. Costs55PP;180day cooldown. Does not install a government. Western/Non-Aligned historical parties require approved roster registration."
 COLDWAR_IRQ_decision_organize_nonaligned:0 "Organize the Non-Aligned Outlook"
 COLDWAR_IRQ_decision_organize_nonaligned_desc:0 "Available from start without a focus or governing-party requirement. Select an actually registered party of this outlook; a completed campaign supplies native +3-point party-support and +3-point outlook inputs, followed by MD normalization. Final gains follow the native array calculation. Costs55PP;180day cooldown. Does not install a government. Western/Non-Aligned historical parties require approved roster registration."
 COLDWAR_IRQ_decision_organize_nationalist:0 "Organize the Nationalist Outlook"
 COLDWAR_IRQ_decision_organize_nationalist_desc:0 "Available from start without a focus or governing-party requirement. Select an actually registered party of this outlook; a completed campaign supplies native +3-point party-support and +3-point outlook inputs, followed by MD normalization. Final gains follow the native array calculation. Costs55PP;180day cooldown. Does not install a government. Western/Non-Aligned historical parties require approved roster registration."
 COLDWAR_IRQ_spirit_july_state:0 "The July State"
 COLDWAR_IRQ_spirit_july_state_desc:0 "The 1968 regime rests on the Revolutionary Command Council, party organization and coercive institutions. State consolidation conceals factional insecurity."
 COLDWAR_IRQ_spirit_unsettled_north:0 "An Unsettled Northern Question"
 COLDWAR_IRQ_spirit_unsettled_north_desc:0 "The Kurdish war and unresolved demands for autonomy strain Baghdad. The March 1970 accord is still a negotiation, not a starting achievement."
 COLDWAR_IRQ_spirit_ipc:0 "Oil Beneath Foreign Concessions"
 COLDWAR_IRQ_spirit_ipc_desc:0 "The Iraq Petroleum Company concession system and disputes over production constrain control over oil revenue despite the 1961 expropriation of undeveloped concession areas."
 COLDWAR_IRQ_spirit_rural:0 "The Unfinished Agrarian Reform"
 COLDWAR_IRQ_spirit_rural_desc:0 "Unequal landholding, weak delivery of reform, rural credit shortages and limited irrigation hinder agriculture and encourage migration."
 COLDWAR_IRQ_spirit_literacy:0 "A Narrow Base of Skills"
 COLDWAR_IRQ_spirit_literacy_desc:0 "Low literacy and uneven access to education restrict the capacity to absorb complex civilian and military technology."
 COLDWAR_IRQ_spirit_patronage:0 "Patronage and Parallel Chains of Command"
 COLDWAR_IRQ_spirit_patronage_desc:0 "Personal networks and competing civilian, security and military authorities obstruct administration. This is not a claim that every Iraqi institution was equally dysfunctional."
 COLDWAR_IRQ_spirit_frontier:0 "The Shatt al-Arab Dispute"
 COLDWAR_IRQ_spirit_frontier_desc:0 "The border and navigation dispute with Iran worsened in 1969. It is a diplomatic problem with potential military costs, not an unavoidable future war."
 COLDWAR_IRQ_iran_opening_offensive:0 "The Southern Offensive"
 COLDWAR_IRQ_iran_opening_offensive_desc:0 "Prepared attacks against Iranian forces have a short operational window. Fuel and supply costs affect the entire Iraqi army. Peace ends the advantage; it never restarts."
 COLDWAR_IRQ_iran_sustained_offensive:0 "A Prepared Iranian Campaign"
 COLDWAR_IRQ_iran_sustained_offensive_desc:0 "A larger reserve supports a longer opening operation, with a smaller attack advantage and continuing logistical costs."
 COLDWAR_IRQ_iran_mobilization_bill:0 "The Mobilization Bill"
 COLDWAR_IRQ_iran_mobilization_bill_desc:0 "Personnel and transport obligations remain payable even if the initial campaign ends early."
 COLDWAR_IRQ_iran_disarray_assessment:0 "Intelligence on Iranian Disarray"
 COLDWAR_IRQ_iran_disarray_assessment_desc:0 "A funded assessment of an actual Iranian political crisis accelerates planning. It does not weaken Iranian units or guarantee local cooperation."
 COLDWAR_IRQ_iran_attrition_bill:0 "A War Beyond the First Campaign"
 COLDWAR_IRQ_iran_attrition_bill_desc:0 "After 180 continuous days at war with Iran, replacement, transport and political burdens grow. This burden ends at peace."
 COLDWAR_IRQ_iran_followup_offensive:0 "A Renewed Southern Offensive"
 COLDWAR_IRQ_iran_followup_offensive_desc:0 "Another paid offensive offers a smaller advantage against Iran, at higher logistical strain. It cannot overlap the opening or another renewed offensive."
 COLDWAR_IRQ_iran_followup_bill:0 "Replacement and Transport Contracts"
 COLDWAR_IRQ_iran_followup_bill_desc:0 "The renewed offensive leaves ninety days of personnel obligations, including after an early peace."
 COLDWAR_IRQ_shortcut_state:0 "The Iraqi State"
 COLDWAR_IRQ_shortcut_baath:0 "The Baath Party"
 COLDWAR_IRQ_shortcut_communists:0 "The Iraqi Communist Party"
 COLDWAR_IRQ_shortcut_civic:0 "National Democrats · Hadid"
 COLDWAR_IRQ_shortcut_kurds:0 "The Barzani Leadership · KDP"
 COLDWAR_IRQ_shortcut_oil:0 "Oil, Revenue and Sovereignty"
 COLDWAR_IRQ_shortcut_defence:0 "The Armed Forces"
 COLDWAR_IRQ_shortcut_foreign:0 "Iraq in the Cold War"
 COLDWAR_IRQ_shortcut_iran_war:0 "Iran: Road to War"
