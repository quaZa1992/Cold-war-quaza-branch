<script type="application/json" id="usg-data">{"country":"USA","phase":"CONCEPT ONLY - AWAITING APPROVAL","nodes":[{"id":"COLDWAR_USA_gulf_desert_storm","title":"Desert Storm","narrative_title":"Desert Storm","group":"gulf","xy":[4,0],"days":14,"cost":2,"prerequisites":[],"mutually_exclusive":[],"icon":"army_reform","description":"Authorize a coalition war to reverse the conquest of Kuwait. This is a direct crisis entry; coalition-building and deployment focuses are optional preparations.","reward_summary":["Create a liberation war goal against IRQ, valid for 90 days. The USA player chooses whether to declare war.","No automatic war, victory, occupation, regime change or Kurdish uprising. Recheck the unresolved crisis before delivery.","Actual deployed forces incur normal MD military expenses. There is no free army or combat multiplier."],"historical_status":"Historical sequence; proposed gameplay","available":"Actual Iraqi attack on Kuwait has been recorded, and Iraqi aggression/occupation is unresolved. A quick annexation of Kuwait does not erase the crisis. A complete withdrawal and restored Kuwaiti sovereignty close this opportunity.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_desert_shield","title":"Desert Shield","narrative_title":"Desert Shield","group":"gulf","xy":[0,0],"days":14,"cost":2,"prerequisites":[],"mutually_exclusive":[],"icon":"focus_generic_supply_line","description":"Request staging rights and prepare regional logistics without delaying the direct Desert Storm option.","reward_summary":["Offer a $2.0 billion staging/logistics package. Deduct money only after a host accepts and funds remain available.","Receive only the access/basing rights accepted by that host; no automatic Saudi or Turkish participation.","No free bases, divisions, equipment or automatic alliance membership."],"historical_status":"Historical sequence; proposed gameplay","available":"The same unresolved Iraqi attack on Kuwait; an existing regional host must consent.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_coalition","title":"Coalition Mandate","narrative_title":"Coalition Mandate","group":"gulf","xy":[8,0],"days":21,"cost":3,"prerequisites":[],"mutually_exclusive":[],"icon":"diplomatic_treaty","description":"Negotiate separate commitments from Britain, France and regional governments around Kuwaiti restoration.","reward_summary":["Unlock recipient-owned coalition invitations, cost-sharing and access agreements.","Each player can accept, refuse or restrict its commitment. Financial pledges transfer actual treasury funds once.","A Kuwaiti liberation mandate does not automatically authorize an invasion of Baghdad or Kurdish independence."],"historical_status":"Historical sequence; proposed gameplay","available":"Unresolved Iraqi attack on Kuwait. Each invited government exists and controls its response.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_appeal","title":"Appeal to Iraq","narrative_title":"Appeal to Iraq","group":"gulf","xy":[4,1],"days":14,"cost":2,"prerequisites":[["COLDWAR_USA_gulf_desert_storm"]],"mutually_exclusive":[],"icon":"government_beu","description":"Encourage Iraqi civilians and military officers to remove the ruling leadership. The appeal is a political signal, not an unconditional promise of American military support.","reward_summary":["Unlock a one-time public appeal and opposition response events.","For 90 days, an already organized Kurdish opposition may seek American assurances and coordinate a rising after an actual Iraqi military setback.","No automatic stability subtraction, territorial transfer or revolt. A respected Kurdish autonomy settlement disables the grievance-based uprising offer."],"historical_status":"Historical sequence; proposed gameplay","available":"An actual USA/coalition war against IRQ is underway or ended within 180 days; Iraq still has unresolved domestic opposition.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_contacts","title":"Kurdish Contacts","narrative_title":"Kurdish Contacts","group":"gulf","xy":[4,2],"days":21,"cost":3,"prerequisites":[["COLDWAR_USA_gulf_appeal"]],"mutually_exclusive":[],"icon":"self_management","description":"Open separate channels to the Kurdish parties. Their priorities and rivalries remain distinct.","reward_summary":["Unlock offers to existing local KDP and, if actually formed, PUK representatives.","Kurdish players choose negotiation, neutrality or preparation for a rising. Refusal produces no payment or unit grant.","An uprising requires local organization plus coercion/broken autonomy or a comparable real grievance, and an actual Iraqi military opening.","No Kurdish country is required for political contacts: an underground movement can be represented by crisis events and state records. Without a playable Kurdish actor, local responses are scripted; Baghdad does not choose whether its opponents accept US aid."],"historical_status":"Historical sequence; proposed gameplay","available":"Unresolved northern grievances and identifiable local political actors; do not create KDP/PUK unity merely by completing this focus.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_limited_war","title":"A Limited War","narrative_title":"A Limited War","group":"gulf","xy":[2,3],"days":14,"cost":2,"prerequisites":[["COLDWAR_USA_gulf_contacts"]],"mutually_exclusive":["COLDWAR_USA_gulf_arm_front"],"icon":"diplomatic_treaty","description":"Keep military action focused on Kuwait while retaining political contacts and a humanitarian response.","reward_summary":["Choose the historical initial restraint: no American arms package or automatic combat support for an internal rising.","Retain access to refugee relief and later protection when a real crisis develops.","Avoid the insurgency subsidy and its exposure risk, while Kurdish partners may refuse assurances they consider insufficient."],"historical_status":"Historical initial policy; humanitarian protection followed later","available":"No direct-arms commitment has been adopted for this crisis.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_arm_front","title":"Arm the Front","narrative_title":"Arm the Front","group":"gulf","xy":[6,3],"days":21,"cost":3,"prerequisites":[["COLDWAR_USA_gulf_contacts"]],"mutually_exclusive":["COLDWAR_USA_gulf_limited_war"],"icon":"army_reform","description":"Make a stronger commitment than the initial 1991 policy by funding and supplying organized Kurdish forces.","reward_summary":["Unlock one initial offer: $0.25 billion and 1,000 existing infantry_weapons_1 equipment items from the US stockpile, total for this programme rather than per party.","Deliver only after acceptance, a valid recipient/supply route, sufficient actual treasury/stockpile, and current eligibility. No new equipment is spawned.","A 90-day support agreement may continue for $0.05 billion per week, with explicit renewal and recipient consent. Funded advisers can grant the recipient +8% defence against IRQ for the same 90 days; this is country-targeted, not geographically restricted.","Exposure creates a Turkish diplomatic response and Iraqi counteraction. Aid does not guarantee a successful rising.","WITHOUT A KURDISH COUNTRY: unlock Fund the Kurdish Underground. Spend the same initial $0.25bn programme invoice and commit the same 1,000 actual infantry_weapons_1 items to one tracked clandestine cache. No payment or send_equipment targets an absent country.","Begin in at most two organized, eligible northern states: enable genuine resistance against IRQ while retaining Iraqi cores; raise resistance to at least 60% once per state per crisis, never reduce a higher current value. Renewed funded support adds +25 percentage points to the native resistance TARGET for 90 days; this does not set the final target to 80%.","At most one paid reinforcement pulse per 30 days adds +10 resistance points, up to 80% from this scripted pulse. A funded Iraqi security operation prevents that automatic pulse. Normal resistance, garrisons and Iraqi decisions continue to change the value.","High resistance alone is not an instant liberation button. Sustained northern crisis plus the actual US intervention/military opening can start a visible 45-day uprising warning. Iraq can pay for countermeasures, negotiate, or risk a bounded Kurdish rising."],"historical_status":"ALT: direct armed support beyond the initial US policy of 1991","available":"No limited-war policy for this crisis; organized local opposition and real unresolved northern grievances exist. If a Kurdish country exists, use its accepted aid contract. If none exists, the paid underground route is available in eligible Iraqi-controlled northern states.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Native core-state support exists: force_enable_resistance = { occupier = IRQ }; start_resistance = KUR or PUK only for that tag's actual core. set_resistance = 60 is a guarded one-time minimum; add_resistance_target = { id = 19709101 amount = 25 occupier = IRQ days = 90 } adds 25 points, not a hard cap. The native primitives are verified; ownership checks, local organization, invoices, cache accounting, pulse cooldowns, the scoped uprising and native-revolt coordination remain new COLDWAR integration."},{"id":"COLDWAR_USA_gulf_northern_access","title":"Northern Access","narrative_title":"Northern Access","group":"gulf","xy":[0,4],"days":14,"cost":2,"prerequisites":[],"mutually_exclusive":[],"icon":"focus_generic_supply_line","description":"Negotiate the access needed for northern relief and patrols. Turkey retains its own interests and conditions.","reward_summary":["Unlock a separate northern access agreement. Initial US logistics commitment: $0.50 billion on acceptance.","Turkey can refuse, restrict military activity or request safeguards against separatist spillover.","An accepted agreement grants actual air-base access as well as any agreed military access. USA receives air_base_access to the consenting host through the native diplomatic_relation effect.","US aircraft still need actual basing capacity and range. No host territory or aircraft is transferred."],"historical_status":"Historical sequence; proposed gameplay","available":"A willing host can provide a feasible northern route. The earlier staging agreement alone does not confer Turkish rights.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"# Native effect only after the host accepts its agreement.\n# Example: USA receives actual air-base access to consenting TUR.\nUSA = {\n diplomatic_relation = { country = TUR relation = air_base_access active = yes }\n}\n# A different accepted host is used in its own agreement. No automatic Turkish consent."},{"id":"COLDWAR_USA_gulf_comfort","title":"Provide Comfort","narrative_title":"Provide Comfort","group":"gulf","xy":[4,4],"days":14,"cost":2,"prerequisites":[],"mutually_exclusive":[],"icon":"welfare","description":"Organize multinational relief and protected return after repression and mass flight.","reward_summary":["Unlock an initial $0.50 billion relief operation and a 90-day relief programme costing $0.025 billion per week.","Recipients and access partners consent. Relief delivery supports return and recovery only in accessible affected locations.","No national prosperity bonus, automatic ownership change or blanket immunity for Kurdish forces. Unfunded deliveries stop."],"historical_status":"Historical sequence; proposed gameplay","available":"A real northern displacement/repression crisis has occurred. This independent humanitarian entry does not require the USA to have encouraged or armed the uprising.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_safe_haven","title":"Northern Safe Haven","narrative_title":"Northern Safe Haven","group":"gulf","xy":[2,5],"days":21,"cost":3,"prerequisites":[["COLDWAR_USA_gulf_comfort"],["COLDWAR_USA_gulf_northern_access"]],"mutually_exclusive":[],"icon":"government_beu","description":"Protect a bounded northern refuge and enable displaced people to return. This is not a claim to all Kurdish-inhabited territory.","reward_summary":["Unlock a 90-day protection commitment costing $0.05 billion per week beyond normal deployed-force expenses.","Protection operates only where forces and access genuinely permit it. Iraqi threats trigger consultation/escalation decisions.","Core candidate region for a later settlement: states 164, 633, 630 and 1078, individually checked for actual control and agreements.","Kirkuk (165) is separately disputed; it is not handed over with the safe haven."],"historical_status":"Historical sequence; proposed gameplay","available":"Accessible affected northern locations; actual local/coalition protection and a funded relief operation.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_no_fly","title":"Northern Air Shield","narrative_title":"Northern Air Shield","group":"gulf","xy":[6,5],"days":21,"cost":3,"prerequisites":[["COLDWAR_USA_gulf_comfort"],["COLDWAR_USA_gulf_northern_access"]],"mutually_exclusive":[],"icon":"air_superiority","description":"Prepare American interception missions and offer Kurdish ground forces coalition air-cover coordination. The programme improves air operations and reduces the damage suffered by the protected forces.","reward_summary":["USA receives Northern Air Readiness for 90 days: +15% interception mission efficiency, +10% air-superiority mission efficiency and +15% air-force personnel cost modifier. These affect the actual US air force country-wide.","Unlock an accepted 90-day Coalition Air Cover offer for each eligible existing KUR/PUK recipient: +25% damage reduction against CAS, -20% effect of enemy air superiority on its divisions, and +5% army personnel cost modifier for liaison/coordination.","Recipient modifiers affect its forces wherever they fight and against all applicable enemies. They are not a geographically enforced flight ban or an Iraq-only penalty.","If no Kurdish country exists yet, the US aircraft package still works. Country-level protection can be granted after a valid local actor emerges; it is not applied to Iraqi-owned states.","Manage the 90-day commitment through a normal renewal/withdrawal decision. The native military budget pays the higher air-force personnel expenses; only one readiness package is active. Renewal replaces the old package with a fresh 90-day idea and seeks renewed host/recipient consent.","If the host revokes air-base access, actual basing follows normal game restrictions. The completed readiness/liaison training and its costs continue to their expiry unless USA withdraws the programme; access loss does not automatically erase these country ideas.","Actual interception or air-superiority sorties use the normal air interface and actual aircraft. Combat requires the normal war/deployment conditions; peacetime aircraft are not automatically intercepted."],"historical_status":"Historical sequence; proposed gameplay","available":"A northern protection crisis remains active; an existing host has accepted actual air-base access; the USA has deployed aircraft. Existing KUR/PUK recipients must accept their own support offer.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"# USA completion payload; idea definitions are included in the review-only specimen.\nadd_timed_idea = { idea = COLDWAR_USA_northern_air_readiness days = 90 }\n# Separate KUR/PUK acceptance event, in that recipient's scope:\n# add_timed_idea = { idea = COLDWAR_KUR_coalition_air_cover days = 90 }\n# Recipient idea cancel = { OR = {\n#  NOT = { USA = { exists = yes has_idea = COLDWAR_USA_northern_air_readiness } }\n#  has_war_with = USA\n# } }\n# Native cancellation caps late recipient grants to the common sponsor's active term.\n# US withdrawal payload: remove_ideas = COLDWAR_USA_northern_air_readiness\n# Also remove COLDWAR_KUR_coalition_air_cover from current KUR/PUK recipients.\n# Renewal: remove the previous idea, then add_timed_idea with days = 90.\n# Each recipient renewal requires fresh acceptance before its own remove/add payload.\n# Native support uses air_intercept_efficiency (not air_interception_efficiency)."},{"id":"COLDWAR_USA_gulf_assembly","title":"Regional Assembly","narrative_title":"Regional Assembly","group":"gulf","xy":[2,6],"days":28,"cost":4,"prerequisites":[["COLDWAR_USA_gulf_safe_haven"]],"mutually_exclusive":[],"icon":"Election_graphics","description":"Support a regional assembly, civil administration and a negotiated division of authority between Kurdish parties.","reward_summary":["Offer $0.25 billion for local administration and elections; pay once after a valid local recipient accepts.","Local decisions choose a shared administration or competing party structures. Washington does not appoint a ruler by focus.","An accepted settlement can define internal self-government within Iraq; de facto administration requires actual Kurdish control.","Local self-government receives actual regional administration and revenue; Baghdad loses direct collection/recruitment where it genuinely loses control. No fictional country-wide penalty is substituted for this.","No automatic independence, US puppet status, Kirkuk transfer, new population or extra oil."],"historical_status":"Historical sequence; proposed gameplay","available":"A viable Kurdish local administration or an accepted autonomy framework controls the participating locations; the local parties consent.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_baghdad_accord","title":"Baghdad Accord","narrative_title":"Baghdad Accord","group":"gulf","xy":[0,7],"days":28,"cost":4,"prerequisites":[["COLDWAR_USA_gulf_assembly"]],"mutually_exclusive":[],"icon":"diplomatic_treaty","description":"Seek recognition of Kurdish self-government within Iraq, including a practical budget and security settlement.","reward_summary":["Unlock recipient-owned negotiations on internal government, security authority, revenue and guarantees.","If accepted by both sides, a new explicitly designed IRQ-Kurdish autonomy arrangement replaces the current disputed status; no 75% factory tribute.","Rejection leaves the protected de facto route available. Previously agreed and respected autonomy blocks attempts to manufacture the same grievance-based rising.","Formal recognition does not replay aid or create a second autonomous country."],"historical_status":"Historical sequence; proposed gameplay","available":"A local administration exists; Baghdad and the Kurdish representatives can negotiate freely.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_self_rule","title":"Guarantee Self-Rule","narrative_title":"Guarantee Self-Rule","group":"gulf","xy":[4,7],"days":28,"cost":4,"prerequisites":[["COLDWAR_USA_gulf_assembly"],["COLDWAR_USA_gulf_no_fly"]],"mutually_exclusive":[],"icon":"government_beu","description":"Commit to preserving northern self-government even if Baghdad refuses formal recognition.","reward_summary":["Offer a renewable 90-day security commitment; maintain the existing protection agreement and one Northern Air Readiness military-cost modifier.","If Baghdad refuses recognition, actual Kurdish-held territory can remain a protected de facto enclave. Iraqi legal claims are not silently erased.","If a formal settlement exists, guarantee that settlement rather than creating a second status.","Withdrawal, lost access or unpaid commitments end US programme benefits and expose the region to a new crisis. Guarantees do not force an automatic US war."],"historical_status":"Historical sequence; proposed gameplay","available":"Actual Kurdish self-government/control OR a mutually accepted autonomy settlement; active host access, protection funding and the Northern Air Shield programme.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."},{"id":"COLDWAR_USA_gulf_recovery","title":"Northern Recovery","narrative_title":"Northern Recovery","group":"gulf","xy":[2,8],"days":28,"cost":4,"prerequisites":[["COLDWAR_USA_gulf_baghdad_accord","COLDWAR_USA_gulf_self_rule"]],"mutually_exclusive":[],"icon":"crane_and_tower","description":"Help the regional administration rebuild while confronting factional competition and outside dependence.","reward_summary":["Offer a one-time $0.50 billion reconstruction grant to the valid local administration; actual payment requires US funds and recipient acceptance.","Spend the grant through costed local projects with native capacity checks; no free or duplicated factories.","Persistent local infrastructure belongs to the local administration. US influence and ongoing programme benefits depend on current agreements.","KDP-PUK rivalry, disputed borders and relations with Turkey remain live decisions."],"historical_status":"Historical sequence; proposed gameplay","available":"An actual recognized settlement OR viable protected de facto self-rule exists; participating Kurdish actors accept the investment contract.","active_condition":"Only while the corresponding agreement, funding and current local conditions remain valid.","requirement_contracts":[],"modifiers":{},"effect_body":"Design contract only. Native primitives and new integration requirements are listed under Mechanic limits. No runnable reward or new provider is claimed here."}],"groups":[{"id":"gulf","label":"Gulf Intervention & Kurdish Self-Rule","outlook":"shared","ownership":"USA crisis programme; local political outcomes require the relevant Iraqi/Kurdish participants","shape":"Direct war entry; optional preparations; political fork; independent relief entry; protection and negotiated/de facto outcomes"}],"decisions":[{"id":"COLDWAR_USA_gulf_appeal_offer","label":"Broadcast the Appeal","unlock":"COLDWAR_USA_gulf_appeal","group":"gulf","pp":25,"days":0,"summary":"Once per crisis: invite a local response, with no guaranteed revolt or automatic US combat promise."},{"id":"COLDWAR_USA_gulf_rising_response","label":"Coordinate a Local Rising","unlock":"COLDWAR_USA_gulf_contacts","group":"gulf","pp":0,"days":0,"summary":"Recipient-owned choice. Requires real unresolved grievances, local organization and an Iraqi military setback; respected autonomy blocks this route. Local actors may negotiate, wait or rise. USA support can influence preparation, never guarantee success."},{"id":"COLDWAR_USA_gulf_arms_offer","label":"Offer the Initial Arms Package","unlock":"COLDWAR_USA_gulf_arm_front","group":"gulf","pp":25,"days":0,"summary":"Accepted transaction only: US treasury -$0.25bn, recipient +$0.25bn; send_equipment transfers 1,000 existing infantry_weapons_1 items from the US stockpile. This is one total package, not one per party. Debit and credit once. No delivery without a valid local recipient and route. This existing-country offer and Fund the Kurdish Underground share one initial-package consumed marker; forming a country does not unlock a second grant."},{"id":"COLDWAR_USA_gulf_renew_arms","label":"Renew Kurdish Support","unlock":"COLDWAR_USA_gulf_arm_front","group":"gulf","pp":0,"days":90,"summary":"90-day, recipient-consented contract. US -$0.05bn/week, valid recipient +$0.05bn/week; active funded advisers grant +8% defence against IRQ. Proposed idea COLDWAR_KUR_us_advisers uses native targeted_modifier = { tag = IRQ defense_bonus_against = 0.08 }. It is country-targeted, not geographically restricted. No overlapping copies; terminate when access, eligibility, recipient or funding is lost. Existing-country and underground support use one programme budget. At country emergence convert the remaining term and funding once; do not run both bills or both reward packages."},{"id":"COLDWAR_USA_gulf_refugees","label":"Fund Refugee Relief","unlock":"COLDWAR_USA_gulf_comfort","group":"gulf","pp":0,"days":90,"summary":"Initial -$0.50bn relief invoice; then -$0.025bn/week for 90 days. Relief spending is not an extra cash payment to all parties. Start/renew explicitly, recheck access and treasury every tick."},{"id":"COLDWAR_USA_gulf_patrols","label":"Manage Coalition Air Cover","unlock":"COLDWAR_USA_gulf_no_fly","group":"gulf","pp":0,"days":90,"summary":"Choose renewal of one 90-day programme or withdrawal. Renewal requires a continuing northern crisis and renewed host consent. Reset the USA package with remove_ideas then add_timed_idea for exactly 90 days. Refresh each recipient only after renewed acceptance, likewise remove then add. USA: +15% interception mission efficiency, +10% air-superiority mission efficiency, +15% air-force personnel cost modifier. Consenting KUR/PUK: +25% CAS damage reduction, -20% enemy air-superiority effect, +5% army personnel cost modifier. Recipient effects cancel when the US readiness idea ends or the recipient fights USA. Withdrawal removes the USA idea and current KUR/PUK cover ideas immediately. Host access loss restricts actual basing but does not automatically remove existing training/readiness ideas; they continue with their costs to expiry or withdrawal."},{"id":"COLDWAR_USA_gulf_respond","label":"Respond to a Protection Crisis","unlock":"COLDWAR_USA_gulf_self_rule","group":"gulf","pp":0,"days":0,"summary":"Choices: negotiate a withdrawal of Iraqi forces, sustain/strengthen the military commitment, or end the guarantee. Escalation offers a concrete player-controlled response; no automatic war or remote territorial gift."},{"id":"COLDWAR_USA_gulf_accord","label":"Offer the Baghdad Settlement","unlock":"COLDWAR_USA_gulf_baghdad_accord","group":"gulf","pp":25,"days":0,"summary":"Baghdad and the Kurdish representatives each accept or refuse the specified autonomy, budget and security terms. Acceptance establishes one status; de facto protection remains possible after refusal."},{"id":"COLDWAR_USA_gulf_reconstruction","label":"Fund Regional Reconstruction","unlock":"COLDWAR_USA_gulf_recovery","group":"gulf","pp":0,"days":0,"summary":"Once-only accepted grant: US -$0.50bn, regional administration +$0.50bn. New locally funded projects check construction capacity and spend that grant rather than granting duplicate buildings."},{"id":"COLDWAR_USA_gulf_underground","label":"USA · Fund the Kurdish Underground","unlock":"COLDWAR_USA_gulf_arm_front","group":"gulf","pp":25,"days":0,"unlock_label":null,"actor":"USA","summary":"Alternative use of the existing initial package: pay $0.25bn and debit 1,000 eligible actual infantry_weapons_1 items into one recorded cache. Requires no Kurdish country, real local organization/grievance, a feasible paid route and IRQ ownership/control. Begin in at most two states among 164/633/630/1078. Force-enable resistance against IRQ, bind to an appropriate local KUR/PUK core tag and seed a one-time 60% minimum. Halabja 1078 requires an actually formed PUK movement for that binding; never invent a 1970 PUK or silently add KUR cores. Preserve all cores; no country, units or territory are created at this step. Existing native resistance must be reconciled rather than overwritten."},{"id":"COLDWAR_USA_gulf_sustain_underground","label":"USA · Sustain the Clandestine Network","unlock":"COLDWAR_USA_gulf_arm_front","group":"gulf","pp":0,"days":90,"unlock_label":null,"actor":"USA","summary":"Renewable 90-day contract, $0.05bn/week, prorated over actual active days. This is spent US operational funding, not a treasury gift to absent KUR or to Iraq. One native target contribution of +25 points per affected state, identified by 19709101; renewal replaces/extends that contribution, never stacks it. Optional expansion to another eligible northern state costs $0.10bn and takes 30 days of continuing funding; the initial seed can never replay in an already touched state. Reinforcement pulses: at most +10 current resistance points per 30 days, never pushing the value above 80 by that pulse; skip the pulse during an active paid Iraqi security operation. Persist seed markers and pulse cooldowns through renewal, withdrawal and government change. Native resistance growth can still exceed 80: 80 is NOT an engine cap."},{"id":"COLDWAR_IRQ_northern_security","label":"IRAQ · Emergency Security Appropriation","unlock":null,"group":"gulf","pp":0,"days":90,"unlock_label":"Live northern insurgency in Iraq; independent of US focus completion","actor":"IRAQ","summary":"IRAQI RESPONSE: visible when a relevant northern insurgency is active, regardless of whether USA has completed or revealed its focus. One-time preparation invoice: 2% of frozen Iraqi annual GDP. Active 90-day package: +35% army personnel cost modifier and +20% equipment upkeep modifier, additional to other valid MD war costs. A viable actual garrison/force commitment is required. After 30 funded days, reduce resistance by 15 points in each affected IRQ-owned/controlled campaign state; apply a separate -20-point resistance-target contribution for the remaining term. Block the scripted US reinforcement pulse while this operation is funded. These are extra expenses, not free garrison strength or immunity. Shares a 90-day operation cooldown with the larger operation."},{"id":"COLDWAR_IRQ_northern_major_operation","label":"IRAQ · Expand Northern Operations","unlock":null,"group":"gulf","pp":0,"days":90,"unlock_label":"Live northern insurgency in Iraq; independent of US focus completion","actor":"IRAQ","summary":"IRAQI RESPONSE: choose instead of Emergency Security Appropriation at the start of a new 90-day operation cycle. Invoice: 4% of frozen annual GDP. One 90-day spending package: +60% army personnel cost modifier and +35% equipment upkeep modifier. A viable actual garrison/force commitment is required. After 30 funded days, reduce current resistance by 25 points in affected campaign states and apply -35 target points for the remaining term. This REPLACES the smaller package, never adds both; the shared cooldown prevents mid-cycle switching or replaying reductions. Normal garrison requirements/losses and real state-control checks remain. An operation does not guarantee a political settlement; new aid and continuing grievances can revive resistance."},{"id":"COLDWAR_IRQ_northern_talks","label":"IRAQ · Reopen Kurdish Negotiations","unlock":null,"group":"gulf","pp":50,"days":30,"unlock_label":"Live northern insurgency in Iraq; independent of US focus completion","actor":"IRAQ","summary":"IRAQI RESPONSE: may be attempted from the beginning of the northern crisis, not gated by US focus completion. Talks do not automatically succeed. An accepted, implemented regional settlement reduces current campaign resistance by 30 points, ends the associated uprising warning, and blocks renewed US exploitation of that resolved grievance. Reconstruction invoice: 2% of frozen annual GDP on acceptance. Real local budget/security powers and the cost of reduced central control are specified in the agreement; no free pacification button."},{"id":"COLDWAR_IRQ_northern_withdraw_security","label":"IRAQ · End the Northern Operation","unlock":null,"group":"gulf","pp":0,"days":0,"unlock_label":"Live northern insurgency in Iraq; independent of US focus completion","actor":"IRAQ","summary":"IRAQI RESPONSE: end the current exceptional military-spending package and its target reduction. Preparation expenditure is sunk and the 90-day operation cooldown remains, preventing instant restart rewards. Resistance and grievances do not reset; the US network may resume pressure. A government change neither replays the resistance reduction nor erases remaining contracted bills automatically."},{"id":"COLDWAR_USA_gulf_warning","label":"USA · The Northern Uprising Warning","unlock":"COLDWAR_USA_gulf_arm_front","group":"gulf","pp":0,"days":0,"unlock_label":null,"actor":"USA","summary":"NEW SHARED CRISIS MISSION: two eligible northern states at >=80% resistance for 30 consecutive days, a supplied/organized movement, unresolved grievances and an actual US-Iraqi war or recent Iraqi military defeat open a 45-day public warning to Baghdad. No US date lock, no uprising merely because the focus exists. Falling below the two-state condition pauses the warning; 15 consecutive days below it reset the warning. A functioning accepted settlement cancels it. With no Kurdish country, local readiness is handled by scripted political actors, not an Iraqi veto. If the warning expires while all live conditions hold, a coordinated rising can establish bounded local strongholds and a Kurdish actor. Native generic resistance_90 must be integrated so it cannot fire a second, differently scoped civil war."},{"id":"COLDWAR_USA_gulf_uprising_aftermath","label":"USA · Support the Northern Rising","unlock":"COLDWAR_USA_gulf_arm_front","group":"gulf","pp":0,"days":0,"unlock_label":null,"actor":"USA","summary":"At a genuine rising, consume the recorded clandestine cache once. Existing-country aid replaces the underground contract for its remaining term. Create only the authorized northern strongholds and finite locally organized forces; no all-core release, Kirkuk gift, foreign-core transfer or unlimited fully equipped army. If KUR/PUK already exists, support that actual actor rather than creating a duplicate. Baghdad can fight, negotiate or accept a settlement. US relief, protection and self-rule branches then respond to the actual outcome."}],"starting_spirits":[],"modifier_labels":{},"programme_rules":{"scope":"Review-only USA reactive Gulf/Kurdish chapter, not an installed whole-USA tree. Integration beside the current USA programmes remains a later approved layout task. All amounts are balance proposals in MD billions of dollars.","history":"Historical: February 1991 appeal; locally initiated Kurdish rising; initial US restraint; repression/refugees; Provide Comfort; protection and de facto self-government; May 1992 regional elections. Direct US arms support here is an explicit alternate intervention.","entry":"Desert Storm remains a direct 14-day response to an actual unresolved Iraqi attack on Kuwait. Provide Comfort is an independent entry for a real humanitarian crisis, not a reward for encouraging rebellion. No arbitrary 1991 calendar lock or forced Bush succession.","autonomy":"Default MD autonomy_autonomous_state is a strong puppet tier with 75% factory transfer. Do not reuse it for this settlement. Recognized IRQ-Kurdish internal autonomy needs a new explicit status; de facto local control can exist without Baghdad consent. Never make Kurdistan a US subject merely to label it autonomous.","territory":"States 164, 633, 630 and 1078 are a proposal envelope, not an automatic transfer. Check each actual owner/controller and agreed status. Kirkuk 165 remains separately disputed. Do not release every transnational Kurdish core or remove foreign cores wholesale.","air":"Northern Air Shield uses native country ideas: USA interception +15%, air-superiority mission efficiency +10%, air-force personnel cost +15%; accepted KUR/PUK CAS damage reduction +25%, enemy air-superiority effect -20%, army personnel cost +5%. Duration 90 days, renewable without stacking. These modifiers have real national scope, not a geographic flight ban. Native air-base access enables actual basing; real air combat uses normal war and mission rules. Recipient cover cancels when the US readiness idea ends or the recipient fights USA.","transactions":"Offers are recipient-owned. Recheck funds, stockpiles, route, control and consent at delivery. Once-only grants use permanent transaction IDs; save/load, leader change, repeat acceptance and rejoining cannot replay them. Recurring commitments have one owner, one bill and explicit expiry/renewal; weekly rates are prorated over actual active days. Initial access and initial relief have separate invoices, never charged again by a later guarantee.","counterplay":"Baghdad can honor an autonomy agreement, negotiate a new one, sustain coercive policies or challenge protection. A respected settlement removes the corresponding uprising grievance. Turkey, KDP and PUK have their own responses; no unavoidable revolt, guaranteed peace or automatic US victory.","persistent":"Paid permanent construction survives US withdrawal. Logistics/underground/protection contracts depend on their live access, funding and expiry. The earned 90-day air-readiness/liaison-training ideas instead persist with their costs after host access loss until expiry or explicit withdrawal; actual basing still obeys normal access restrictions. Iraqi legal status, local control and foreign guarantees are separate facts; one focus flag does not replace them.","core_resistance":"Confirmed native exception: force_enable_resistance works even on an occupier core, followed by start_resistance. In a USA event use occupier = IRQ, never ROOT (= USA). start_resistance = KUR/PUK binds to an actual core country; the occupied field alone is a filter, not a tag setter. No removal of IRQ cores is necessary.","pressure":"Balance proposal: one-time 60% seed in up to two organized states; +25 points of temporary resistance target and bounded monthly +10-point reinforcement pulses up to 80 from those pulses. No daily floor reset that erases Iraqi reductions. Target contributions are additive; 80 is not a native resistance cap.","security_spending":"IRAQ chooses one 90-day programme: preparation 2% annual GDP with +35% army personnel/+20% equipment upkeep, or preparation 4% GDP with +60%/+35%. Larger replaces smaller. Equipment cost is the native country-wide upkeep modifier for deployed/stockpiled equipment, not procurement prices or a north-only army bill. Ordinary garrisons and other war costs still apply. All figures require balance/runtime testing.","local_penalties":"Native MD already imposes major local effects at 75% resistance: controller supply and movement -50%, attrition modifier +0.30 and disabled strategic redeployment. These are existing threshold effects, not an additional invented national penalty. Actual garrison assignment/occupation-law UI on forced core resistance must be tested; funding alone never creates full garrison strength.","uprising_safety":"Native MD resistance_90 can create a country, transfer all controller-held states with the same occupied_country_tag, generate fully equipped units and declare war. A dedicated COLDWAR northern outcome must coordinate with this existing hook, isolate the authorized geography, pay/consume cached aid once and prevent duplicate revolts. This is REQUIRED NEW integration, not a proven safe consequence of setting resistance to 90 or 100.","cleanup":"Remove/replace only our identified resistance-target contribution on expiry or withdrawal. Retain local resistance after aid ends; it decays through native conditions/counterplay. Record whether this crisis enabled core resistance. Clear the forced override or cancel resistance only when the campaign is resolved and no other active native protest/occupation owner needs it. Do not permanently suppress resistance from another system.","cache":"The initial 1,000-item cache is backed by one matching US stockpile debit; the same initial-package marker is shared with direct country aid. A valid Kurdish actor that emerges by uprising receives the remaining undelivered balance once. Peaceful emergence needs an accepted lawful handover agreement for that same remaining cache, never a new grant. A resolved/defeated movement without a valid handover writes off and clears the remaining cache with no refund or later replay. Mere US funding withdrawal stops support but does not magically recreate/destroy already committed arms; the recorded cache remains bounded until delivery, seizure/writeoff or settlement.","no_country":"An underground movement needs no country to receive political support or create state resistance. Money spent on it leaves the USA treasury; no money/equipment country effect targets an absent tag. A committed equipment cache is backed by one actual stockpile debit and delivered once after a valid Kurdish actor emerges. Baghdad can counter the insurgency before any Kurdish country exists; its responses depend on the live crisis rather than US focus completion."},"sources":[{"label":"Bush appeal, 15 February 1991","url":"https://www.bush41library.gov/digital-research-room/finding-aid/public-papers/remarks-raytheon-missile-systems-plant-employees"},{"label":"US Army CMH: Kurdish rising and Provide Comfort, pp.29-30","url":"https://www.govinfo.gov/content/pkg/GOVPUB-D101-PURL-gpo5268/pdf/GOVPUB-D101-PURL-gpo5268.pdf"},{"label":"Bush refugee/protection statement, 16 April 1991","url":"https://www.bush41library.gov/digital-research-room/finding-aid/public-papers/remarks-assistance-iraqi-refugees-and-news"},{"label":"UN Security Council Resolution 688: no explicit autonomy or NFZ authorization","url":"https://digitallibrary.un.org/record/110659?ln=en"},{"label":"Kurdistan Parliament: regional elections and administration","url":"https://www.parliament.krd/english/about-parliament/history-of-parliament/"},{"label":"FRUS: US Kurdish assistance begun July 1972, confirmed June 1974","url":"https://history.state.gov/historicaldocuments/frus1969-76v27/d254"}],"resistance_campaign":{"phase":"CONCEPT ONLY; no loaded files","states":[{"id":164,"resistance_core_tag":"KUR"},{"id":633,"resistance_core_tag":"KUR"},{"id":630,"resistance_core_tag":"KUR"},{"id":1078,"resistance_core_tag":"PUK","requires_actual_puk_formation":true}],"excluded_automatic_transfer":[165],"seed":60,"target_contribution":25,"term_days":90,"reinforcement":{"days":30,"points":10,"scripted_pulse_ceiling":80,"skip_if_paid_iraqi_operation":true},"warning":{"minimum_states":2,"minimum_resistance":80,"qualifying_days":30,"warning_days":45,"reset_after_below_condition_days":15},"security":{"gdp_share":0.02,"army_personnel_cost_multiplier_modifier":0.35,"equipment_cost_multiplier_modifier":0.2,"resistance_reduction":15,"target_reduction":20,"delivery_after_days":30,"days":90},"major_operation":{"gdp_share":0.04,"army_personnel_cost_multiplier_modifier":0.6,"equipment_cost_multiplier_modifier":0.35,"resistance_reduction":25,"target_reduction":35,"delivery_after_days":30,"days":90},"native_90_coordination":"Required new integration and runtime test; no native per-state hard cap claimed"},"idea_specs":{"COLDWAR_USA_northern_air_readiness":{"label":"Northern Air Readiness","picture":"generic_air_interception","days":90,"modifier":{"air_intercept_efficiency":0.15,"air_superiority_efficiency":0.1,"airforce_personnel_cost_multiplier_modifier":0.15}},"COLDWAR_KUR_coalition_air_cover":{"label":"C #coldwar-usa-gulf-concept .usg-titlebar{position:absolute;left:5px;top:40px;width:164px;height:50px;pointer-events:none}
#coldwar-usa-gulf-concept .usg-title{position:absolute;left:15px;top:58px;width:147px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden;pointer-events:none;font-size:14px;color:var(--usg-text)}
#coldwar-usa-gulf-concept .usg-title canvas{display:block;width:147px;height:20px}
#coldwar-usa-gulf-concept .usg-node[aria-pressed="true"] .usg-icon{filter:drop-shadow(0 0 5px #e4d696)}
#coldwar-usa-gulf-concept .usg-node[aria-pressed="true"] .usg-title{color:#fff0b0}
#coldwar-usa-gulf-concept .usg-node.is-locked .usg-icon{filter:grayscale(.65) brightness(.65)}
#coldwar-usa-gulf-concept .usg-group-label{position:absolute;font-weight:500;text-align:center;width:600px;color:var(--usg-gold);pointer-events:none}
#coldwar-usa-gulf-concept .usg-world.overview .usg-title{visibility:hidden}
#coldwar-usa-gulf-concept .usg-map-key{position:absolute;bottom:10px;left:10px;right:10px;width:fit-content;max-width:calc(100% - 20px);background:#19272deb;padding:6px 9px;font-family:Arial,sans-serif;color:var(--usg-muted);pointer-events:none}
#coldwar-usa-gulf-concept .usg-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--usg-deep);font-family:Arial,sans-serif;color:var(--usg-muted)}
#coldwar-usa-gulf-concept .usg-navigation{padding:10px 14px;background:var(--usg-deep);border-top:1px solid #58676b}
#coldwar-usa-gulf-concept .usg-inspector{padding:18px;background:var(--usg-panel);overflow-wrap:anywhere;font-family:Arial,sans-serif}
#coldwar-usa-gulf-concept .usg-inspector h3{font-family:Georgia,serif;font-weight:500;color:var(--usg-gold);margin:0 0 8px}
#coldwar-usa-gulf-concept .usg-inspector h4{font-weight:500;margin-bottom:6px}
#coldwar-usa-gulf-concept .usg-inspector p{margin:8px 0}
#coldwar-usa-gulf-concept .usg-inspector li{margin:5px 0}
#coldwar-usa-gulf-concept .usg-inspector details{margin-top:12px}
#coldwar-usa-gulf-concept pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--usg-deep);padding:12px;color:var(--usg-text)}
#coldwar-usa-gulf-concept .usg-spirit{padding:12px 0;border-bottom:1px solid #6a7779}
#coldwar-usa-gulf-concept .usg-branch-index{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#coldwar-usa-gulf-concept .usg-branch-index button{border:1px solid #7d8981;background:var(--usg-deep);padding:6px 8px;font-family:Arial,sans-serif}
@media(max-width:500px){#coldwar-usa-gulf-concept .usg-header{padding:12px;gap:10px}#coldwar-usa-gulf-concept .usg-status{max-width:130px}#coldwar-usa-gulf-concept .usg-map{height:510px}#coldwar-usa-gulf-concept select{font-size:16px}#coldwar-usa-gulf-concept .usg-camera button,#coldwar-usa-gulf-concept .usg-navigation button{min-height:44px}#coldwar-usa-gulf-concept .usg-inspector{padding:12px}}
</style>
<script>
(()=>{
 const root=document.getElementById('coldwar-usa-gulf-concept');
 const data=JSON.parse(document.getElementById('usg-data').textContent);
 const map=root.querySelector('#usg-map'),world=root.querySelector('#usg-world'),svg=root.querySelector('.usg-links');
 const select=root.querySelector('#usg-branch'),government=root.querySelector('#usg-government'),detail=root.querySelector('#usg-detail'),meta=root.querySelector('#usg-meta');
 const nodes=new Map(data.nodes.map(n=>[n.id,n])),groups=new Map(data.groups.map(g=>[g.id,g]));
 for(const n of data.nodes){n.ownership=groups.get(n.group).ownership;n.active_condition??=n.available;}
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pos=n=>({x:n.xy[0]*96,y:n.xy[1]*130});
 let current='gulf',picked='COLDWAR_USA_gulf_desert_storm',mode='tree',camera={x:0,y:0,z:1},drag=null,cameraMode='native',suppressClickUntil=0,wheelSave;
 const sections=[['shared','National development'],['nationalist','Nationalist programmes'],['emerging','Emerging programmes'],['nonaligned','Non-Aligned programmes'],['western','Western programmes']];
 for(const [id,title] of sections){const optgroup=document.createElement('optgroup');optgroup.label=title;for(const g of data.groups.filter(g=>g.outlook===id)){const o=document.createElement('option');o.value=g.id;o.textContent=g.label;optgroup.append(o);}select.append(optgroup);}
 function svgEl(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);return el;}
 const width=Math.max(...data.nodes.map(n=>pos(n).x))+350,height=Math.max(...data.nodes.map(n=>pos(n).y))+220;
 world.style.width=width+'px';world.style.height=height+'px';svg.setAttribute('width',width);svg.setAttribute('height',height);
 for(const n of data.nodes){const p=pos(n);for(const row of n.prerequisites)for(const id of row){const q=pos(nodes.get(id)),x1=q.x+80,y1=q.y+90,x2=p.x+80,y2=p.y-26,mid=(y1+y2)/2;const line=svgEl('path',{class:'prerequisite',d:`M${x1},${y1} V${mid} H${x2} V${y2}`});line.dataset.from=id;line.dataset.to=n.id;svg.append(line);}
  for(const id of n.mutually_exclusive){if(id<n.id)continue;const q=pos(nodes.get(id)),x1=Math.min(p.x,q.x)+139,x2=Math.max(p.x,q.x)+27,y=p.y+20;svg.append(svgEl('path',{class:'exclusive',d:`M${x1},${y} H${x2}`}));const t=svgEl('text',{class:'choice-cross',x:(x1+x2)/2,y:y-5});t.textContent='×';svg.append(t);}
  const b=document.createElement('button');b.type='button';b.className='usg-node cursor-interaction';b.dataset.node=n.id;b.setAttribute('aria-label',n.title);b.setAttribute('data-tooltip',n.title);b.setAttribute('aria-pressed','false');b.style.left=p.x+'px';b.style.top=p.y+'px';b.innerHTML=`<img class="usg-icon" src="${data.assets.icons[n.icon]}" alt=""><img class="usg-titlebar" src="${data.assets.unavailable}" alt=""><span class="usg-title">${esc(n.title)}</span>`;world.append(b);
 }
 for(const g of data.groups){const list=data.nodes.filter(n=>n.group===g.id),xs=list.map(n=>pos(n).x),ys=list.map(n=>pos(n).y);const label=document.createElement('div');label.className='usg-group-label';label.textContent=g.label;label.style.left=((Math.min(...xs)+Math.max(...xs))/2+82-300)+'px';label.style.top=(Math.min(...ys)-90)+'px';world.append(label);}
 const atlas=new Image();atlas.onload=()=>{for(const b of world.querySelectorAll('.usg-node')){const n=nodes.get(b.dataset.node),canvas=document.createElement('canvas');canvas.width=147;canvas.height=20;canvas.setAttribute('aria-hidden','true');const ctx=canvas.getContext('2d'),chars=[...n.title],glyphs=data.assets.font_glyphs,kern=data.assets.font_kernings;const total=chars.reduce((s,c,i)=>s+(glyphs[c.codePointAt(0)]||glyphs[63])[6]+(i?(kern[chars[i-1].codePointAt(0)+','+c.codePointAt(0)]||0):0),0);let x=Math.floor((147-total)/2),previous=null;for(const c of chars){const cp=c.codePointAt(0),g=glyphs[cp]||glyphs[63];x+=kern[previous+','+cp]||0;ctx.drawImage(atlas,g[0],g[1],g[2],g[3],x+g[4],2+g[5],g[2],g[3]);x+=g[6];previous=cp;}b.querySelector('.usg-title').replaceChildren(canvas);}};atlas.src=data.assets.font_atlas;
 const activeGroups={bakr:['state','baath','bakr'],saddam:['state','baath','saddam'],aziz:['state','communists','aziz'],civic:['state','civic'],kurds:['state','kurds']};
 for(const g of data.groups.filter(g=>g.outlook!=='shared'&&!['baath','communists'].includes(g.id))){if(![...government.options].some(o=>o.value===g.id)){const o=document.createElement('option');o.value=g.id;o.textContent=g.label+' · ALT government';government.append(o);}if(!activeGroups[g.id])activeGroups[g.id]=['state',g.id];}
 function available(n){return true;}
 function paintGovernment(){for(const b of world.querySelectorAll('.usg-node')){const n=nodes.get(b.dataset.node),ok=available(n);b.classList.toggle('is-locked',!ok);b.querySelector('.usg-titlebar').src=ok?data.assets.available:data.assets.unavailable;}root.querySelector('#usg-total').textContent=`${data.nodes.length} focuses · ${data.decisions.length} decisions · concept only`;}
 function transform(){world.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;world.classList.toggle('overview',camera.z<.65);root.querySelector('#usg-zoom').textContent=Math.round(camera.z*100)+'%';}
 function bounds(all=false){const list=all?data.nodes:data.nodes.filter(n=>n.group===current),ps=list.map(pos);return{left:Math.min(...ps.map(p=>p.x))-25,top:Math.min(...ps.map(p=>p.y))-100,right:Math.max(...ps.map(p=>p.x))+195,bottom:Math.max(...ps.map(p=>p.y))+140};}
 function fit(all=false,native=false){cameraMode=all?'overview':native?'native':'fit';const b=bounds(all),w=map.clientWidth,h=map.clientHeight-root.querySelector('.usg-map-key').offsetHeight-18;camera.z=native?1:Math.min(1,(w-30)/(b.right-b.left),(h-30)/(b.bottom-b.top));camera.x=(w-(b.right-b.left)*camera.z)/2-b.left*camera.z;camera.y=native?45-b.top:(h-(b.bottom-b.top)*camera.z)/2-b.top*camera.z;transform();}
 function zoom(f,cx=map.clientWidth/2,cy=map.clientHeight/2){cameraMode='manual';const z=Math.max(.04,Math.min(1.6,camera.z*f));camera.x=cx-(cx-camera.x)*z/camera.z;camera.y=cy-(cy-camera.y)*z/camera.z;camera.z=z;transform();}
 function state(){return{modelContent:{country:'USA Gulf/Kurdish chapter',selectedProgramme:groups.get(current)?.label,selectedFocus:nodes.get(picked)?.title,government:government.value,view:mode},privateContent:{version:5,current,picked,government:government.value,mode,camera:{...camera},cameraMode}};}
 function remember(){window.openai?.setWidgetState?.(state()).catch(()=>{});}
 function pick(n){picked=n.id;for(const b of world.querySelectorAll('.usg-node'))b.setAttribute('aria-pressed',String(b.dataset.node===picked));
  const pre=n.prerequisites.map(row=>row.map(id=>nodes.get(id).title).join(' OR ')).join(' AND ')||'Independent crisis entry';
  detail.innerHTML=`<h3>${esc(n.title)}</h3><p>${n.days} days · x=${n.xy[0]}, y=${n.xy[1]} · ${esc(n.historical_status)}</p><p>${esc(n.description)}</p><p>Prerequisite: ${esc(pre)}</p>${n.mutually_exclusive.length?`<p>Exclusive with: ${esc(n.mutually_exclusive.map(id=>nodes.get(id).title).join(' / '))}</p>`:''}<h4>Proposed effects and costs</h4><ul>${n.reward_summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${n.modifiers.stability_factor>0?'<p>Positive stability is a package contribution: min(total positive policy contributions, +15%) + all negative policy contributions. Starting situation penalties remain separate.</p>':''}<p>Ownership: ${esc(n.ownership)}</p><details><summary>Crisis and delivery conditions</summary><pre>${esc(n.available)}</pre>${n.requirement_contracts.map(r=>`<p>${esc(r.meaning)}</p><pre>${esc(r.proposed_code)}</pre>`).join('')}<p>Active modifier condition:</p><pre>${esc(n.active_condition)}</pre></details><details><summary>Implementation status</summary><pre>${esc(n.effect_body)}</pre><p>These are reviewable design contracts. Money/equipment transfers and event responses have native primitives; uprising orchestration, internal autonomy and regional protection require newly authored integration. Nothing in this chapter is installed.</p>${Object.keys(n.modifiers).length?`<pre>${esc(Object.entries(n.modifiers).map(([k,v])=>`${k} = ${v}`).join('\n'))}</pre>`:''}</details>`;
 }
 function branch(native=true){mode='tree';select.value=current;const g=groups.get(current),list=data.nodes.filter(n=>n.group===current);meta.textContent=`${g.label} · ${list.length} focuses · ${g.outlook==='shared'?'National programme':'Governing-party / office programme'}${available(list[0])?'':' · Unavailable in this government view'}`;pick(nodes.get(picked)?.group===current?nodes.get(picked):list[0]);fit(false,native);}
 function overview(){mode='overview';meta.textContent=`Chapter overview · ${data.groups.length} programme areas · Native grid 96 × 130`;fit(true);detail.innerHTML='<h3>Gulf Intervention &amp; Kurdish Self-Rule</h3><div class="usg-branch-index">'+data.groups.map(g=>`<button type="button" data-group="${g.id}">${esc(g.label)}</button>`).join('')+'</div>';}
 function showSpirits(){mode='spirits';detail.innerHTML='<h3>No new starting spirits in this reactive chapter</h3>'+data.starting_spirits.map(s=>`<article class="usg-spirit"><h4>${esc(s.label)}</h4><p>${esc(s.description)}</p><ul>${Object.entries(s.modifiers).map(([k,v])=>`<li>${esc(data.modifier_labels[k][0])}: ${v>0?'+':''}${(v*100).toFixed(0)}%</li>`).join('')}${Object.entries(s.native_consequences||{}).map(([k,v])=>`<li>${esc(k)}: ${esc(v)}</li>`).join('')}</ul>${s.native_system?`<p>${esc(s.native_system)}</p>`:''}<p>${esc(s.treatment)}</p></article>`).join('');}
 function showDecisions(){mode='decisions';const list=data.decisions.filter(d=>d.group===current);detail.innerHTML=`<h3>${esc(groups.get(current).label)} · Decisions</h3>`+list.map(d=>`<details open><summary>${esc(d.label)} · ${d.pp} PP · ${d.days} days</summary><p>${esc(d.summary)}</p><p>Unlock: ${esc(d.unlock_label||nodes.get(d.unlock)?.title||'Available from start')}</p>${d.effect_code?`<pre>${esc(d.effect_code)}</pre>`:''}</details>`).join('');}
 function rules(){mode='rules';detail.innerHTML='<h3>Mechanic Limits &amp; Historical Scope</h3><ul>'+Object.values(data.programme_rules).filter(v=>typeof v==='string').map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul><p>Native source-verified primitives: treasury changes, events, equipment stockpile transfers, ownership/control checks and autonomy assignment scope. Custom autonomy, uprising and patrol contracts are proposed; numeric balance and their engine behavior remain untested. Native focus typography uses the inherited UbuntuBold16 bitmap atlas. Browser approximations remain connector routing, glows and availability. The programme selector changes the camera, never focus coordinates.</p>';}
 root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.node){const n=nodes.get(b.dataset.node);current=n.group;select.value=current;mode='tree';pick(n);}else if(b.dataset.group){current=b.dataset.group;picked='';branch();}else if(b.id==='usg-overview')overview();else if(b.id==='usg-native'){branch(true);}else if(b.id==='usg-fit'){branch(false);}else if(b.id==='usg-minus')zoom(1/1.2);else if(b.id==='usg-plus')zoom(1.2);else if(b.id==='usg-spirits')showSpirits();else if(b.id==='usg-decisions')showDecisions();else if(b.id==='usg-rules')rules();remember();});
 select.addEventListener('change',()=>{current=select.value;picked='';branch();remember();});government.addEventListener('change',()=>{paintGovernment();if(mode==='tree')branch();remember();});
 map.addEventListener('wheel',ev=>{ev.preventDefault();ev.stopPropagation();const r=map.getBoundingClientRect();if(ev.ctrlKey||ev.metaKey){if(ev.deltaY)zoom(Math.exp(-ev.deltaY*.002),ev.clientX-r.left,ev.clientY-r.top);}else{const unit=ev.deltaMode===1?16:ev.deltaMode===2?map.clientHeight:1;cameraMode='manual';camera.x-=(ev.shiftKey?ev.deltaX+ev.deltaY:ev.deltaX)*unit;camera.y-=ev.shiftKey?0:ev.deltaY*unit;transform();}clearTimeout(wheelSave);wheelSave=setTimeout(remember,180);},{passive:false});
 map.addEventListener('pointerdown',ev=>{if(!ev.isPrimary||![0,1,2].includes(ev.button))return;suppressClickUntil=0;drag={x:ev.clientX,y:ev.clientY,cx:camera.x,cy:camera.y,id:ev.pointerId,moved:false};if(ev.button!==0)ev.preventDefault();});
 map.addEventListener('pointermove',ev=>{if(!drag||ev.pointerId!==drag.id)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;if(!drag.moved){drag.moved=true;map.setPointerCapture(ev.pointerId);map.classList.add('dragging');}ev.preventDefault();cameraMode='manual';camera.x=drag.cx+dx;camera.y=drag.cy+dy;transform();});
 function stop(ev){if(!drag||ev.pointerId!==drag.id)return;const done=drag;drag=null;if(map.hasPointerCapture(done.id))map.releasePointerCapture(done.id);map.classList.remove('dragging');if(done.moved){suppressClickUntil=performance.now()+400;remember();}}
 map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);map.addEventListener('lostpointercapture',ev=>{if(drag?.id===ev.pointerId)stop(ev);});
 map.addEventListener('click',ev=>{if(ev.detail&&performance.now()<suppressClickUntil){ev.preventDefault();ev.stopImmediatePropagation();}},true);
 map.addEventListener('contextmenu',ev=>ev.preventDefault());map.addEventListener('dragstart',ev=>ev.preventDefault());
 root.addEventListener('keydown',ev=>{if(['SELECT','INPUT','TEXTAREA'].includes(ev.target.tagName))return;const d={ArrowLeft:[80,0],ArrowRight:[-80,0],ArrowUp:[0,80],ArrowDown:[0,-80]}[ev.key];if(d){ev.preventDefault();cameraMode='manual';camera.x+=d[0];camera.y+=d[1];transform();remember();}});
 world.addEventListener('focusin',ev=>{if(drag)return;const n=nodes.get(ev.target.dataset.node);if(!n)return;const p=pos(n),x=p.x*camera.z+camera.x,y=p.y*camera.z+camera.y;if(x<0||x+165*camera.z>map.clientWidth||y<0||y+128*camera.z>map.clientHeight){cameraMode='manual';camera.x=map.clientWidth/2-(p.x+82)*camera.z;camera.y=map.clientHeight/2-(p.y+50)*camera.z;transform();}});
 function restore(value){if(drag)return;const s=value?.privateContent;if([4,5].includes(s?.version)&&groups.has(s.current)){current=s.current;picked=nodes.has(s.picked)?s.picked:'';government.value=s.government||'all';paintGovernment();branch();if(s.mode==='overview')overview();else if(s.mode==='spirits')showSpirits();else if(s.mode==='decisions')showDecisions();else if(s.mode==='rules')rules();if(s.camera&&[s.camera.x,s.camera.y,s.camera.z].every(Number.isFinite)){camera={...s.camera};cameraMode=s.cameraMode||'manual';transform();}}else{government.value='all';paintGovernment();branch();}}
 window.addEventListener('openai:set_globals',ev=>restore(ev.detail?.globals?.widgetState));let measured=map.clientWidth;new ResizeObserver(()=>{const next=map.clientWidth;if(Math.abs(next-measured)>3){const change=next-measured;measured=next;if(cameraMode==='overview')fit(true);else if(cameraMode==='fit')fit(false);else{camera.x+=change/2;transform();}}}).observe(map);restore(window.openai?.widgetState);
})();
</script>
</main></html>
