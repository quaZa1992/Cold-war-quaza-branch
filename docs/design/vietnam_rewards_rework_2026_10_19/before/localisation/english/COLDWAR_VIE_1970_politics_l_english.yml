l_english:
 COLDWAR_VIE_1970_party_0: "£generic_Western_Autocracy_small (VNQDD) Vietnamese Nationalist Party"
 COLDWAR_VIE_1970_party_0_desc: "Nationalist republicanism. The VNQDD is a real anti colonial and anti communist tradition with divided organizations in the South and political exile. A northern return requires a political rupture or negotiated repatriation. Its proposed Nationalist Return Committee is a collective alternate government, not a claim that an uncontested historical leader ruled Hanoi."
 COLDWAR_VIE_1970_party_0_icon: "£generic_Western_Autocracy_small"
 COLDWAR_VIE_1970_party_2: "£generic_liberalism_small Democratic Party of Vietnam"
 COLDWAR_VIE_1970_party_2_desc: "A patriotic intelligentsia party led by Nghiem Xuan Yem, historically allied with the Workers' Party inside the Fatherland Front. Independent constitutional government and liberal political competition are an alternate transformation requiring a new mandate. This is the historical Democratic Party, not the later Viet Tan organization."
 COLDWAR_VIE_1970_party_2_icon: "£generic_liberalism_small"
 COLDWAR_VIE_1970_party_3: "£generic_socialism_small Socialist Party of Vietnam"
 COLDWAR_VIE_1970_party_3_desc: "A patriotic intelligentsia party led by Nguyen Xien, with Hoang Minh Giam as a senior colleague. Historically it participated in the communist led Fatherland Front. Its independent parliamentary and pluralist programme is an alternate mandate. It is distinct from the southern Hoa Hao Democratic Socialist Party and the later People's Action Party."
 COLDWAR_VIE_1970_party_3_icon: "£generic_socialism_small"
 COLDWAR_VIE_1970_party_4: "£generic_Communist_State_small [COLDWAR_VIE_1970_communist_party_name]"
 COLDWAR_VIE_1970_party_4_1970_name: "Workers' Party of Vietnam"
 COLDWAR_VIE_1970_party_4_1976_name: "Communist Party of Vietnam"
 COLDWAR_VIE_1970_party_4_desc: "The revolutionary ruling party. Le Duan is First Secretary, Ton Duc Thang President and Pham Van Dong Prime Minister. Socialist construction, wartime mobilization and reunification compete for scarce resources. The historical leadership succession is Le Duan, Truong Chinh, then Nguyen Van Linh. Vo Van Kiet's personal party chief mandate is an explicit alternative; his historical influence lay in local and national government."
 COLDWAR_VIE_1970_party_4_icon: "£generic_Communist_State_small"
 COLDWAR_VIE_1970_party_19: "£generic_Neutral_Communism_small Vietnam Fatherland Front"
 COLDWAR_VIE_1970_party_19_desc: "Historically a communist led umbrella including parties, mass organizations and religious participants. An autonomous Front Presidium governing through an independent socialist compact is an alternate settlement, not a historical opposition victory or a second Communist Party."
 COLDWAR_VIE_1970_party_19_icon: "£generic_Neutral_Communism_small"
 COLDWAR_VIE_1970_party_22: "£generic_Nat_Autocracy_small Provisional Military Council"
 COLDWAR_VIE_1970_party_22_desc: "An explicit alternate military government, with a choice between permanent emergency authority and civilian transition. The historical People's Army was subordinate to the revolutionary party. No real officer is falsely assigned a historical coup. Civilian nationalists, including Dai Viet figures, can advise the proposed council."
 COLDWAR_VIE_1970_party_22_icon: "£generic_Nat_Autocracy_small"
