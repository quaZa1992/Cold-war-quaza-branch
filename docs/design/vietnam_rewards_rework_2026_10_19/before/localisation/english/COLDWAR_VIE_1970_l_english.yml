 COLDWAR_VIE_campaign_event_137_desc:0 "Renew only a mandate already authorized by the chosen focus. A war goal never declares war or changes the Cambodian government."
 COLDWAR_VIE_campaign_event_137_option_0:0 "Renew the intervention war goal"
 COLDWAR_VIE_campaign_event_137_option_1:0 "Offer limited border terms"
 COLDWAR_VIE_campaign_event_137_option_2:0 "Retain the current mandate"
 COLDWAR_VIE_campaign_event_138_title:0 "Two Front Priorities"
 COLDWAR_VIE_campaign_event_138_desc:0 "Pay for one earned operational posture. This does not cancel a real Cambodian commitment or Chinese war, and its native national costs remain in force."
 COLDWAR_VIE_campaign_event_138_option_0:0 "Review northern readiness"
 COLDWAR_VIE_campaign_event_138_option_1:0 "Review the southwestern posture"
 COLDWAR_VIE_campaign_event_138_option_2:0 "Maintain current priorities"
 COLDWAR_VIE_burden_two_fronts:0 "Two Front Commitments"
 COLDWAR_VIE_burden_two_fronts_desc:0 "Actual war with CHI and either actual war with CBD or a verified continuing Cambodian intervention. Recompute when a real war or verified commitment ends. A sent withdrawal offer does not count. National effects apply to Vietnam as a whole."
 COLDWAR_VIE_burden_cambodia:0 "The Cambodian Commitment"
 COLDWAR_VIE_burden_cambodia_desc:0 "Actual occupied Cambodian non core states or a lawfully recorded continuing military support mission. Verified partner readiness reduces this to 2% supply consumption and 2% bureaucracy expenses. Verified drawdown ends it. A sent proposal or capital capture does neither. National effects apply to Vietnam as a whole."
 COLDWAR_VIE_burden_frontier:0 "A Prolonged Frontier"
 COLDWAR_VIE_burden_frontier_desc:0 "Real prolonged Chinese frontier war or an agreed continuing emergency state after the main assault. Actual peace/verified stand down; cannot be an arbitrary permanent penalty. National effects apply to Vietnam as a whole."
 COLDWAR_VIE_burden_internal:0 "An Unsettled Peace"
 COLDWAR_VIE_burden_internal_desc:0 "A relevant postwar grievance event in actually governed territory. Highland armed resistance is conditional. An earned funded domestic settlement or a reviewed security outcome, not an instant universal surrender. National effects apply to Vietnam as a whole."
 COLDWAR_VIE_burden_southwest_threat:0 "A Threatened Southwest"
 COLDWAR_VIE_burden_southwest_threat_desc:0 "Actual grave Cambodian border hostility and affected Vietnamese controlled southern provinces. This is not a starting hostility in the opening scenario. A genuine military settlement that defeats the threat, or a verified limited agreement for its actual term. A limited agreement gives no secured partner victory dividend. National effects apply to Vietnam as a whole."
 COLDWAR_VIE_campaign_burden_cambodia_light:0 "Cambodian Partner Responsibility"
 COLDWAR_VIE_campaign_burden_cambodia_light_desc:0 "Verified Cambodian military responsibility within a real continuing mission. Ends with that commitment or returns to its full stage if responsibility ceases. National effects apply to Vietnam as a whole."
 COLDWAR_VIE_campaign_event_139_title:0 "Campaign Invitation Unanswered"
 COLDWAR_VIE_campaign_event_139_desc:0 "A campaign invitation expired without a current accepted response. No contribution was charged. The recipient must close the old invitation before that same proposal can be reissued."
 COLDWAR_VIE_campaign_event_139_option_0:0 "We have been informed"
 COLDWAR_VIE_guerrilla_decision_south_liaison:0 "Southern political liaison"
 COLDWAR_VIE_guerrilla_decision_south_liaison_desc:0 "Actual communist governing subparty and valid southern political target. Use the existing native foreign party support campaign. Native support costs and cooldown; political support does not deliver weapons."
 COLDWAR_VIE_guerrilla_decision_renew_posture:0 "Renew a campaign posture"
 COLDWAR_VIE_guerrilla_decision_renew_posture_desc:0 "Earned current policy, actual war, exact funds and no conflicting posture. Renew the selected eligible operational idea once. Full displayed renewal cost; former timed ideas do not return free. The authorized contribution is $0.025 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_guerrilla_decision_ceasefire:0 "A ceasefire proposal"
 COLDWAR_VIE_guerrilla_decision_ceasefire_desc:0 "Actual opponent and current conflict; recipient may refuse. Open a recipient owned ceasefire discussion through normal diplomacy. Payment only for accepted agreed programme; sending does not end war. The authorized contribution is $0.005 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_guerrilla_decision_land_review:0 "Highland land commission"
 COLDWAR_VIE_guerrilla_decision_land_review_desc:0 "Actual control of the Central Highlands and a relevant grievance. Fund the local policy idea and a political settlement process. Civilian and administrative costs. No claim that every minority is an insurgent. The authorized contribution is $0.03 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_guerrilla_decision_security_review:0 "Security deployment review"
 COLDWAR_VIE_guerrilla_decision_security_review_desc:0 "Actual local unrest and earned security policy. Renew or end the chosen internal security policy. Economic strain persists while deployment continues. The authorized contribution is $0.03 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_guerrilla_decision_local_conference:0 "Local review conference"
 COLDWAR_VIE_guerrilla_decision_local_conference_desc:0 "A current local policy and actual affected territory. Replace the policy through an agreed domestic event and keep its earned history. No instant core state compliance reward or scripted universal surrender. The authorized contribution is $0.02 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_guerrilla_decision_reserve_review:0 "Reserve policy review"
 COLDWAR_VIE_guerrilla_decision_reserve_review_desc:0 "Peace or verified cessation; choose an earned funded reserve/civilian programme. Renew the selected postwar policy once. No free divisions or repeated focus XP. The authorized contribution is $0.025 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_guerrilla_decision_doctrine_review:0 "A doctrine review"
 COLDWAR_VIE_guerrilla_decision_doctrine_review_desc:0 "Native doctrine system and earned military institution. A single funded military exercise using existing doctrine/training systems. Not a technology grant or automatic switch to guerrilla doctrine. The authorized contribution is $0.01 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_commission:0 "Bilateral border commission"
 COLDWAR_VIE_cambodia_decision_commission_desc:0 "CBD exists; current proposal and both governments still eligible. Recipient accepts or refuses a defined border consultation. Acceptance alone neither transfers territory nor guarantees future peace. The authorized contribution is $0.01 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_limited_ceasefire:0 "A limited ceasefire"
 COLDWAR_VIE_cambodia_decision_limited_ceasefire_desc:0 "Actual VIE and CBD conflict and a current limited mandate. Offer a reciprocal ceasefire through normal diplomacy. War continues without an actual agreement. The authorized contribution is $0.005 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_mandate:0 "Review the mandate"
 COLDWAR_VIE_cambodia_decision_mandate_desc:0 "A current eligible campaign and appropriate government authority. Choose native war goals or a diplomatic limit allowed by the earned focus. No automatic declaration, capital capture or puppet installation. The authorized contribution is $0 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_renew_border:0 "Renew southwestern readiness"
 COLDWAR_VIE_cambodia_decision_renew_border_desc:0 "Current funds and the corresponding earned posture. Renew one Cambodia posture. One active Cambodia posture; national supply costs remain real. The authorized contribution is $0.025 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_train_partner:0 "Request a training mission"
 COLDWAR_VIE_cambodia_decision_train_partner_desc:0 "Friendly lawful CBD government and acceptance. Use the native paid military assistance programme. Native sender contribution and recurring cost; no free Cambodian formations."
 COLDWAR_VIE_cambodia_decision_native_rebuilding:0 "Native rebuilding investment"
 COLDWAR_VIE_cambodia_decision_native_rebuilding_desc:0 "Select a genuinely occupied non core state controlled by VIE. Use the existing MD state rebuilding investment: compliance growth and less resistance activity. Native cash price, 75 political power, state scope and project caps apply."
 COLDWAR_VIE_cambodia_decision_occupation_review:0 "Review the occupation"
 COLDWAR_VIE_cambodia_decision_occupation_review_desc:0 "Actual intervention commitment or controlled non core occupation. Reassess the current occupation policy idea and its costs. No occupation effects on ordinary Vietnamese cores. The authorized contribution is $0.02 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_withdrawal:0 "A withdrawal timetable"
 COLDWAR_VIE_cambodia_decision_withdrawal_desc:0 "Current commitment and a legitimate CBD recipient. Offer a reciprocal timetable and verification milestones. Sent proposals do not remove the commitment burden. The authorized contribution is $0.01 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_verify_drawdown:0 "Verify the drawdown"
 COLDWAR_VIE_cambodia_decision_verify_drawdown_desc:0 "Accepted current timetable and actual units/access checked at execution. Mark only verified fulfilled withdrawal obligations and reduce their burden. No army teleportation, forced disarmament or peace for third parties. The authorized contribution is $0.015 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_conference:0 "A regional conference"
 COLDWAR_VIE_cambodia_decision_conference_desc:0 "Appropriate Cambodian partners and distinct opposition representatives. Invite a political process that can be accepted or refused. Does not compel another player’s ideology, coalition or UN recognition. The authorized contribution is $0.01 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_china_decision_commission:0 "A frontier commission"
 COLDWAR_VIE_china_decision_commission_desc:0 "CHI exists and current eligible proposal. Recipient decides whether to open boundary talks. China remains a potential patron; no compulsory confrontation. The authorized contribution is $0.01 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_china_decision_civil_review:0 "Property and citizenship review"
 COLDWAR_VIE_china_decision_civil_review_desc:0 "A real local administrative dispute and affected controlled territory. Apply funded civil guarantees. No ethnic collective punishment or fabricated demographic transfer. The authorized contribution is $0.02 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_china_decision_renew_readiness:0 "Renew northern readiness"
 COLDWAR_VIE_china_decision_renew_readiness_desc:0 "Earned eligible posture and exact available funding. Renew one China posture for its defined term. The selected programme replaces its own policy family. Defensive fieldworks add no supply consumption penalty. Entrenchment applies across fronts, homeland defence on Vietnamese cores and terrain training in forests and jungle. Offensive alternatives retain their own costs. The authorized contribution is $0.025 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_china_decision_bounded_ceasefire:0 "A bounded ceasefire"
 COLDWAR_VIE_china_decision_bounded_ceasefire_desc:0 "Actual war with CHI and current bounded mandate. Present defined reciprocal terms. No focus enforced Chinese withdrawal or territorial concession. The authorized contribution is $0.005 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_china_decision_soviet_assistance:0 "Request Soviet assistance"
 COLDWAR_VIE_china_decision_soviet_assistance_desc:0 "SOV exists and accepts a current native programme. Use existing paid native military assistance. Native donor and recipient rules apply. No free weapons or discount on Soviet donor costs."
 COLDWAR_VIE_china_decision_priority:0 "Review the two front priority"
 COLDWAR_VIE_china_decision_priority_desc:0 "Actual Chinese war plus real Cambodian war or continuing intervention. Choose renewal priorities and military commitments. The two front burden remains until a real obligation ends. The authorized contribution is $0 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_china_decision_standdown:0 "Propose a frontier stand down"
 COLDWAR_VIE_china_decision_standdown_desc:0 "Current eligible CHI counterpart and real confrontation. A recipient owned offer starts verification if accepted. No automatic normalization, recognition or peace. The authorized contribution is $0.01 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_china_decision_verify:0 "Verify frontier measures"
 COLDWAR_VIE_china_decision_verify_desc:0 "Accepted current proposal and actual reciprocal measures. Reduce the exceptional confrontation burden only after execution checks. Stale acceptance cannot debit or reward a different proposal. The authorized contribution is $0.015 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_china_decision_reconstruction:0 "Native northern reconstruction"
 COLDWAR_VIE_china_decision_reconstruction_desc:0 "Owned and controlled northern states and available native capacity. Use native state investment and ordinary construction to repair and rebuild. Native cash and civilian construction requirements apply."
 COLDWAR_VIE_cambodia_decision_victory_review:0 "Verify southwestern victory"
 COLDWAR_VIE_cambodia_decision_victory_review_desc:0 "A real won campaign, lawful result and hostile threat actually removed. Record the one time military result and open the friendly partner continuation. Capital capture, occupied territory alone or a sent ultimatum is insufficient. The authorized contribution is $0 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_partner_readiness:0 "Partner readiness review"
 COLDWAR_VIE_cambodia_decision_partner_readiness_desc:0 "Earned training focus, an accepted funded native programme and the real agreed responsibility milestones. Perform and record the readiness check here; no prior readiness review flag is required. Reduce the continuing Vietnamese commitment burden to its lighter supported partner stage. Native assistance still costs money; the partner’s army is not created for free. The authorized contribution is $0.02 billion; opening a programme review is free and only an executed funded selection is charged."
 COLDWAR_VIE_cambodia_decision_limited_review:0 "Limited settlement review"
 COLDWAR_VIE_cambodia_decision_limited_review_desc:0 "A current limited agreement and actual reciprocal measures. Verify a limited stand down without entering occupation branches. No friendly regime dividend, military victory package or guarantee against renewed hostility. The authorized contribution is $0.01 billion; opening a programme review is free and only an executed funded selection is charged."
