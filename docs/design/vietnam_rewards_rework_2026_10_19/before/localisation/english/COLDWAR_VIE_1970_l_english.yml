 COLDWAR_VIE_campaign_cbd_land_drawdown_tt:0 "No Vietnamese divisions remain in the four Cambodian states and Vietnamese military access has ended"
 COLDWAR_VIE_campaign_china_standdown_tt:0 "Actual peace with China and reciprocal absence of national land divisions across the frontier"
 COLDWAR_VIE_campaign_domestic_grievance_tt:0 "Real postwar administrative strain: governed southern territory and national stability below 55 percent"
 COLDWAR_VIE_campaign_cbd_commitment_tt:0 "An actual Cambodian occupation or active funded military assistance commitment continues"
 COLDWAR_VIE_campaign_cbd_victory_tt:0 "A recorded real Cambodian campaign captured Phnom Penh and ended with a lawful friendly settlement or actual territorial victory"
 COLDWAR_VIE_campaign_secured_southwest_tt:0 "The won campaign, lawful Cambodian partnership and actually controlled southern homeland remain secure"
 COLDWAR_VIE_campaign_partner_ready_tt:0 "Active funded native assistance, real Cambodian divisions and Cambodian responsibility for the capital"
 COLDWAR_VIE_campaign_limited_settlement_tt:0 "Current accepted limited terms, actual peace and a verified Vietnamese land drawdown"
 COLDWAR_VIE_guerrilla_cadres_policy:0 "Political Liaison"
 COLDWAR_VIE_guerrilla_cadres_policy_desc:0 "Maintain contact with local institutions and southern allies. Communist revolutionary support is distinct from the general army programme. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_training_policy:0 "Small Unit Schools"
 COLDWAR_VIE_guerrilla_training_policy_desc:0 "Teach a regular army to operate in a dispersed war without treating militias as free equipment or manpower. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_local_policy:0 "Local Organization"
 COLDWAR_VIE_guerrilla_local_policy_desc:0 "Rely on local initiative and political contact while accepting that decentralized command complicates major offensives. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_staff_policy:0 "Regional Staffs"
 COLDWAR_VIE_guerrilla_staff_policy_desc:0 "Connect dispersed formations to a functioning staff and replacement system. The extra organization requires administrators. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_disperse_policy:0 "Dispersed Warfare"
 COLDWAR_VIE_guerrilla_disperse_policy_desc:0 "Make territorial defence and endurance the priority. This is useful during invasion, but gives up planning depth for a decisive offensive. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_concentrate_policy:0 "Main Force War"
 COLDWAR_VIE_guerrilla_concentrate_policy_desc:0 "Concentrate the regular army for a prepared campaign. Supply demand rises and formations become harder to sustain. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_endure_policy:0 "War of Endurance"
 COLDWAR_VIE_guerrilla_endure_policy_desc:0 "Improve the army’s ability to preserve a territorial defence. The policy is not a damage bonus for an imaginary underground army. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_offensive_policy:0 "Prepared Operations"
 COLDWAR_VIE_guerrilla_offensive_policy_desc:0 "Prepare the regular army for the current campaign, whether against South Vietnam or an invading force. Southern revolutionary support remains a separate optional action. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_guarantees_policy:0 "Local Guarantees"
 COLDWAR_VIE_guerrilla_guarantees_policy_desc:0 "Use land adjudication, representation and civilian guarantees to address political grievances. FULRO is a conditional highland problem, not a label for all minorities. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_security_policy:0 "Security Deployment"
 COLDWAR_VIE_guerrilla_security_policy_desc:0 "Make intensive internal security deployment the first response. It offers organization while prolonging administrative and civilian burdens. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_services_policy:0 "Civilian Settlement"
 COLDWAR_VIE_guerrilla_services_policy_desc:0 "Fund schools, local administration and a credible land settlement. Services take resources before they yield political benefits. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_screening_policy:0 "Extended Security"
 COLDWAR_VIE_guerrilla_screening_policy_desc:0 "Keep a forceful security programme under periodic review. More deployment does not remove the social causes of resistance. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_guerrilla_reserve_policy:0 "Armed Reserve"
 COLDWAR_VIE_guerrilla_reserve_policy_desc:0 "Retain a trained reserve for renewed danger. Civilian recovery continues to lose labour to defence. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 365 days and must be renewed."
 COLDWAR_VIE_guerrilla_civilian_policy:0 "Civilian Return"
 COLDWAR_VIE_guerrilla_civilian_policy_desc:0 "Reduce the exceptional military commitment and direct labour towards production. Readiness grows more slowly. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 365 days and must be renewed."
 COLDWAR_VIE_guerrilla_rotation_policy:0 "Rotating Reserve"
 COLDWAR_VIE_guerrilla_rotation_policy_desc:0 "Make retained readiness more sustainable through rotation. The reserve still carries an economic cost. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 365 days and must be renewed."
 COLDWAR_VIE_guerrilla_veterans_policy:0 "Veteran Reintegration"
 COLDWAR_VIE_guerrilla_veterans_policy_desc:0 "Support demobilized veterans and affected households. Productive recovery requires sustained public spending. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 365 days and must be renewed."
 COLDWAR_VIE_cambodia_frontier_policy:0 "Southwestern Defence"
 COLDWAR_VIE_cambodia_frontier_policy_desc:0 "Prepare a defined defensive plan for the southwestern frontier. Military preparation draws resources from reconstruction. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_civilians_policy:0 "Border Relief"
 COLDWAR_VIE_cambodia_civilians_policy_desc:0 "Organize relief and temporary administration for threatened communities. Protection requires public spending. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_staff_policy:0 "Southwestern Command"
 COLDWAR_VIE_cambodia_staff_policy_desc:0 "Unify the existing border staff and maintain a limited commitment. This is not an automatic invasion order. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_channel_policy:0 "Mekong Logistics"
 COLDWAR_VIE_cambodia_channel_policy_desc:0 "Prepare the transport and administrative base for a real southwestern campaign. Keep relief and military logistics functioning without waiting for the opponent to agree to talks. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_limited_policy:0 "Limited Border War"
 COLDWAR_VIE_cambodia_limited_policy_desc:0 "Limit the military objective to protection of the frontier. It preserves resources but may leave a hostile regime in place. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_intervene_policy:0 "Intervention Plan"
 COLDWAR_VIE_cambodia_intervene_policy_desc:0 "Authorize a regime change war aim against a hostile Cambodian government. The war aim is not a completed victory or puppet state. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 240 days and must be renewed."
 COLDWAR_VIE_cambodia_monitor_policy:0 "Border Monitoring"
 COLDWAR_VIE_cambodia_monitor_policy_desc:0 "Seek a verified frontier arrangement and a lower military commitment. Refusal leaves the conflict unresolved. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_capital_policy:0 "Cambodian Offensive"
 COLDWAR_VIE_cambodia_capital_policy_desc:0 "Prepare an operation towards the enemy capital. Taking it must be achieved through normal combat and begins a new political problem. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 240 days and must be renewed."
 COLDWAR_VIE_cambodia_partner_policy:0 "A Secured Southwest"
 COLDWAR_VIE_cambodia_partner_policy_desc:0 "Build a durable strategic buffer after a real victory. A friendly Cambodian security partner lets Vietnam recover the southwest while retaining a credible regional position. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This earned strategic dividend remains active only while its actual security conditions hold."
 COLDWAR_VIE_cambodia_direct_policy:0 "Direct Occupation"
 COLDWAR_VIE_cambodia_direct_policy_desc:0 "Take a heavier direct security role in occupied territory. Immediate control increases the long term burden on Vietnam. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_train_policy:0 "Training Mission"
 COLDWAR_VIE_cambodia_train_policy_desc:0 "Fund Cambodian military responsibility through native assistance. A trained partner reduces the verified Vietnamese commitment and makes victory sustainable rather than an endless occupation. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_dry_policy:0 "Extended Occupation"
 COLDWAR_VIE_cambodia_dry_policy_desc:0 "Conduct a defined campaign against armed opposition where the real war or occupation system can represent it. Military pressure is not automatic reconciliation. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_stay_policy:0 "Retained Commitment"
 COLDWAR_VIE_cambodia_stay_policy_desc:0 "Retain a larger commitment while pursuing greater security. The northern frontier and civilian recovery compete for the same resources. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_leave_policy:0 "Withdrawal Preparation"
 COLDWAR_VIE_cambodia_leave_policy_desc:0 "Negotiate a reduction of the Vietnamese commitment and arrangements for the partner government. Withdrawal does not mean Cambodian civil war has ended. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_restore_policy:0 "Civil Reconstruction"
 COLDWAR_VIE_cambodia_restore_policy_desc:0 "Use the actual MD state investment system for occupied non core recovery. Its cash contribution, political cost and project limits remain real. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_verify_policy:0 "Verified Drawdown"
 COLDWAR_VIE_cambodia_verify_policy_desc:0 "Check actual troops, military access and the agreed commitments before declaring withdrawal complete. A focus never teleports armies. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_survey_policy:0 "Frontier Readiness"
 COLDWAR_VIE_china_survey_policy_desc:0 "Survey defensive positions and prepare local fieldworks. Better knowledge of the ground helps existing formations entrench; it does not construct free forts. Entrenchment applies across fronts. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_citizens_policy:0 "Civil Guarantees"
 COLDWAR_VIE_china_citizens_policy_desc:0 "Keep citizenship and property treatment distinct from security disputes with Beijing. Civilians do not become a collective enemy. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_liaison_policy:0 "Northern Command"
 COLDWAR_VIE_china_liaison_policy_desc:0 "Coordinate local reserves, field engineers and defensive positions. Prepare to defend Vietnamese core territory rather than sustaining a costly offensive mobilisation. Entrenchment applies across fronts. Homeland defence applies on Vietnamese core territory. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_hold_terrain_training:0 "Prepared Woodland Positions"
 COLDWAR_VIE_china_hold_terrain_training_desc:0 "Temporary army defence training in forest and jungle, owned by the corresponding active national policy."
 COLDWAR_VIE_china_hold_terrain_tt:0 "Army defence in forest and jungle: §G+5%§! while this policy is active."
 COLDWAR_VIE_china_hold_policy:0 "Northern Defence"
 COLDWAR_VIE_china_hold_policy_desc:0 "Hold prepared positions, disperse infantry under forest cover and use familiar jungle approaches. Stronger entrenchment and homeland defence come at the expense of offensive planning. Entrenchment applies across fronts. Homeland defence applies on Vietnamese core territory. Terrain defence applies to army units in forest and jungle against any opponent while this policy is active. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_counter_policy:0 "Limited Counterstroke"
 COLDWAR_VIE_china_counter_policy_desc:0 "Prepare a defined counteroffensive to relieve pressure or recover positions. It carries greater supply and production costs. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_depth_terrain_training:0 "Defensive Terrain Network"
 COLDWAR_VIE_china_depth_terrain_training_desc:0 "Temporary army defence training in forest and jungle, owned by the corresponding active national policy."
 COLDWAR_VIE_china_depth_terrain_tt:0 "Army defence in forest and jungle: §G+10%§! while this policy is active."
 COLDWAR_VIE_china_depth_policy:0 "Defence in Depth"
 COLDWAR_VIE_china_depth_policy_desc:0 "Organise successive defensive positions, concealed reserves and fallback lines through wooded and jungle terrain. This deepens the defence of the homeland while reducing the emphasis on offensive planning. Entrenchment applies across fronts. Homeland defence applies on Vietnamese core territory. Terrain defence applies to army units in forest and jungle against any opponent while this policy is active. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_objectives_policy:0 "Bounded Counterstroke"
 COLDWAR_VIE_china_objectives_policy_desc:0 "Keep the counterstroke tied to a defined purpose rather than a permanent march into China. Battlefield success is never scripted. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_soviet_policy:0 "Foreign Military Liaison"
 COLDWAR_VIE_china_soviet_policy_desc:0 "Prepare the domestic liaison and training organization needed to seek Soviet support. The request uses existing diplomacy; it does not presume that Moscow accepts. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_self_policy:0 "Independent Preparation"
 COLDWAR_VIE_china_self_policy_desc:0 "Rely more heavily on domestic resources and retain freedom of manoeuvre. Training and military output become more expensive to sustain. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_rotation_policy:0 "Frontier Rotation"
 COLDWAR_VIE_china_rotation_policy_desc:0 "Keep formations trained for a prolonged frontier war. Rotation preserves readiness while competing with civilian recovery. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_mobilise_policy:0 "Prolonged Mobilisation"
 COLDWAR_VIE_china_mobilise_policy_desc:0 "Accept a longer exceptional commitment to preserve frontier readiness. Economic recovery is delayed. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_opening_policy:0 "Opening Talks"
 COLDWAR_VIE_china_opening_policy_desc:0 "Propose a verifiable reduction of confrontation. Talks do not impose peace or claim that formal normalization has already occurred. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_hills_policy:0 "Long Frontier Mobilisation"
 COLDWAR_VIE_china_hills_policy_desc:0 "Prepare the army for persistent fighting and recurring strain. A larger military commitment still has to be paid for. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_standdown_policy:0 "Verified Stand down"
 COLDWAR_VIE_china_standdown_policy_desc:0 "Confirm accepted measures and real withdrawal before reducing the exceptional burden. No focus moves Chinese troops automatically. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_china_rebuild_policy:0 "Northern Reconstruction"
 COLDWAR_VIE_china_rebuild_policy_desc:0 "Repair real damaged buildings and restore civilian life. Reconstruction requires funding and normal native construction capacity. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
 COLDWAR_VIE_cambodia_border_settlement_policy:0 "Limited Border Arrangement"
 COLDWAR_VIE_cambodia_border_settlement_policy_desc:0 "Verify a limited border settlement without replacing the Cambodian government or inventing an occupation. National modifiers apply to Vietnam as a whole. Opponent modifiers apply against that named country on every front. This funded policy expires after 180 days and must be renewed."
