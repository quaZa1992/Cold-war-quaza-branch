 COLDWAR_VIE_campaign_native_assistance_tt:0 "The existing Cold War overview opens. To send a funded mission, open the recipient country diplomacy and choose Assistance, then Military Training or Arms Production. The donor pays native costs and the recipient must accept. This does not create a mission automatically."
 COLDWAR_VIE_campaign_native_support_tt:0 "The existing Cold War overview opens with communist party index 4 selected. Open South Vietnam diplomacy and choose Public Political Support. Native capacity, 50 political power, cooldown and target access rules apply. This changes party support, not weapons or units."
 COLDWAR_VIE_campaign_native_rebuilding_tt:0 "Select the named state on the map and open its native state investments. Improve Rebuilding Efforts costs the native cash contribution and 75 political power, lasts 180 days and respects project caps. In owned core territory use ordinary reconstruction and construction projects; occupation compliance has no effect on normal Vietnamese cores."
