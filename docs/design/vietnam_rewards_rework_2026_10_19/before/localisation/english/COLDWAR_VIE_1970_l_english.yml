 COLDWAR_VIE_state_root:0 "After Ho Chi Minh"
 COLDWAR_VIE_state_root_desc:0 "Ho Chi Minh's death has left the revolution with a shared legacy and several centres of authority. Le Duan, President Ton Duc Thang and Prime Minister Pham Van Dong must hold the institutions together through another difficult year."
 COLDWAR_VIE_state_root_reward_applied:0 "Has implemented $COLDWAR_VIE_state_root$"
 COLDWAR_VIE_state_root_pending:0 "Implementation of $COLDWAR_VIE_state_root$ is pending"
 COLDWAR_VIE_state_emerging:0 "Defend the Revolution"
 COLDWAR_VIE_state_emerging_desc:0 "The revolution survives through confidence in its purpose as well as organisation. Renew the argument for socialist construction and the struggle for national reunification."
 COLDWAR_VIE_state_emerging_reward_applied:0 "Has implemented $COLDWAR_VIE_state_emerging$"
 COLDWAR_VIE_state_emerging_pending:0 "Implementation of $COLDWAR_VIE_state_emerging$ is pending"
 COLDWAR_VIE_state_western:0 "Constitutional Debate"
 COLDWAR_VIE_state_western_desc:0 "A constitution can be discussed even where an independent opposition cannot yet govern. Open a debate about public authority, legal protection and the terms of a future political settlement."
 COLDWAR_VIE_state_western_reward_applied:0 "Has implemented $COLDWAR_VIE_state_western$"
 COLDWAR_VIE_state_western_pending:0 "Implementation of $COLDWAR_VIE_state_western$ is pending"
 COLDWAR_VIE_state_neutral:0 "Broaden the Front"
 COLDWAR_VIE_state_neutral_desc:0 "The Fatherland Front brings together organisations whose interests extend beyond the Party apparatus. Give those constituencies a greater voice in national affairs."
 COLDWAR_VIE_state_neutral_reward_applied:0 "Has implemented $COLDWAR_VIE_state_neutral$"
 COLDWAR_VIE_state_neutral_pending:0 "Implementation of $COLDWAR_VIE_state_neutral$ is pending"
 COLDWAR_VIE_state_national:0 "National Sovereignty"
 COLDWAR_VIE_state_national_desc:0 "Independence remains the strongest common language of Vietnamese politics. Appeal to those who place sovereignty and the republic above competing ideological camps."
 COLDWAR_VIE_state_national_reward_applied:0 "Has implemented $COLDWAR_VIE_state_national$"
 COLDWAR_VIE_state_national_pending:0 "Implementation of $COLDWAR_VIE_state_national$ is pending"
 COLDWAR_VIE_state_cadres:0 "Professional Cadres"
 COLDWAR_VIE_state_cadres_desc:0 "Administrative competence cannot be supplied by revolutionary credentials alone. Train cadres to investigate conditions, keep reliable accounts and deliver public services."
 COLDWAR_VIE_state_cadres_reward_applied:0 "Has implemented $COLDWAR_VIE_state_cadres$"
 COLDWAR_VIE_state_cadres_pending:0 "Implementation of $COLDWAR_VIE_state_cadres$ is pending"
 COLDWAR_VIE_state_mass:0 "Mass Organisation"
 COLDWAR_VIE_state_mass_desc:0 "Mass organisations connect the state to villages, factories and neighbourhoods. Deepen that network while accepting the work required to maintain it."
 COLDWAR_VIE_state_mass_reward_applied:0 "Has implemented $COLDWAR_VIE_state_mass$"
 COLDWAR_VIE_state_mass_pending:0 "Implementation of $COLDWAR_VIE_state_mass$ is pending"
 COLDWAR_VIE_state_school:0 "Rural Schools"
 COLDWAR_VIE_state_school_desc:0 "War has displaced teachers and disrupted schooling without extinguishing the ambition to learn. Extend education beyond the better served towns and protect the next generation of technicians."
 COLDWAR_VIE_state_school_reward_applied:0 "Has implemented $COLDWAR_VIE_state_school$"
 COLDWAR_VIE_state_school_pending:0 "Implementation of $COLDWAR_VIE_state_school$ is pending"
 COLDWAR_VIE_state_women:0 "Women in Public Life"
 COLDWAR_VIE_state_women_desc:0 "Women sustain production, public administration and family life under exceptional pressure. Wider participation must be accompanied by practical support rather than another unpaid obligation."
 COLDWAR_VIE_state_women_reward_applied:0 "Has implemented $COLDWAR_VIE_state_women$"
 COLDWAR_VIE_state_women_pending:0 "Implementation of $COLDWAR_VIE_state_women$ is pending"
 COLDWAR_VIE_state_assembly:0 "National Assembly"
 COLDWAR_VIE_state_assembly_desc:0 "The National Assembly can become a more useful channel between policy and the people who live with it. Strengthening its work requires an administration capable of responding."
 COLDWAR_VIE_state_assembly_reward_applied:0 "Has implemented $COLDWAR_VIE_state_assembly$"
 COLDWAR_VIE_state_assembly_pending:0 "Implementation of $COLDWAR_VIE_state_assembly$ is pending"
 COLDWAR_VIE_state_discipline:0 "Cadre Discipline"
 COLDWAR_VIE_state_discipline_desc:0 "The cadre service must answer to a common chain of authority. Tighter discipline can improve execution, but it can also discourage honest disagreement."
 COLDWAR_VIE_state_discipline_reward_applied:0 "Has implemented $COLDWAR_VIE_state_discipline$"
 COLDWAR_VIE_state_discipline_pending:0 "Implementation of $COLDWAR_VIE_state_discipline$ is pending"
 COLDWAR_VIE_state_criticism:0 "Public Criticism"
 COLDWAR_VIE_state_criticism_desc:0 "Policy failures do not disappear when nobody dares to describe them. Protect criticism that exposes abuse while accepting a more contested political environment."
 COLDWAR_VIE_state_criticism_reward_applied:0 "Has implemented $COLDWAR_VIE_state_criticism$"
 COLDWAR_VIE_state_criticism_pending:0 "Implementation of $COLDWAR_VIE_state_criticism$ is pending"
 COLDWAR_VIE_state_provincial:0 "Provincial Councils"
 COLDWAR_VIE_state_provincial_desc:0 "Provincial authorities know local shortages and productive possibilities better than distant offices. Give their councils a clearer place in the national programme."
 COLDWAR_VIE_state_provincial_reward_applied:0 "Has implemented $COLDWAR_VIE_state_provincial$"
 COLDWAR_VIE_state_provincial_pending:0 "Implementation of $COLDWAR_VIE_state_provincial$ is pending"
 COLDWAR_VIE_state_religion:0 "Freedom of Worship"
 COLDWAR_VIE_state_religion_desc:0 "Buddhist and Catholic communities are part of the nation, not a single political bloc. Negotiate practical protections for religious life and equal treatment before public authorities."
 COLDWAR_VIE_state_religion_reward_applied:0 "Has implemented $COLDWAR_VIE_state_religion$"
 COLDWAR_VIE_state_religion_pending:0 "Implementation of $COLDWAR_VIE_state_religion$ is pending"
 COLDWAR_VIE_state_charter:0 "A Durable Charter"
 COLDWAR_VIE_state_charter_desc:0 "A durable charter must outlast the ambitions of its authors. Establish institutions that can carry public responsibilities through changes of leadership and government."
 COLDWAR_VIE_state_charter_reward_applied:0 "Has implemented $COLDWAR_VIE_state_charter$"
 COLDWAR_VIE_state_charter_pending:0 "Implementation of $COLDWAR_VIE_state_charter$ is pending"
 COLDWAR_VIE_duan_root:0 "Southern Priority"
 COLDWAR_VIE_duan_root_desc:0 "Le Duan places the struggle in the South at the centre of national strategy. The North must sustain that effort while living with the demands it makes on reconstruction."
 COLDWAR_VIE_duan_root_reward_applied:0 "Has implemented $COLDWAR_VIE_duan_root$"
 COLDWAR_VIE_duan_root_pending:0 "Implementation of $COLDWAR_VIE_duan_root$ is pending"
 COLDWAR_VIE_duan_offensive:0 "General Offensive"
 COLDWAR_VIE_duan_offensive_desc:0 "A concentrated offensive promises to change the balance of the war. It also requires a heavier logistical effort and a willingness to expose the main force to risk."
 COLDWAR_VIE_duan_offensive_reward_applied:0 "Has implemented $COLDWAR_VIE_duan_offensive$"
 COLDWAR_VIE_duan_offensive_pending:0 "Implementation of $COLDWAR_VIE_duan_offensive$ is pending"
 COLDWAR_VIE_duan_patient:0 "Protracted Pressure"
 COLDWAR_VIE_duan_patient_desc:0 "Protracted pressure preserves the capacity to continue when a quick decision is impossible. Its discipline comes at the cost of postponing the victory many have been promised."
 COLDWAR_VIE_duan_patient_reward_applied:0 "Has implemented $COLDWAR_VIE_duan_patient$"
 COLDWAR_VIE_duan_patient_pending:0 "Implementation of $COLDWAR_VIE_duan_patient$ is pending"
 COLDWAR_VIE_duan_shock:0 "The Main Force"
 COLDWAR_VIE_duan_shock_desc:0 "Bring the principal formations and their supporting production into a more concentrated effort. Farms and civilian workshops will feel the diversion of scarce resources."
 COLDWAR_VIE_duan_shock_reward_applied:0 "Has implemented $COLDWAR_VIE_duan_shock$"
 COLDWAR_VIE_duan_shock_pending:0 "Implementation of $COLDWAR_VIE_duan_shock$ is pending"
 COLDWAR_VIE_duan_talk:0 "Fight and Negotiate"
 COLDWAR_VIE_duan_talk_desc:0 "Military pressure and negotiation can serve the same strategy. Prepare a diplomatic channel without assuming that the opposing governments will accept our terms."
 COLDWAR_VIE_duan_talk_reward_applied:0 "Has implemented $COLDWAR_VIE_duan_talk$"
 COLDWAR_VIE_duan_talk_pending:0 "Implementation of $COLDWAR_VIE_duan_talk$ is pending"
 COLDWAR_VIE_duan_congress:0 "The Party Congress"
 COLDWAR_VIE_duan_congress_desc:0 "Peace permits a congress to turn from the endurance of war to the shape of the national economy. The ambitions adopted here must still confront limited resources and administrative capacity."
 COLDWAR_VIE_duan_congress_reward_applied:0 "Has implemented $COLDWAR_VIE_duan_congress$"
 COLDWAR_VIE_duan_congress_pending:0 "Implementation of $COLDWAR_VIE_duan_congress$ is pending"
 COLDWAR_VIE_duan_heavy:0 "Heavy Industry First"
 COLDWAR_VIE_duan_heavy_desc:0 "Heavy industry promises greater national strength and a more independent military supply base. Giving it priority leaves fewer resources for the food economy."
 COLDWAR_VIE_duan_heavy_reward_applied:0 "Has implemented $COLDWAR_VIE_duan_heavy$"
 COLDWAR_VIE_duan_heavy_pending:0 "Implementation of $COLDWAR_VIE_duan_heavy$ is pending"
 COLDWAR_VIE_duan_balanced:0 "Balanced Recovery"
 COLDWAR_VIE_duan_balanced_desc:0 "Recovery must feed the population as well as expand industry. Adopt a more balanced allocation even if it slows the growth of military production."
 COLDWAR_VIE_duan_balanced_reward_applied:0 "Has implemented $COLDWAR_VIE_duan_balanced$"
 COLDWAR_VIE_duan_balanced_pending:0 "Implementation of $COLDWAR_VIE_duan_balanced$ is pending"
 COLDWAR_VIE_treasury_0_12_tt:0 "Treasury is at least §Y0.12 billion§! (current: §Y[?treasury|3] billion§!)"
