 COLDWAR_VIE_decision_dialogue:0 "Convene a Political Dialogue"
 COLDWAR_VIE_decision_dialogue_desc:0 "A consultative meeting only. Changing party/outlook continues through existing MD/Imperia political mechanics. The programme lasts 180 days. Its planning or operating contribution is $0.015 billion. One active programme per family (economy, civic, security, foreign); native timed ideas do not stack. Four concurrent families maximum."
 COLDWAR_VIE_decision_front_conference:0 "Hold a Fatherland Front Conference"
 COLDWAR_VIE_decision_front_conference_desc:0 "Consult the Front; this does not relabel a historical umbrella as a free parliamentary opposition. The programme lasts 180 days. Its planning or operating contribution is $0.015 billion. One active programme per family (economy, civic, security, foreign); native timed ideas do not stack. Four concurrent families maximum."
 COLDWAR_VIE_decision_constitution:0 "Convene a Constitutional Convention"
