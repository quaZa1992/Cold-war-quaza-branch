 COLDWAR_VIE_guerrilla_lessons:0 "The Long War"
 COLDWAR_VIE_guerrilla_lessons_desc:0 "The long war has bound local political cadres, village networks and regular formations into a single struggle. Preserve that experience as the army prepares for the campaigns still ahead."
