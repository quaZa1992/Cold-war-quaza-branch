[["GEN_1970_naval_doctrine_expertise"]], "prerequisites": ["GEN_1970_naval_doctrine_expertise"], "cost": "10", "effects": []}, {"id": "GEN_1970_improved_repair_facilities", "name": "Improved Repair Facilities", "x": 146, "y": 17, "own": false, "prerequisite_groups": [["GEN_1970_large_ship_drydocks"]], "prerequisites": ["GEN_1970_large_ship_drydocks"], "cost": "10", "effects": []}, {"id": "COLDWAR_AP_political_focus", "name": "Revise the Racial Settlement", "x": 8, "y": 23, "own": true, "prerequisite_groups": [], "prerequisites": [], "cost": "5", "effects": [{"modifier": "stability_factor", "base": "-0.30", "change": "0.075"}, {"modifier": "bureaucracy_cost_multiplier_modifier", "base": "0.25", "change": "-0.0625"}, {"modifier": "police_cost_multiplier_modifier", "base": "1", "change": "-0.25"}, {"modifier": "expected_police_modifier", "base": "3", "change": "-0.75"}, {"modifier": "Worldwide trade opinion", "base": "-20", "change": "5.0"}, {"modifier": "Sub-Saharan trade opinion", "base": "-50", "change": "12.5"}, {"modifier": "Sub-Saharan diplomatic opinion", "base": "-50", "change": "12.5"}], "description": "The franchise, racial classification and restrictions on residence sustain minority rule. A negotiated revision can reduce the burden of policing and separate administration, but it also gives up institutions on which the governing settlement depends."}, {"id": "COLDWAR_AP_services_focus", "name": "Broaden Access to Public Services", "x": 2, "y": 25, "own": true, "prerequisite_groups": [["COLDWAR_AP_political_focus"]], "prerequisites": ["COLDWAR_AP_political_focus"], "cost": "5", "effects": [{"modifier": "social_cost_multiplier_modifier", "base": "-0.50", "change": "0.125"}, {"modifier": "health_cost_multiplier_modifier", "base": "-0.75", "change": "0.1875"}, {"modifier": "education_cost_multiplier_modifier", "base": "-0.75", "change": "0.1875"}, {"modifier": "expected_welfare_modifier", "base": "3", "change": "-0.75"}, {"modifier": "expected_healthcare_modifier", "base": "3", "change": "-0.75"}, {"modifier": "expected_education_modifier", "base": "3", "change": "-0.75"}], "description": "Public hospitals, schools and welfare provision are divided by race and funded unequally. Extending equal access raises the cost of provision while reducing the exceptional spending expectations associated with a privileged minority."}, {"id": "COLDWAR_AP_labour_focus", "name": "Negotiate Labour and Land Reform", "x": 6, "y": 25, "own": true, "prerequisite_groups": [["COLDWAR_AP_political_focus"]], "prerequisites": ["COLDWAR_AP_political_focus"], "cost": "5", "effects": [{"modifier": "receiving_investment_cost_modifier", "base": "-0.20", "change": "0.05"}, {"modifier": "production_speed_buildings_factor", "base": "0.10", "change": "-0.025"}, {"modifier": "offices_worker_requirement_modifier", "base": "0.10", "change": "-0.025"}, {"modifier": "COLDWAR_AP_commercial_agriculture_productivity", "base": "0.25", "change": "-0.0625"}], "description": "Restricted bargaining rights and access to land favour established employers and commercial farms. Opening employment and land institutions reduces these advantages, while easing the staffing difficulties created by occupational exclusion."}, {"id": "COLDWAR_AP_military_focus", "name": "Revise Military Service and Pay", "x": 10, "y": 25, "own": true, "prerequisite_groups": [["COLDWAR_AP_political_focus"]], "prerequisites": ["COLDWAR_AP_political_focus"], "cost": "5", "effects": [{"modifier": "personnel_cost_multiplier_modifier", "base": "0.50", "change": "-0.125"}, {"modifier": "expected_mil_modifier", "base": "3", "change": "-0.75"}], "description": "A narrow pool of eligible skilled recruits and the political importance of the armed services sustain privileged personnel arrangements. Wider recruitment and a common pay structure can reduce their cost and the exceptional defence-spending demands of minority rule."}, {"id": "COLDWAR_AP_population_focus", "name": "Reconsider Settlement and Family Policy", "x": 14, "y": 25, "own": true, "prerequisite_groups": [["COLDWAR_AP_political_focus"]], "prerequisites": ["COLDWAR_AP_political_focus"], "cost": "5", "effects": [{"modifier": "migration_rate_value_factor", "base": "0.25", "change": "-0.0625"}, {"modifier": "monthly_population", "base": "0.50", "change": "-0.125"}], "description": "Selective settlement incentives coexist with contract migration and rapid natural growth in a youthful population. Voluntary family-planning provision and revised migration incentives can gradually change these pressures. Such trends arise from social conditions and population structure, rather than racial characteristics."}];const svg=document.getElementById('tree'),map=document.getElementById('map');const ns='http://www.w3.org/2000/svg';let scale=.16;const width=(Math.max(...rows.map(r=>r.x))+3)*88,height=(Math.max(...rows.map(r=>r.y))+2)*100;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);function el(name,attrs){const n=document.createElementNS(ns,name);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);svg.append(n);return n}for(const r of rows){for(const id of r.prerequisites){const p=rows.find(n=>n.id===id);if(p)el('path',{d:`M${(p.x+1)*88} ${(p.y+1)*100+23} V${(r.y+1)*100-42} H${(r.x+1)*88} V${(r.y+1)*100-23}`,stroke:r.own?'#c5b47f':'#34434b',fill:'none','stroke-width':2})}}for(const r of rows){const x=(r.x+1)*88,y=(r.y+1)*100;const box=el('rect',{x:x-75,y:y-23,width:150,height:46,rx:5,fill:r.own?'#695a32':'#28343c',stroke:r.own?'#e0c783':'#50616a'});const t=el('text',{x,y:y+4,'text-anchor':'middle',fill:r.own?'#fff0b9':'#aab8bf','font-size':11});t.textContent=r.name.length>25?r.name.slice(0,24)+'…':r.name;box.onclick=()=>{if(!r.own)return;const panel=document.getElementById('details');panel.replaceChildren();const h=document.createElement('h2');h.textContent=r.name;panel.append(h);const p=document.createElement('p');p.textContent=r.description;panel.append(p);const info=document.createElement('p');info.textContent='35 days. Applies the first quarter-step reform and unlocks further revision and restoration decisions.';panel.append(info);const table=document.createElement('table');const head=table.insertRow();for(const v of ['Modifier','Base','Change']){const c=document.createElement('th');c.textContent=v;head.append(c)}for(const fx of r.effects){const tr=table.insertRow();for(const v of [fx.modifier,fx.base,fx.change])tr.insertCell().textContent=v}panel.append(table)}}function zoom(s){scale=s;svg.style.width=width*s+'px';svg.style.height=height*s+'px'}document.getElementById('overview').onclick=()=>{zoom(.055);map.scrollTo(0,0)};document.getElementById('normal').onclick=()=>zoom(1);document.getElementById('branch').onclick=()=>{zoom(1);const r=rows.find(r=>r.own);map.scrollTo(Math.max(0,(r.x-7)*88),(r.y-.6)*100)};zoom(.16);</script></html>
