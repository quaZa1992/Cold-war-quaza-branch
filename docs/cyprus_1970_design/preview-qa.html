  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;coldwar-cyprus-design&#x27;);
    const data = {&quot;meta&quot;: {&quot;title&quot;: &quot;Cold War Cyprus — January 1970 Focus Tree Design&quot;, &quot;prefix&quot;: &quot;COLDWAR_CYP_1970_&quot;, &quot;stage&quot;: &quot;DESIGN ONLY — no runtime files changed&quot;, &quot;language&quot;: &quot;English&quot;, &quot;counts&quot;: {&quot;focuses&quot;: 330, &quot;party_routes&quot;: 24, &quot;mutually_exclusive_pairs&quot;: 68}, &quot;source_md&quot;: &quot;User-supplied installed MD snapshot; no claim of online version currency.&quot;, &quot;starting_variables&quot;: {&quot;COLDWAR_CYP_1970_communal_tension&quot;: 55, &quot;COLDWAR_CYP_1970_settlement_progress&quot;: 10, &quot;COLDWAR_CYP_1970_party_reform_credit&quot;: 0}, &quot;variable_note&quot;: &quot;NEW bounded scenario variables, not existing MD features. Values are tuning proposals, not historical statistics.&quot;, &quot;focus_timing&quot;: &quot;cost is days/10; 35/50/60 days. MD generic reference often uses cost8.6. Cyprus pacing remains to be playtested.&quot;, &quot;progression&quot;: &quot;Shared sector roots are parallel from start; party routes require the specific governing subparty, formation and date conditions. Completed one-time focuses never reset on elections.&quot;, &quot;layout&quot;: &quot;Four shared sector anchors at x6/26/46/66; conditional recovery below economy; 24 party islands in four columns and six banks at x86/100/114/128 and y0/11/22/33/44/55. Descendants use local offsets and relative_position_id to the section root.&quot;, &quot;caps&quot;: &quot;One active government programme; exclusive policies cannot stack. Target permanent research &lt;=8%, organisation &lt;=12%, construction &lt;=15% from authored Cyprus rewards along any legitimate path; enforcement and path enumeration required before implementation. No new research slots, military factories or office sectors as free rewards.&quot;, &quot;economy&quot;: &quot;Costs use GDP-scaled modify_treasury_effect. Costs below are project grants/administration, not an assertion that 3%GDP purchases a factory. Construction queues and upkeep remain payable. Require funds on start AND completion; apply atomic debit/reward, or cancel with no reward. No double charging internal helpers.&quot;, &quot;history&quot;: &quot;States145+146 are CYP in1970; state812 is ENG. The two-province MD map cannot represent the distribution of pre-1974 enclaves. Do not use resistance/compliance as a fake communal mechanic in core territory.&quot;, &quot;party_lifecycle&quot;: &quot;available must check exact ruling_party, never just outlook. allow_branch should use persistent reveal flags so taking office once does not hide completed progress later. current-party enable on political dynamic modifiers suspends old programmes. Shared funded infrastructure and historical consequences persist. Do not reload/reset the tree on elections. Party reform progress uses one highest-milestone ledger capped10 globally, not additive rewards from all24 governments.&quot;, &quot;crisis&quot;: &quot;Historical mode favours the conditional1970-74 chain; successful talks/reform can avert it. EOKAB from1971, Grivas death1974, DIKO/DISY from1976, Makarios death1977 and CMP1981 need dated or explicitly alternate outcomes. Full chronology/portraits need implementation verification.&quot;, &quot;cumulative_status&quot;: &quot;Numeric design audited statically against local keys. No engine run or multiplayer balance claim.&quot;}, &quot;sections&quot;: [{&quot;id&quot;: &quot;constitution&quot;, &quot;title&quot;: &quot;The Republic and the Cyprus Question&quot;, &quot;anchor&quot;: [6, 0], &quot;description&quot;: &quot;Negotiation, security and constitutional outcomes. Both communities have political agency; foreign players can accept or reject proposals.&quot;}, {&quot;id&quot;: &quot;economy&quot;, &quot;title&quot;: &quot;An Island Economy&quot;, &quot;anchor&quot;: [26, 0], &quot;description&quot;: &quot;Choose the structure of development: tourism or productive diversification; credit openness or domestic control. No giant free industrial base.&quot;}, {&quot;id&quot;: &quot;military&quot;, &quot;title&quot;: &quot;Defending a Small Republic&quot;, &quot;anchor&quot;: [46, 0], &quot;description&quot;: &quot;A credible defensive force, external supply choices and civilian authority. Cyprus cannot win a symmetrical arms race with Turkey.&quot;}, {&quot;id&quot;: &quot;diplomacy&quot;, &quot;title&quot;: &quot;Between the Guarantors and the Blocs&quot;, &quot;anchor&quot;: [66, 0], &quot;description&quot;: &quot;Non-alignment, patron dependence and the Sovereign Base Areas. Offers are bilateral; another player&#x27;s acceptance is never assumed.&quot;}, {&quot;id&quot;: &quot;aftermath&quot;, &quot;title&quot;: &quot;Crisis, Partition and Recovery&quot;, &quot;anchor&quot;: [26, 20], &quot;description&quot;: &quot;Conditional historical crisis branch. The 1974 coup/invasion can happen, be averted or diverge; no inevitable date-triggered partition.&quot;}, {&quot;id&quot;: &quot;party_0&quot;, &quot;title&quot;: &quot;A Western Security Presidency&quot;, &quot;anchor&quot;: [86, 0], &quot;description&quot;: &quot;Security expertise versus executive entrenchment; Western outlook does not confer NATO membership.&quot;}, {&quot;id&quot;: &quot;party_1&quot;, &quot;title&quot;: &quot;Makarios and the Independent Republic&quot;, &quot;anchor&quot;: [100, 0], &quot;description&quot;: &quot;Independence, coalition management and the church-state relationship. Not an automatic Enosis or Atlanticist route.&quot;}, {&quot;id&quot;: &quot;party_2&quot;, &quot;title&quot;: &quot;A Liberal Republican Alternative&quot;, &quot;anchor&quot;: [114, 0], &quot;description&quot;: &quot;Commercial liberalism versus social regulation; constitutional compromise versus administrative centralism.&quot;}, {&quot;id&quot;: &quot;party_3&quot;, &quot;title&quot;: &quot;EDEK and the Social Republic&quot;, &quot;anchor&quot;: [128, 0], &quot;description&quot;: &quot;A historical socialist movement, with non-aligned and democratic contacts; policy options are alternatives, not claims about a single fixed EDEK platform.&quot;}, {&quot;id&quot;: &quot;party_4&quot;, &quot;title&quot;: &quot;AKEL and the Workers&#x27; Republic&quot;, &quot;anchor&quot;: [86, 11], &quot;description&quot;: &quot;Labour institutions, coalition democracy versus party monopoly, and independent communism versus patron dependence.&quot;}, {&quot;id&quot;: &quot;party_5&quot;, &quot;title&quot;: &quot;A Federation of Workers&#x27; Councils&quot;, &quot;anchor&quot;: [100, 11], &quot;description&quot;: &quot;A genuinely decentralised alternate constitution; coordination costs and defence choices remain visible.&quot;}, {&quot;id&quot;: &quot;party_6&quot;, &quot;title&quot;: &quot;A Sovereign Development Bloc&quot;, &quot;anchor&quot;: [114, 11], &quot;description&quot;: &quot;Emerging conservative slot: sovereignty and selective Eastern cooperation, not a forced Marxist conversion.&quot;}, {&quot;id&quot;: &quot;party_7&quot;, &quot;title&quot;: &quot;A Development Directorate&quot;, &quot;anchor&quot;: [128, 11], &quot;description&quot;: &quot;Technocratic development versus military priorities; civilian restoration versus a permanent directorate.&quot;}, {&quot;id&quot;: &quot;party_8&quot;, &quot;title&quot;: &quot;A Consultative Clerical Experiment&quot;, &quot;anchor&quot;: [86, 22], &quot;description&quot;: &quot;The MD Shia slot is covered without presenting Turkish Cypriots as Shia or claiming an indigenous 1970 clerical party. Historical AI weight zero.&quot;}, {&quot;id&quot;: &quot;party_9&quot;, &quot;title&quot;: &quot;A Clerical Guardianship Regime&quot;, &quot;anchor&quot;: [100, 22], &quot;description&quot;: &quot;Civil administration versus clerical veto; no bonuses from religious persecution. Historical AI weight zero.&quot;}, {&quot;id&quot;: &quot;party_10&quot;, &quot;title&quot;: &quot;An Imported Religious Monarchy&quot;, once; no invented passive reward.&quot;, &quot;available_code&quot;: &quot;original_tag = CYP\nIMP_is_1970_scenario = yes\n&quot;}], &quot;event_contracts&quot;: {&quot;local_protocol&quot;: &quot;A CYP offer begins a local/community negotiation; acceptance halves named initial movement penalties. Refusal leaves them. Never treat TUR assent as a substitute for Turkish Cypriot assent.&quot;, &quot;constitutional_offer&quot;: &quot;Evaluate settlement progress, tension, both communities and their political representatives. Accepted offers unlock ratification, rejected offers preserve the current institutional penalties. One active conference instance only.&quot;, &quot;unitary_offer&quot;: &quot;Community representatives can refuse. No unilateral removal of constitutional breakdown. Failure adds 5 tension, not an automatic Turkish declaration of war.&quot;, &quot;federal_ratification&quot;: &quot;A dated or counterfactual federal compact requires consent from both communities; replace the old starting spirit with the agreed administrative programme. No transfer of state812.&quot;, &quot;shared_republic_ratification&quot;: &quot;A revised 1960-style central republic requires stronger settlement progress and both-community ratification; one settlement result flag, mutually exclusive with federation.&quot;, &quot;militia_disarmament&quot;: &quot;Supervised disarmament is negotiated across armed groups, not a blanket ethnic purge. Greek/other patrons may accept withdrawal or add coup pressure. No arbitrary free manpower.&quot;, &quot;reprisal_consequences&quot;: &quot;Abstract intimidation, killing, detention and forced displacement without operational detail. The focus applies tension+20 ONCE; the event adds displaced/missing-persons burden, affected-state destruction and the settlement block, without another tension debit. No population, GDP, core or military reward. Record perpetrating faction; apply the same harm rules to armed actors in either community.&quot;, &quot;crisis_conference&quot;: &quot;Offers to GRE/TUR/ENG plus local representatives. AI weighs actual regime, tension, claims and guarantees; human players decide. Refusal cannot force another player&#x27;s action.&quot;, &quot;turkish_crisis_response&quot;: &quot;When a junta-backed coup succeeds, TUR chooses diplomatic ultimatum, bounded intervention or broader invasion; GRE chooses support/withdrawal/escalation; ENG chooses mediation/base defence; no forced player choices.&quot;, &quot;ceasefire_offer&quot;: &quot;All belligerents must accept a ceasefire; war control is retained until a settlement. NCY administration can emerge conditionally after intervention; recognition is a later separate question, with the 1983 declaration not misdated to 1974.&quot;, &quot;enosis_debate&quot;: &quot;Open a diplomatic/political dispute without annexation. A hardline majority mandate does not imply Turkish Cypriot consent. Peaceful Enosis needs a separate ratification chain; unilateral Enosis increases crisis risk.&quot;, &quot;enosis_ratification&quot;: &quot;Recheck GRE/CYP and both-community assent, guarantees, war state and ownership on resolution. State145/146 transfer only under agreed terms. Warn that independent CYP play ends; state812 stays ENG without separate British assent. Block permanent-independence capstone reciprocally.&quot;, &quot;base_cooperation_offer&quot;: &quot;ENG can accept/refuse; only accepted projects enable modifiers. A proposed subsidy must debit the donor and credit CYP with the same amount, checked against funds. Cooperation is not sovereignty transfer.&quot;, &quot;base_sovereignty_offer&quot;: &quot;Negotiated transfer of state812 requires explicit ENG acceptance and local settlement safeguards. British refusal gives no free annexation or automatic casus belli.&quot;, &quot;guarantee_conference&quot;: &quot;Greece, Turkey and Britain each retain a response; local community consent matters separately. Revise only the guarantees to which the parties actually agree.&quot;, &quot;missing_persons_cooperation&quot;: &quot;A civilian investigation/family-support initiative can begin early. The historical bicommunal CMP is 1981-gated, or deliberately marked early alternate institution; cooperation does not erase crimes.&quot;, &quot;generic_bilateral_offer&quot;: &quot;Used by Greek training, Western/Eastern trade, technical agreements, patronage and crown offers. On focus completion send an offer; apply conditional benefits only after acceptance. No recurring free money, no automatic faction, license or guarantee. Timeout90 days returns no benefits; one accepted agreement per policy slot.&quot;, &quot;ankara_channel_offer&quot;: &quot;Used by Greek training, Western/Eastern trade, technical agreements, patronage and crown offers. On focus completion send an offer; apply conditional benefits only after acceptance. No recurring free money, no automatic faction, license or guarantee. Timeout90 days returns no benefits; one accepted agreement per policy slot.&quot;, &quot;crown_union_offer&quot;: &quot;Used by Greek training, Western/Eastern trade, technical agreements, patronage and crown offers. On focus completion send an offer; apply conditional benefits only after acceptance. No recurring free money, no automatic faction, license or guarantee. Timeout90 days returns no benefits; one accepted agreement per policy slot.&quot;, &quot;eastern_technical_offer&quot;: &quot;Used by Greek training, Western/Eastern trade, technical agreements, patronage and crown offers. On focus completion send an offer; apply conditional benefits only after acceptance. No recurring free money, no automatic faction, license or guarantee. Timeout90 days returns no benefits; one accepted agreement per policy slot.&quot;, &quot;eastern_trade_offer&quot;: &quot;Used by Greek training, Western/Eastern trade, technical agreements, patronage and crown offers. On focus completion send an offer; apply conditional benefits only after acceptance. y slot.&quot;}, &quot;sources&quot;: [{&quot;id&quot;: &quot;MD_GENERIC&quot;, &quot;path&quot;: &quot;E:/SteamLibrary/steamapps/workshop/content/394360/2777392649/common/national_focus/00_generic.txt&quot;, &quot;use&quot;: &quot;Layout, focus fields, costs, mutual exclusion and economic helper idioms.&quot;}, {&quot;id&quot;: &quot;MD_RUSSIA&quot;, &quot;path&quot;: &quot;E:/SteamLibrary/steamapps/workshop/content/394360/2777392649/common/national_focus/05_russia.txt&quot;, &quot;use&quot;: &quot;Separate political islands, shortcuts, leader paths and mixed political/economic rewards.&quot;}, {&quot;id&quot;: &quot;LOCAL_GENERIC&quot;, &quot;path&quot;: &quot;common/national_focus/mdcw_1970_generic_focus.txt&quot;, &quot;use&quot;: &quot;Compatible 1970 party gates, categories and rewards.&quot;}, {&quot;id&quot;: &quot;PARTY_GATES&quot;, &quot;path&quot;: &quot;common/scripted_triggers/01_political_triggers.txt:1&quot;, &quot;use&quot;: &quot;Exact 0-23 ruling_party index mapping.&quot;}, {&quot;id&quot;: &quot;PROGRAMMES&quot;, &quot;path&quot;: &quot;common/dynamic_modifiers/mdcw_1970_generic_party_programmes.txt:1&quot;, &quot;use&quot;: &quot;Active-party-only dynamic programmes; no party-switch stacking.&quot;}, {&quot;id&quot;: &quot;IMPERIA_UPKEEP&quot;, &quot;path&quot;: &quot;common/scripted_effects/mdcw_imperia_infrastructure_effects.txt:29&quot;, &quot;use&quot;: &quot;Real weekly upkeep; avoid casually granting costly infrastructure.&quot;}, {&quot;id&quot;: &quot;IMPERIA_REFUGEES&quot;, &quot;path&quot;: &quot;common/scripted_effects/imp_refugees_effects.txt:252&quot;, &quot;use&quot;: &quot;Registered refugee cost and integration system; not a safe generic setter for internal displacement.&quot;}, {&quot;id&quot;: &quot;CYP_HISTORY&quot;, &quot;path&quot;: &quot;history/countries/CYP - Cyprus.txt:4&quot;, &quot;use&quot;: &quot;Makarios and the current 1970 scenario profile.&quot;}, {&quot;id&quot;: &quot;IPU_1970&quot;, &quot;url&quot;: &quot;https     const sign = value =&gt; value &gt; 0 ? &#x27;+&#x27;+value : String(value);
    const numeric = (key,value) =&gt; {
      if (key === &#x27;interest_rate_multiplier_modifier&#x27;) return sign(value)+&#x27; pp interest&#x27;;
      if (key === &#x27;productivity_growth_modifier&#x27;) return sign(value)+&#x27; monthly base growth&#x27;;
