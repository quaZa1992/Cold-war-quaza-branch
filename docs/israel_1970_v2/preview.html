#isr-v2{--v2-bg:#23353c;--v2-panel:#2d3d43;--v2-deep:#17272e;--v2-heading:#d8c689;--v2-text:#e7e7da;--v2-muted:#b6c2c4;--v2-line:#9eafb0;--v2-border:#5e7074;--v2-gain:#b7d8a9;--v2-cost:#e8ad98;--v2-selected:#4a5547;color:var(--v2-text);font:14px/1.45 Arial,sans-serif;}

#isr-v2 select{display:block;width:100%;max-width:100%;margin-top:4px;padding:8px 29px 8px 9px;background:#35484e;color:var(--v2-text);border:1px solid #818c7e;border-radius:2px;font:14px/1.3 Arial,sans-serif;}

#isr-v2 .v2-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

#isr-v2 .v2-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
